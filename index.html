<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8C4A23" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>MishiMaya Mérida — v10.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="calico"] { --font-display:'Fredoka',sans-serif; --font-body:'Quicksand',sans-serif; --bg-yard:#FDF6E2; --yard-pat:none; --bg-card:#FFFDF7; --bg-subcard:#F5EBD1; --wood-main:#C87D4B; --wood-dark:#8C4A23; --outline:#4A3222; --text-main:#3D2618; --car-camp:#FFFBEB; --car-sup:#ECFDF5; --car-amt:#065F46; --pill-idle:#FFFDF7; }
    [data-theme="tabby"]  { --bg-yard:#FDE68A; --yard-pat:repeating-linear-gradient(135deg,rgba(180,83,9,0.09) 0px,rgba(180,83,9,0.09) 10px,transparent 10px,transparent 22px); --bg-card:#FFFBEB; --bg-subcard:#FEF3C7; --wood-main:#D97706; --wood-dark:#92400E; --outline:#5B3412; --text-main:#452309; --car-camp:#FEF3C7; --car-sup:#ECFDF5; --car-amt:#065F46; --pill-idle:#FFFBEB; }
    [data-theme="tortie"] { --bg-yard:#140E0B; --yard-pat:radial-gradient(circle at 18% 22%,rgba(217,119,6,0.24) 0%,transparent 38%),radial-gradient(circle at 82% 68%,rgba(234,88,12,0.20) 0%,transparent 42%),radial-gradient(circle at 50% 85%,rgba(253,230,138,0.12) 0%,transparent 35%); --bg-card:#261B15; --bg-subcard:#36261D; --wood-main:#9A4E24; --wood-dark:#431E09; --outline:#F59E0B; --text-main:#FFFBEB; --car-camp:#36261D; --car-sup:#2C221E; --car-amt:#FDE68A; --pill-idle:#36261D; }
    [data-theme="void"]   { --bg-yard:#12131A; --yard-pat:radial-gradient(circle at 75% 15%,rgba(251,191,36,0.09) 0%,transparent 40%); --bg-card:#1E202B; --bg-subcard:#282B3A; --wood-main:#2E3244; --wood-dark:#181A24; --outline:#FBBF24; --text-main:#F5F3EF; --car-camp:#282B3A; --car-sup:#252836; --car-amt:#FDE68A; --pill-idle:#282B3A; }

    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; padding:0; width:100%; height:100dvh; overflow:hidden; font-family:var(--font-body); background:#140F0C; font-size:12.5px; }
    .font-neko { font-family:var(--font-display); }
    #apk-shell { width:100%; max-width:480px; height:100dvh; margin:0 auto; display:flex; flex-direction:column; background-color:var(--bg-yard); background-image:var(--yard-pat); color:var(--text-main); position:relative; overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,0.85); }
    .neko-wood-top { background:linear-gradient(180deg,var(--wood-main) 0%,var(--wood-dark) 100%); border-bottom:3.5px solid var(--outline); min-height:66px; padding-top:max(10px,env(safe-area-inset-top)); padding-bottom:10px; display:flex; align-items:center; }
    .neko-wood-bottom { background:linear-gradient(0deg,var(--wood-dark) 0%,var(--wood-main) 100%); border-top:3.5px solid var(--outline); min-height:110px; padding-top:10px; padding-bottom:calc(28px + env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:center; }
    .neko-card { background:var(--bg-card); border:2.5px solid var(--outline); border-radius:16px; box-shadow:0 3.5px 0 var(--outline); color:var(--text-main); }
    .neko-subcard { background:var(--bg-subcard); border:1.8px dashed var(--outline); border-radius:11px; color:var(--text-main); }
    .neko-btn { font-family:var(--font-display); border:2px solid #2B1B10; border-radius:12px; box-shadow:0 2.5px 0 #2B1B10; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; text-align:center; line-height:1.1; transition:transform 0.14s cubic-bezier(0.34,1.56,0.64,1); }
    .neko-btn:active { transform:translateY(2px) scale(0.97); box-shadow:0 1px 0 #2B1B10; }
    .cards-scroll-window { flex:1; overflow-y:auto; padding:6px 4px 18px 4px; position:relative; }
    #map-tab-container { position:absolute; inset:0; width:100%; height:100%; padding:6px 8px 8px 8px; display:flex; flex-direction:column; }
    #map-frame-inner { position:relative; flex:1; width:100%; height:100%; min-height:200px; border-radius:18px; border:3.5px solid var(--outline); box-shadow:0 3.5px 0 var(--outline); overflow:hidden; background:#E6CCB2; }
    #merida-map { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
    .leaflet-container img, .leaflet-tile { max-width:none !important; max-height:none !important; }
    .leaflet-control-attribution { display:none !important; }
    .neko-warm-tiles .leaflet-tile-pane { filter:sepia(0.16) saturate(1.12); }
    .leaflet-div-icon-neko { background:transparent !important; border:none !important; }

    .neko-pin-wrap { position:relative; width:44px; height:52px; display:flex; flex-direction:column; align-items:center; cursor:pointer; filter:drop-shadow(0 3px 0 #2B1B10); }
    .neko-pin-head { width:38px; height:38px; border-radius:999px; border:2.5px solid #2B1B10; box-shadow:inset 0 2.5px 0 rgba(255,255,255,0.45); display:flex; align-items:center; justify-content:center; position:relative; z-index:2; }
    .neko-pin-tip { width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-top:10px solid #2B1B10; margin-top:-2px; z-index:1; }
    .neko-pin-dot { width:5px; height:5px; border-radius:999px; background:#FFFDF7; border:1.5px solid #2B1B10; margin-top:-2px; }
    @keyframes pulse-ring { 0% { transform:scale(0.95); opacity:0.95; } 100% { transform:scale(1.65); opacity:0; } }
    @keyframes sosBeat { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
    @keyframes nekoTilt { 0%,100% { transform:rotate(0deg); } 25% { transform:rotate(-7deg); } 75% { transform:rotate(7deg); } }
    @keyframes nekoBounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
    @keyframes nekoFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-2.5px); } }
    .sos-ring::before { content:''; position:absolute; inset:-5px; border-radius:999px; border:3px solid #EF4444; animation:pulse-ring 1.5s infinite ease-out; pointer-events:none; }
    .pin-anim-emergency { animation:sosBeat 1.3s infinite ease-in-out; }
    .pin-anim-sighting { animation:nekoTilt 2.8s infinite ease-in-out; transform-origin:bottom center; }
    .pin-anim-colony { animation:nekoBounce 2.2s infinite ease-in-out; }
    .pin-anim-shelter, .pin-anim-clinic { animation:nekoFloat 2.8s infinite ease-in-out; }

    .interlocked-dock { display:flex; align-items:center; justify-content:center; position:relative; width:100%; margin-left:auto; margin-right:auto; }
    .nav-wing-left { height:50px; border-radius:25px 0 0 25px; padding-right:26px; padding-left:14px; margin-right:-22px; z-index:1; }
    .nav-wing-right { height:50px; border-radius:0 25px 25px 0; padding-left:26px; padding-right:14px; margin-left:-22px; z-index:1; }
    .nav-center-orb { width:68px; height:68px; border-radius:9999px; z-index:3; position:relative; box-shadow:0 4px 0 #2B1B10, 0 0 0 4px var(--wood-dark); }
    .cam-wing-left { height:46px; border-radius:23px 0 0 23px; padding-right:20px; padding-left:12px; margin-right:-16px; z-index:1; }
    .cam-wing-right { height:46px; border-radius:0 23px 23px 0; padding-left:20px; padding-right:12px; margin-left:-16px; z-index:1; }
    .cam-center-orb { width:62px; height:62px; border-radius:9999px; z-index:3; position:relative; box-shadow:0 3.5px 0 #2B1B10, 0 0 0 3.5px var(--bg-card); }

    .flip-card { perspective:1000px; height:128px; cursor:pointer; }
    .flip-inner { position:relative; width:100%; height:100%; transition:transform 0.5s; transform-style:preserve-3d; }
    .flip-card.flipped .flip-inner { transform:rotateY(180deg); }
    .flip-front, .flip-back { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:11px; padding:8px; display:flex; flex-direction:column; justify-content:space-between; }
    .flip-back { transform:rotateY(180deg); }
    .badge-num { position:absolute; top:-6px; right:-4px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:#EF4444; color:#FFF; font-family:var(--font-display); font-size:9.5px; font-weight:700; border:1.8px solid #2B1B10; box-shadow:0 1.5px 0 #2B1B10; display:inline-flex; align-items:center; justify-content:center; line-height:1; z-index:20; }
    .action-tag-notif { display:inline-flex; align-items:center; justify-content:center; padding:1px 4px; border-radius:99px; background:#EF4444; color:#FFF; font-size:8px; font-weight:700; border:1px solid #2B1B10; margin-left:3px; line-height:1; }
    .compact-carousel-strip { height:42px; overflow:hidden; position:relative; width:100%; border-radius:12px; border:2px solid var(--outline); background:var(--bg-card); box-shadow:0 2px 0 var(--outline); flex-shrink:0; }
    .compact-carousel-track { display:flex; height:100%; width:100%; transition:transform 0.65s cubic-bezier(0.22, 1, 0.36, 1); }
    .compact-carousel-slide { min-width:100%; height:100%; display:flex; align-items:center; justify-content:space-between; padding:0 8px; cursor:pointer; color:var(--text-main); }
    .neko-prog-fill { transition:width 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
    #admob-guard-host { height:56px; padding:3px 8px; background:rgba(20,15,12,0.92); border-bottom:2.5px solid var(--outline); z-index:20; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    @keyframes nudgeRight { 0%,100% { transform:translateX(0); } 50% { transform:translateX(4px); } }
    .scroll-hint-arrow { animation:nudgeRight 1.2s infinite ease-in-out; }
    @keyframes confettiFall { 0% { transform:translateY(-10px) rotate(0deg); opacity:1; } 100% { transform:translateY(220px) rotate(360deg); opacity:0; } }
    .confetti-piece { position:fixed; z-index:900; pointer-events:none; font-size:18px; animation:confettiFall 1.8s ease-out forwards; }
    ::-webkit-scrollbar { width:3px; height:3px; }
  </style>
</head>
<body>
  <div id="apk-shell" data-theme="calico">
    <header class="neko-wood-top px-3 gap-2 z-30 shrink-0">
      <div onclick="openKarmaExpInfoModal()" class="flex-1 bg-[var(--bg-card)] border-2 border-[#2B1B10] rounded-xl px-2.5 py-1.5 shadow-[0_2.5px_0_#2B1B10] cursor-pointer min-w-0">
        <div class="flex items-center justify-between text-[10px] font-neko font-bold text-[var(--text-main)]">
          <span id="top-exp-rank" class="truncate">Lv.3 • 🛡️ Veterano TNR (3 PA)</span>
          <span class="text-amber-500 shrink-0 ml-1">🐟 <span id="top-karma-val">1,450</span> EXP</span>
        </div>
        <div class="w-full h-2 rounded-full bg-stone-300 border border-[#2B1B10] overflow-hidden mt-1">
          <div id="top-exp-bar" class="bg-gradient-to-r from-amber-400 via-orange-500 to-emerald-400 h-full neko-prog-fill" style="width:72%"></div>
        </div>
      </div>
      <button type="button" onclick="openAuthAndOnboardingModal('volunteer')" class="neko-btn bg-amber-300 text-[#2B1B10] px-2.5 py-2 text-[10px] font-bold shrink-0">🔑 Cuenta</button>
      <button type="button" onclick="toggleRightDrawer(true)" class="neko-btn bg-[var(--bg-card)] text-[var(--text-main)] px-2.5 py-1.5 gap-1.5 shrink-0">
        <div id="top-cat-icon" class="w-6 h-6 rounded-lg bg-amber-100 border border-[#2B1B10] flex items-center justify-center"></div>
        <span class="font-neko font-bold text-sm">☰</span>
      </button>
    </header>

    <div id="admob-guard-host"></div>

    <main class="flex-1 relative overflow-hidden">
      <div id="swipe-guide-pill" class="hidden absolute top-14 left-1/2 -translate-x-1/2 z-[500] px-3 py-1 rounded-full bg-[#2B1B10]/90 text-amber-300 font-neko font-bold text-[10px] shadow-lg pointer-events-none whitespace-nowrap">‹ Desliza horizontalmente para cambiar sección ›</div>

      <section id="main-tab-shelters" class="hidden h-full flex flex-col p-2.5 gap-1.5 overflow-hidden">
        <div class="grid grid-cols-4 gap-1.5 bg-black/15 pt-2.5 pb-1.5 px-1.5 rounded-xl border-2 border-[var(--outline)] shrink-0">
          <button type="button" onclick="setSubTab('shelters','list')" id="subbtn-shelters-list" class="neko-btn py-1.5 text-[10px] font-bold bg-[#F97316] text-white gap-1 relative"><span id="ico-sh-1"></span><span>Refugios</span><span id="badge-sh-list" class="badge-num">1</span></button>
          <button type="button" onclick="setSubTab('shelters','adopt')" id="subbtn-shelters-adopt" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-sh-2"></span><span>Adopción</span><span id="badge-sh-adopt" class="badge-num">1</span></button>
          <button type="button" onclick="setSubTab('shelters','campaigns')" id="subbtn-shelters-campaigns" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-sh-3"></span><span>Campañas</span><span id="badge-sh-camp" class="badge-num">2</span></button>
          <button type="button" onclick="setSubTab('shelters','supplies')" id="subbtn-shelters-supplies" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-sh-4"></span><span>Insumos</span><span id="badge-sh-sup" class="badge-num">3</span></button>
        </div>
        <div class="compact-carousel-strip" id="compact-carousel-top-shelters"></div>
        <div id="swipe-area-shelters" class="cards-scroll-window space-y-2.5">
          <div id="subview-shelters-list" class="space-y-2.5"></div>
          <div id="subview-shelters-adopt" class="hidden space-y-2.5"></div>
          <div id="subview-shelters-campaigns" class="hidden space-y-2.5"></div>
          <div id="subview-shelters-supplies" class="hidden space-y-2.5"></div>
        </div>
        <div class="compact-carousel-strip" id="compact-carousel-bottom-shelters"></div>
      </section>

      <section id="main-tab-map" class="h-full w-full relative">
        <div id="map-tab-container">
          <div id="map-frame-inner" class="neko-warm-tiles">
            <div id="merida-map"></div>
            <div class="absolute top-1.5 left-2 right-2 z-[420] flex items-center pointer-events-none">
              <div id="map-filters-scroll" onscroll="checkFilterScrollHint(this)" class="flex items-center gap-1.5 overflow-x-auto pt-2.5 pb-1.5 px-1 pr-10 pointer-events-auto w-full">
                <button type="button" onclick="setMapPinFilter('all')" id="mfilter-all" class="neko-btn px-2.5 py-1 bg-[#F97316] text-white text-[10px] font-bold whitespace-nowrap gap-1"><span id="ico-mf-all"></span><span>Todos</span></button>
                <button type="button" onclick="jumpToMapFilterPin('emergency')" id="mfilter-emergency" class="neko-btn px-2.5 py-1 bg-[var(--pill-idle)] text-[var(--text-main)] text-[10px] font-bold whitespace-nowrap gap-1 relative"><span id="ico-mf-sos"></span><span>SOS</span><span id="badge-map-sos" class="badge-num">1</span></button>
                <button type="button" onclick="jumpToMapFilterPin('sighting')" id="mfilter-sighting" class="neko-btn px-2.5 py-1 bg-[var(--pill-idle)] text-[var(--text-main)] text-[10px] font-bold whitespace-nowrap gap-1 relative"><span id="ico-mf-sig"></span><span>Avistados</span><span id="badge-map-sig" class="badge-num">1</span></button>
                <button type="button" onclick="setMapPinFilter('colony')" id="mfilter-colony" class="neko-btn px-2.5 py-1 bg-[var(--pill-idle)] text-[var(--text-main)] text-[10px] font-bold whitespace-nowrap gap-1"><span id="ico-mf-col"></span><span>Colonias</span></button>
                <button type="button" onclick="setMapPinFilter('shelters')" id="mfilter-shelters" class="neko-btn px-2.5 py-1 bg-[var(--pill-idle)] text-[var(--text-main)] text-[10px] font-bold whitespace-nowrap gap-1"><span id="ico-mf-sh"></span><span>Refugios</span></button>
                <button type="button" onclick="jumpToMapFilterPin('clinics')" id="mfilter-clinics" class="neko-btn px-2.5 py-1 bg-[var(--pill-idle)] text-[var(--text-main)] text-[10px] font-bold whitespace-nowrap gap-1 relative"><span id="ico-mf-cl"></span><span>Clínicas</span><span id="badge-map-cl" class="badge-num">1</span></button>
              </div>
              <button type="button" id="filter-scroll-hint" onclick="nudgeFiltersRight()" class="pointer-events-auto absolute right-0 top-2.5 w-7 h-7 rounded-full bg-[#2B1B10] text-amber-300 border-2 border-amber-300 flex items-center justify-center font-neko font-bold text-xs shadow-md scroll-hint-arrow z-30">❯</button>
            </div>

            <div class="absolute right-2.5 top-16 z-[480] flex flex-col gap-1.5">
              <button type="button" onclick="openMapNotificationsCenter()" class="neko-btn w-9 h-9 bg-rose-500 text-white flex-col gap-0.5 relative"><span id="ico-ctrl-bell"></span><span id="gps-notif-count" class="text-[8px] font-bold leading-none">3</span></button>
              <button type="button" onclick="centerOnUserGPS(true)" class="neko-btn w-9 h-9 bg-emerald-400 text-[#2B1B10] flex-col gap-0.5"><span id="ico-ctrl-gps"></span><span class="text-[6.5px] font-bold leading-none">GPS</span></button>
              <button type="button" onclick="zoomMap(1)" class="neko-btn w-9 h-8 bg-[var(--bg-card)] text-[var(--text-main)] font-bold text-base">+</button>
              <button type="button" onclick="zoomMap(-1)" class="neko-btn w-9 h-8 bg-[var(--bg-card)] text-[var(--text-main)] font-bold text-base">−</button>
              <button type="button" onclick="ClusterEngine.zoomOutOverview()" class="neko-btn w-9 h-9 bg-amber-300 text-[#2B1B10] flex-col gap-0.5"><span id="ico-ctrl-zones"></span><span class="text-[7px] font-bold leading-none">Zonas</span></button>
            </div>

            <div id="map-pin-card" class="hidden absolute bottom-24 left-2.5 right-2.5 z-[490] neko-card p-3 shadow-2xl"></div>

            <div class="absolute bottom-4 left-2 right-2 z-[450] flex justify-center pointer-events-none">
              <div class="interlocked-dock max-w-[305px] w-full pointer-events-auto">
                <button type="button" onclick="openCameraReportModal('emergency')" class="neko-btn cam-wing-left flex-1 bg-rose-500 text-white flex-col gap-0.5"><span id="ico-cam-sos"></span><span class="text-[10px] font-bold leading-none">SOS</span></button>
                <button type="button" onclick="openUniversalReportHub()" class="neko-btn cam-center-orb bg-sky-400 text-[#2B1B10] flex-col gap-0.5 shrink-0"><span id="ico-cam-orb"></span><span class="text-[8.5px] font-extrabold uppercase leading-none">Reportar</span></button>
                <button type="button" onclick="openCameraReportModal('colony')" class="neko-btn cam-wing-right flex-1 bg-amber-400 text-[#2B1B10] flex-col gap-0.5"><span id="ico-cam-col"></span><span class="text-[10px] font-bold leading-none">Colonia</span></button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="main-tab-clinics" class="hidden h-full flex flex-col p-2.5 gap-1.5 overflow-hidden">
        <div class="grid grid-cols-4 gap-1.5 bg-black/15 pt-2.5 pb-1.5 px-1.5 rounded-xl border-2 border-[var(--outline)] shrink-0">
          <button type="button" onclick="setSubTab('clinics','triage')" id="subbtn-clinics-triage" class="neko-btn py-1.5 text-[10px] font-bold bg-[#F97316] text-white gap-1 relative"><span id="ico-cl-1"></span><span>Clínicas</span><span id="badge-cl-triage" class="badge-num">1</span></button>
          <button type="button" onclick="setSubTab('clinics','adopt')" id="subbtn-clinics-adopt" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-cl-2"></span><span>Adopción</span><span id="badge-cl-adopt" class="badge-num">1</span></button>
          <button type="button" onclick="setSubTab('clinics','campaigns')" id="subbtn-clinics-campaigns" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-cl-3"></span><span>Campañas</span><span id="badge-cl-camp" class="badge-num">2</span></button>
          <button type="button" onclick="setSubTab('clinics','supplies')" id="subbtn-clinics-supplies" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-cl-4"></span><span>Insumos</span><span id="badge-cl-sup" class="badge-num">2</span></button>
        </div>
        <div class="compact-carousel-strip" id="compact-carousel-top-clinics"></div>
        <div id="swipe-area-clinics" class="cards-scroll-window space-y-2.5">
          <div id="subview-clinics-triage" class="space-y-2.5"></div>
          <div id="subview-clinics-adopt" class="hidden space-y-2.5"></div>
          <div id="subview-clinics-campaigns" class="hidden space-y-2.5"></div>
          <div id="subview-clinics-supplies" class="hidden space-y-2.5"></div>
        </div>
        <div class="compact-carousel-strip" id="compact-carousel-bottom-clinics"></div>
      </section>
    </main>

    <script>

    function notify(msg) {
      const box = document.getElementById('apk-toast');
      document.getElementById('apk-toast-text').textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => box.classList.add('hidden'), 2800);
    }

    function launchConfetti() {
      ['🐾', '🎉', '✨', '🐟', '💛', '🎊'].forEach((em, idx) => {
        for (let i = 0; i < 4; i++) {
          const el = document.createElement('div');
          el.className = 'confetti-piece';
          el.textContent = em;
          el.style.left = Math.round(10 + Math.random() * 80) + 'vw';
          el.style.top = Math.round(15 + Math.random() * 25) + 'vh';
          el.style.animationDelay = (idx * 0.06 + i * 0.08) + 's';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 2100);
        }
      });

    function catAvatarSvg(coat) {

    function openSocialPosterGenerator(category, title, subtitle, footerInfo, badgeText) {

        ctx.fillStyle = '#FDE68A'; ctx.beginPath(); ctx.arc(360, 340, 62, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    function shareCanvasPosterNative(title) {

        if (!blob) return;
        const file = new File([blob], 'mishimaya_poster.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ title: 'MishiMaya — ' + title, files: [file] }); state.karma += 20; renderAll(); return; } catch (e) {}

    function openAuthAndOnboardingModal(selectedRole = 'volunteer') {

    function completeOnboardingQuiz(ev, role) {
      ev.preventDefault();
      const email = document.getElementById('auth-email-inp')?.value || 'usuario@mishimaya.mx';

        state.session = { role: 'volunteer', paWeight: pa, label: titles[pa], email };
      } else if (role === 'clinic' || role === 'shelter') {
        const name = document.getElementById('ob-name').value.trim(), zone = document.getElementById('ob-zone').value.trim();

        else state.shelters.unshift({ id, name, zone, whatsapp: wa, hours, coordinator: email.split('@')[0], services, clabe, lat, lng, activeCats: 15, maxCapacity: Math.max(10, parseInt(extra, 10) || 25) });
        state.session = { role, paWeight: 6, label: `${role === 'clinic' ? '🏥' : '🏡'} ${name} (6 PA)`, email };
      } else { state.session = { role: 'admin', paWeight: 10, label: '👑 Admin Moderador (10 PA)', email }; }

      notify(`🎉 Rol activo: ${state.session.label}`);

    function openInteractiveTutorialModal(step = 0) {

    function updateAllLogicalBadges() {

    function renderCompactCarousels() {

        }
        const openSups = state.supplies.filter(s => s.targetType === tType && !s.fulfilled);

    function startCarouselTimer() {
      if (carouselTimer) clearInterval(carouselTimer);
      carouselTimer = setInterval(() => {
        ['shTop:track-top-shelters', 'shBot:track-bot-shelters', 'clTop:track-top-clinics', 'clBot:track-bot-clinics'].forEach(pair => {
          const [key, id] = pair.split(':'), tr = document.getElementById(id);
          if (!tr || tr.children.length <= 1) return;
          carouselIdx[key] = (carouselIdx[key] + 1) % tr.children.length;
          tr.style.transform = `translateX(-${carouselIdx[key] * 100}%)`;
        });
      }, 3500);
    }

    const ClusterEngine = {
      getRadiusForZoom(z) { return z <= 11.5 ? 0.042 : (z <= 13 ? 0.020 : 0); },
      collectVisiblePins() {
        const flt = state.mapPinFilter, pins = [];
        state.streetItems.forEach(item => {
          if (flt !== 'all' && flt !== item.type) return;
          const badge = item.quarantineNotice ? '⏳Retiro' : (item.type === 'emergency' ? 'SOS' : `${item.paScore || 1}/${item.paRequired || 3}PA`);
          pins.push({ lat: item.lat, lng: item.lng, kind: item.type, overlayKind: 'street', id: item.id, badge, isGrey: false });
        });
        if (flt === 'all' || flt === 'shelters') state.shelters.forEach(s => pins.push({ lat: s.lat, lng: s.lng, kind: 'shelter', overlayKind: 'shelter', id: s.id, badge: '', isGrey: false }));
        if (flt === 'all' || flt === 'clinics') state.clinics.forEach(c => pins.push({ lat: c.lat, lng: c.lng, kind: 'clinic', overlayKind: 'clinic', id: c.id, badge: !c.confirmed ? `${c.paScore || 1}/6PA` : '', isGrey: !c.confirmed }));
        return pins;
      },
      buildClusters(pins, radius) {
        if (radius <= 0) return pins.map(p => ({ items: [p], lat: p.lat, lng: p.lng }));
        const groups = [];
        pins.forEach(p => {
          const g = groups.find(x => Math.hypot(x.lat - p.lat, x.lng - p.lng) < radius);
          if (g) { g.items.push(p); g.lat = g.items.reduce((s, i) => s + i.lat, 0) / g.items.length; g.lng = g.items.reduce((s, i) => s + i.lng, 0) / g.items.length; }
          else groups.push({ lat: p.lat, lng: p.lng, items: [p] });
        });
        return groups;
      },
      declusterGroup(group) {
        if (!mapInstance || !group || !group.items.length) return;
        if (group.items.length === 1) { showPinCardOverlay(group.items[0].overlayKind, group.items[0].id); return; }
        mapInstance.flyToBounds(L.latLngBounds(group.items.map(i => [i.lat, i.lng])), { padding: [52, 52], maxZoom: 14.8, duration: 0.5 });
      },
      zoomOutOverview() { if (mapInstance) { closeMapPinCard(); mapInstance.flyTo([20.9865, -89.6250], 11.2, { duration: 0.5 }); notify('🐾 Vista Zonas activada ✓'); } }
    };

    function createPointedPinIcon(kind, extraBadge, isGreyClinic) {
      const cfg = {
        emergency: { bg: '#EF4444', ring: ' sos-ring', anim: 'pin-anim-emergency', ico: nekoSvg('sos', 'w-5 h-5') },
        sighting:  { bg: '#38BDF8', ring: '', anim: 'pin-anim-sighting', ico: nekoSvg('cat', 'w-5 h-5') },
        colony:    { bg: '#FBBF24', ring: '', anim: 'pin-anim-colony', ico: nekoSvg('bowl', 'w-5 h-5') },
        shelter:   { bg: '#C87D4B', ring: '', anim: 'pin-anim-shelter', ico: nekoSvg('house', 'w-5 h-5') },
        clinic:    { bg: isGreyClinic ? '#9CA3AF' : '#10B981', ring: '', anim: 'pin-anim-clinic', ico: nekoSvg('clinic', 'w-5 h-5') }
      }[kind] || { bg: '#F97316', ring: '', anim: '', ico: nekoSvg('paw', 'w-5 h-5') };
      const tagHtml = extraBadge ? `<span class="absolute -top-2.5 -right-3 px-1.5 py-0.5 rounded-full bg-[#2B1B10] text-amber-300 font-neko font-bold text-[8px] border border-amber-300 shadow z-20">${extraBadge}</span>` : '';
      return L.divIcon({ className: 'leaflet-div-icon-neko', html: `<div class="neko-pin-wrap ${cfg.anim}"><div class="neko-pin-head${cfg.ring}" style="background:${cfg.bg}">${tagHtml}${cfg.ico}</div><div class="neko-pin-tip"></div><div class="neko-pin-dot"></div></div>`, iconSize: [44, 52], iconAnchor: [22, 50] });
    }

    function initMap() {
      if (mapInstance) return;
      const el = document.getElementById('merida-map');
      if (!el || typeof L === 'undefined') return;
      mapInstance = L.map('merida-map', { center: [state.userCoords.lat, state.userCoords.lng], zoom: 13, zoomControl: false, attributionControl: false });
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapInstance);
      markersLayer = L.layerGroup().addTo(mapInstance);
      mapInstance.on('zoomend', () => renderHomeMapTab());
      setTimeout(() => mapInstance.invalidateSize(), 200);
    }

    function zoomMap(d) { if (mapInstance) mapInstance.setZoom(mapInstance.getZoom() + d); }

    function renderHomeMapTab() {
      initMap(); if (!markersLayer) return; markersLayer.clearLayers();
      const zoom = mapInstance ? mapInstance.getZoom() : 13;
      L.marker([state.userCoords.lat, state.userCoords.lng], { icon: L.divIcon({ className: 'leaflet-div-icon-neko', html: `<div class="w-4 h-4 rounded-full bg-emerald-500 border-2 border-white shadow-md"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(markersLayer);
      const groups = ClusterEngine.buildClusters(ClusterEngine.collectVisiblePins(), ClusterEngine.getRadiusForZoom(zoom));
      groups.forEach(g => {
        if (g.items.length > 1) {
          const cIcon = L.divIcon({ className: 'leaflet-div-icon-neko', html: `<div class="neko-pin-wrap pin-anim-colony"><div class="neko-pin-head" style="background:#F97316;color:#FFF;font-family:Fredoka;font-weight:700;font-size:11px">🐾 ${g.items.length}</div><div class="neko-pin-tip"></div><div class="neko-pin-dot"></div></div>`, iconSize: [44, 52], iconAnchor: [22, 50] });
          L.marker([g.lat, g.lng], { icon: cIcon }).on('click', () => ClusterEngine.declusterGroup(g)).addTo(markersLayer);
        } else {
          const p = g.items[0];
          L.marker([p.lat, p.lng], { icon: createPointedPinIcon(p.kind, p.badge, p.isGrey) }).on('click', () => showPinCardOverlay(p.overlayKind, p.id)).addTo(markersLayer);
        }
      });
    }

    async function startLiveCamera() {
      const v = document.getElementById('live-cam-video');
      if (!v || !navigator.mediaDevices?.getUserMedia) { notify('Usa la opción de archivo abajo.'); return; }
      try { stopLiveCameraStream(); activeCamStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); v.srcObject = activeCamStream; v.classList.remove('hidden'); }
      catch (e) { notify('Usa la opción de archivo para abrir la cámara de tu teléfono.'); }
    }

    function captureFrameFromVideo() {
      const v = document.getElementById('live-cam-video'), img = document.getElementById('captured-photo-preview');
      if (!v || v.classList.contains('hidden')) return;
      const cv = document.createElement('canvas'); cv.width = 360; cv.height = 240; cv.getContext('2d').drawImage(v, 0, 0, 360, 240);
      window.lastCapturedDataUrl = cv.toDataURL('image/jpeg', 0.8);
      if (img) { img.src = window.lastCapturedDataUrl; img.classList.remove('hidden'); }
      v.classList.add('hidden'); stopLiveCameraStream(); notify('📸 ¡Foto capturada!');
    }

    function handleFilePhotoUpload(ev) {
      const file = ev.target.files?.[0]; if (!file) return;
      const r = new FileReader();
      r.onload = e => { window.lastCapturedDataUrl = e.target.result; const img = document.getElementById('captured-photo-preview'); if (img) { img.src = window.lastCapturedDataUrl; img.classList.remove('hidden'); } notify('📸 Foto cargada ✓'); };
      r.readAsDataURL(file);
    }

        inAppMessages: ['Pin creado con cámara.'],
        folderPhotos: [{ kind: 'cat', label: '🐱 Foto Gato', note: title, imgData: window.lastCapturedDataUrl || '' }, { kind: 'landmark', label: '📍 Landmark', note: lm, imgData: '' }]

      window.lastCapturedDataUrl = ''; state.karma += 50; closeCenterModal(); switchMainTab('map'); renderAll(); showPinCardOverlay('street', id);
      notify('📍 Pin publicado (+50🐟) ✓');

      document.getElementById('subview-shelters-supplies').innerHTML = renderGroupedSuppliesByEntity('shelter');
    }

    function renderClinicsTab() {

              <button type="button" onclick="openSocialPosterGenerator('CLÍNICA FELINA','${c.name.replace(/'/g, '')}','📍 ${c.zone} • ${c.hours}','Servicios: ${c.services.join(', ')}','CLABE: ${c.clabe}')" class="neko-btn px-2 py-0.5 bg-sky-300 text-[#2B1B10] font-bold text-[8.5px]">📸 Póster</button>

                <button type="button" onclick="claimGreyClinicOfficial('${c.id}')" class="neko-btn py-1.5 bg-emerald-400 text-[#2B1B10] font-bold text-[9.5px]">🏥 Soy la Clínica</button>

                <button type="button" onclick="openEntityDetailModal('clinic','${c.id}','campaigns')" class="neko-btn py-1.5 bg-[var(--pill-idle)] text-[var(--text-main)] font-bold text-[9px]">💝 Campañas ${cN ? `<span class="action-tag-notif">🔔${cN}</span>` : ''}</button>
                <button type="button" onclick="openEntityDetailModal('clinic','${c.id}','supplies')" class="neko-btn py-1.5 bg-amber-300 text-[#2B1B10] font-bold text-[9px]">📦 Insumos ${sN ? `<span class="action-tag-notif">🔔${sN}</span>` : ''}</button>
                <button type="button" onclick="openEntityDetailModal('clinic','${c.id}','adopt')" class="neko-btn py-1.5 bg-emerald-300 text-[#2B1B10] font-bold text-[9px]">🐱 Adopción ${aN ? `<span class="action-tag-notif">🔔${aN}</span>` : ''}</button>

    function renderGroupedSuppliesByEntity(targetType) {
      const entities = targetType === 'shelter' ? state.shelters : state.clinics.filter(c => c.confirmed);
      return entities.map(ent => {
        const activeItems = state.supplies.filter(s => s.targetType === targetType && s.entityId === ent.id && !s.fulfilled);
        const rowsHtml = activeItems.length ? activeItems.map(s => `
          <div class="p-2 neko-subcard flex items-center justify-between gap-2">
            <div class="min-w-0 flex-1">
              <p class="font-neko font-bold text-[10.5px] truncate"><span class="px-1.5 py-0.2 rounded bg-rose-500 text-white text-[8px] mr-1">🔔 ${s.badge}</span>${s.title}</p>
              <p class="text-[9px] opacity-80">${s.sub}</p>
            </div>
            <button type="button" onclick="purchaseAndRemoveSupply('${s.id}')" class="neko-btn px-2.5 py-1.5 bg-amber-400 text-[#2B1B10] font-bold text-[9px] shrink-0">🛒 Comprar</button>
          </div>`).join('') : `<div class="p-2.5 neko-subcard text-center text-[10px] font-neko font-bold text-emerald-700">🎉 ¡Lista de ${ent.name} cubierta al 100%!</div>`;
        return `
          <div class="neko-card p-3 space-y-2 text-[11px]">
            <div class="flex items-center justify-between border-b border-[var(--outline)]/20 pb-1.5">
              <div><h4 class="font-neko font-bold text-xs">📦 Lista de Insumos: ${ent.name}</h4><p class="text-[9px] opacity-75">Se eliminan al comprarse para evitar excesos</p></div>
              <button type="button" onclick="openSocialPosterGenerator('LISTA DE INSUMOS','${ent.name.replace(/'/g, '')}','Faltan: ${activeItems.map(i => i.title).join(', ') || 'Cubierto'}','📍 ${ent.zone}','Envía directo al refugio/clínica')" class="neko-btn px-2 py-1 bg-sky-300 text-[#2B1B10] font-bold text-[8.5px]">📸 Póster</button>
            </div>
            <div class="space-y-1.5">${rowsHtml}</div>
          </div>`;
      }).join('');
    }

    function purchaseAndRemoveSupply(id) {
      const s = state.supplies.find(x => x.id === id); if (!s) return;
      window.open(s.url, '_blank', 'noopener');
      s.fulfilled = true; state.karma += 60; renderAll(); launchConfetti();
      notify(`🛒 "${s.title}" comprado y eliminado de la lista (+60🐟)!`);
    }

    function renderCampaignsList(targetType) {
      return state.campaigns.filter(c => c.targetType === targetType).map(c => {
        const pct = Math.min(100, Math.round((c.raisedMxn / c.targetMxn) * 100)), paused = c.raisedMxn >= c.targetMxn;
        return `
          <div class="neko-card p-2.5 space-y-1.5 text-[11px] ${paused ? 'ring-2 ring-amber-400' : ''}">
            <div class="flex justify-between items-start">
              <div><h4 class="font-neko font-bold text-[11.5px]">${c.catName}</h4><p class="text-[9.5px] font-bold opacity-75">${c.entityName}</p></div>
              <div class="flex items-center gap-1">
                <button type="button" onclick="openSocialPosterGenerator('CAMPAÑA SOLIDARIA','${c.catName.replace(/'/g, '')}','${c.desc.replace(/'/g, '')}','Meta: $${c.raisedMxn}/$${c.targetMxn} MXN (${pct}%)','CLABE SPEI: ${c.clabe}')" class="neko-btn px-1.5 py-0.5 bg-sky-300 text-[#2B1B10] font-bold text-[8.5px]">📸 Póster</button>
                <span class="font-neko font-bold text-[10px] ${paused ? 'bg-amber-300' : 'bg-emerald-200'} text-[#2B1B10] px-1.5 py-0.2 rounded border border-[#2B1B10]">${pct}%</span>

            ${paused ? `<div class="w-full py-1.5 rounded-xl bg-amber-300 border-2 border-[#2B1B10] text-[#2B1B10] font-neko font-bold text-[10px] text-center">🎉 ¡Meta 100% Alcanzada! Donaciones en Pausa</div>` : `<div class="grid grid-cols-2 gap-1.5"><button type="button" onclick="openDonationHubModal('${c.id}')" class="neko-btn py-1.5 bg-emerald-400 text-[#2B1B10] font-bold text-[9.5px]">🏦 Donar SPEI <span class="action-tag-notif">🔔1</span></button><a href="https://wa.me/${c.whatsapp}" target="_blank" rel="noopener noreferrer" class="neko-btn py-1.5 bg-amber-300 text-[#2B1B10] font-bold text-[9.5px]">💬 WhatsApp</a></div>`}
          </div>`;
      }).join('');
    }

    function renderAdoptionsList(entityType) {
      return state.adoptions.filter(a => a.entityType === entityType).map(cat => {
        const isAvail = cat.status === 'available';
        return `
          <div class="neko-card p-2.5 space-y-1.5 text-[11px]">

              <span class="px-2 py-0.5 rounded-full ${isAvail ? 'bg-emerald-300' : 'bg-amber-300'} text-[#2B1B10] font-neko font-bold text-[8.5px]">${isAvail ? '🟢 DISPONIBLE' : '⏳ EN EVALUACIÓN'}</span>
              <span class="text-[9.5px] font-neko font-bold">🏠 ${cat.entityName}</span>
            </div>
            <div class="flip-card" onclick="this.classList.toggle('flipped')">
              <div class="flip-inner">
                <div class="flip-front neko-subcard">
                  <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-amber-100 border border-[#2B1B10] flex items-center justify-center shrink-0">${catAvatarSvg(cat.coat)}</div>

                  </div>
                  <p class="text-[10px] font-semibold">${cat.afterDesc}</p>
                  <span class="text-[8.5px] font-neko font-bold text-[#F97316] text-right">🔄 Toca para ver ANTES ➔</span>

                <div class="flip-back bg-amber-100 border border-[#2B1B10] text-[#2B1B10]">
                  <div><span class="px-1.5 py-0.2 rounded bg-rose-500 text-white font-neko font-bold text-[8px]">🩹 ANTES DEL RESCATE</span><p class="text-[10px] font-semibold mt-1">${cat.beforeDesc}</p></div>
                  <span class="text-[8.5px] font-neko font-bold text-right">🔄 Volver a HOY ➔</span>

              <button type="button" onclick="openSocialPosterGenerator('ADOPCIÓN','${cat.name.replace(/'/g, '')}','${cat.afterDesc.replace(/'/g, '')}','Gestionado por: ${cat.entityName}','${cat.health}')" class="neko-btn py-1.5 bg-sky-300 text-[#2B1B10] font-bold text-[9px]">📸 Póster</button>
              <a href="https://wa.me/${cat.whatsapp}" target="_blank" rel="noopener noreferrer" class="neko-btn py-1.5 bg-emerald-400 text-[#2B1B10] font-bold text-[9px]">💬 WhatsApp</a>
            </div>
          </div>`;
      }).join('');
    }

    function toggleAdoptionEval(id) { const a = state.adoptions.find(x => x.id === id); if (a) { a.status = a.status === 'available' ? 'evaluating' : 'available'; state.karma += 40; renderAll(); notify('¡Estado de adopción actualizado!'); } }

    function openEntityDetailModal(kind, id, tab = 'campaigns') {
      const ent = (kind === 'clinic' ? state.clinics : state.shelters).find(x => x.id === id); if (!ent) return;
      const camps = state.campaigns.filter(c => c.entityId === ent.id), sups = state.supplies.filter(s => s.entityId === ent.id && !s.fulfilled), adopts = state.adoptions.filter(a => a.entityId === ent.id), stories = state.outcomes.filter(o => o.entityId === ent.id || o.entityType === kind);
      let bodyHtml = '';
      if (tab === 'outcomes') bodyHtml = stories.map(o => `<div class="p-2 rounded-xl bg-[var(--bg-subcard)] border border-[#2B1B10] flex justify-between items-center"><div><p class="font-neko font-bold text-[10.5px]">${o.name}</p><p class="text-[9.5px] opacity-90">${o.afterDesc}</p></div><button type="button" onclick="openSocialPosterGenerator('HISTORIA MISHIMAYA','${o.name.replace(/'/g, '')}','${o.afterDesc.replace(/'/g, '')}','${ent.name}','✨ Transparencia')" class="neko-btn px-2 py-1 bg-sky-300 text-[#2B1B10] font-bold text-[8.5px]">📸 Póster</button></div>`).join('');
      else if (tab === 'supplies') bodyHtml = sups.length ? sups.map(s => `<div class="p-2 rounded-xl bg-[var(--bg-subcard)] border border-[#2B1B10] flex justify-between items-center"><div><p class="font-neko font-bold text-[10px]">[${s.badge}] ${s.title}</p><p class="text-[9px] opacity-75">${s.sub}</p></div><button type="button" onclick="purchaseAndRemoveSupply('${s.id}'); openEntityDetailModal('${kind}','${ent.id}','supplies')" class="neko-btn px-2 py-1 bg-amber-400 text-[#2B1B10] font-bold text-[9px]">🛒 Comprar</button></div>`).join('') : `<p class="text-xs font-bold text-emerald-700 text-center py-2">🎉 ¡Todos los insumos cubiertos!</p>`;
      else if (tab === 'adopt') bodyHtml = adopts.length ? adopts.map(a => `<div class="p-2 rounded-xl bg-[var(--bg-subcard)] border border-[#2B1B10] flex justify-between items-center"><div><p class="font-neko font-bold text-[10px]">${a.name}</p><p class="text-[9px] opacity-75">${a.health}</p></div><button type="button" onclick="closeCenterModal(); switchMainTab('${kind === 'clinic' ? 'clinics' : 'shelters'}'); setSubTab('${kind === 'clinic' ? 'clinics' : 'shelters'}','adopt')" class="neko-btn px-2 py-1 bg-emerald-400 text-[#2B1B10] font-bold text-[9px]">Ver Flip 🐱</button></div>`).join('') : `<p class="text-xs opacity-75 text-center py-2">Sin gatos en adopción hoy.</p>`;
      else bodyHtml = camps.map(c => `<div class="p-2 rounded-xl bg-[var(--bg-subcard)] border border-[#2B1B10] flex justify-between items-center"><div><p class="font-neko font-bold text-[10px]">${c.catName}</p><p class="text-[9px] opacity-75">$${c.raisedMxn} / $${c.targetMxn} MXN</p></div>${c.raisedMxn >= c.targetMxn ? `<span class="px-2 py-0.5 rounded bg-amber-300 text-[#2B1B10] font-bold text-[8.5px]">🎉 100%</span>` : `<button type="button" onclick="openDonationHubModal('${c.id}')" class="neko-btn px-2 py-1 bg-emerald-400 text-[#2B1B10] font-bold text-[9px]">Donar 🏦</button>`}</div>`).join('');

      openCenterModal(`
        <div class="flex justify-between items-start border-b pb-1.5">
          <div><h3 class="font-neko font-bold text-xs">${ent.name}</h3><p class="text-[9.5px] opacity-80">📍 ${ent.zone} • CLABE: <code class="font-mono font-bold">${ent.clabe}</code></p></div>
          <button type="button" onclick="closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <div class="grid grid-cols-4 gap-1">
          <button type="button" onclick="openEntityDetailModal('${kind}','${ent.id}','campaigns')" class="neko-btn py-1 text-[9px] font-bold ${tab === 'campaigns' ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}">💝 Camp. (${camps.length})</button>
          <button type="button" onclick="openEntityDetailModal('${kind}','${ent.id}','supplies')" class="neko-btn py-1 text-[9px] font-bold ${tab === 'supplies' ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}">📦 Insumos (${sups.length})</button>
          <button type="button" onclick="openEntityDetailModal('${kind}','${ent.id}','adopt')" class="neko-btn py-1 text-[9px] font-bold ${tab === 'adopt' ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}">🐱 Adop. (${adopts.length})</button>
          <button type="button" onclick="openEntityDetailModal('${kind}','${ent.id}','outcomes')" class="neko-btn py-1 text-[9px] font-bold ${tab === 'outcomes' ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}">✨ Historias</button>
        </div>
        <div class="space-y-1.5 max-h-56 overflow-y-auto">${bodyHtml}</div>`);
    }

    function openDonationHubModal(campId) {
      const c = state.campaigns.find(x => x.id === campId) || state.campaigns[0];
      if (c.raisedMxn >= c.targetMxn) { notify('🎉 Meta 100% alcanzada (Donaciones en pausa).'); return; }
      const rem = Math.max(50, c.targetMxn - c.raisedMxn);
      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs">🏦 Donar a ${c.catName} (Faltan $${rem} MXN)</h3>
          <button type="button" onclick="closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <form onsubmit="submitSpeiDonation(event,'${c.id}')" class="space-y-2 text-[11px]">
          <div class="p-2 neko-subcard text-[10px] flex justify-between items-center"><span>CLABE: <strong class="font-mono">${c.clabe}</strong></span><button type="button" onclick="navigator.clipboard?.writeText('${c.clabe}'); notify('CLABE copiada ✓')" class="neko-btn px-2 py-0.5 bg-amber-300 text-[#2B1B10] font-bold text-[9px]">Copiar</button></div>
          <input id="spei-amt" type="number" required min="10" max="${rem}" value="${rem}" class="w-full px-2.5 py-1.5 rounded-xl border-2 border-[#3D2618] bg-[#FFFDF7] text-[#2B1B10] font-mono font-bold" />
          <button type="submit" class="w-full neko-btn py-2 bg-emerald-400 text-[#2B1B10] font-bold text-xs">Confirmar Donación (+100🐟)</button>
        </form>`);
    }

    function submitSpeiDonation(ev, campId) {
      ev.preventDefault();
      const c = state.campaigns.find(x => x.id === campId), amt = parseInt(document.getElementById('spei-amt').value, 10) || 200;
      if (c) { c.raisedMxn = Math.min(c.targetMxn, c.raisedMxn + amt); if (c.raisedMxn >= c.targetMxn) launchConfetti(); }
      state.karma += 100; closeCenterModal(); renderAll();
      notify(c && c.raisedMxn >= c.targetMxn ? `🎉 ¡Meta 100% alcanzada para ${c.catName}!` : `¡+$${amt} MXN acreditados (+100🐟)!`);
    }

    function openP2PVerifyModal(targetKind, id) {
      const isCl = targetKind === 'clinic', item = isCl ? state.clinics.find(c => c.id === id) : state.streetItems.find(i => i.id === id);
      if (!item) return;
      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs">🕵️‍♂️ Feedback P2P (${state.session.paWeight} PA): ${item.name || item.title}</h3>
          <button type="button" onclick="closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <form onsubmit="submitP2PVerification(event,'${targetKind}','${id}')" class="space-y-2 text-[11px]">
          <div class="p-2.5 neko-subcard space-y-1.5">
            <label class="flex items-center gap-1.5"><input type="checkbox" required /> <span>1. ¿Confirmas que la ubicación en Mérida es real?</span></label>
            ${isCl ? `<p class="font-neko font-bold text-[10px] pt-1">🩺 2. ¿Ya has tenido experiencia con esta clínica?</p><label class="flex items-center gap-1.5"><input type="radio" name="cl_exp" value="direct" checked /> <span>🐾 Sí, atendieron a mi gato aquí (+2 PA Bonus)</span></label><label class="flex items-center gap-1.5"><input type="radio" name="cl_exp" value="street" /> <span>👀 Solo confirmo que está abierta</span></label>` : `<label class="flex items-center gap-1.5"><input type="checkbox" required /> <span>2. ¿Confirmas que el gato sigue aquí hoy?</span></label>`}
          </div>
          <div class="grid grid-cols-2 gap-1.5">
            <button type="submit" class="neko-btn py-2 bg-emerald-400 text-[#2B1B10] font-bold text-[10px]">✅ Confirmar (+35🐟)</button>
            ${!isCl ? `<button type="button" onclick="flagPinForSafeRemoval('${id}')" class="neko-btn py-2 bg-rose-200 text-rose-900 font-bold text-[10px]">⚠️ Ya no está (${item.closeFlags || 0}/2)</button>` : `<button type="button" onclick="closeCenterModal()" class="neko-btn py-2 bg-stone-200 text-[#2B1B10] font-bold text-[10px]">Cerrar</button>`}
          </div>
        </form>`);
    }

    function submitP2PVerification(ev, targetKind, id) {
      ev.preventDefault();
      let w = state.session.paWeight || 3;
      if (targetKind === 'clinic') {
        const cl = state.clinics.find(c => c.id === id);
        if (ev.target.querySelector('input[name="cl_exp"]:checked')?.value === 'direct') w += 2;
        if (cl) { cl.paScore = (cl.paScore || 1) + w; cl.expCount = (cl.expCount || 1) + 1; if (cl.paScore >= 6) cl.confirmed = true; }
      } else { const st = state.streetItems.find(i => i.id === id); if (st) { st.paScore = (st.paScore || 1) + w; st.quarantineNotice = false; st.closeFlags = 0; } }
      state.karma += 35; closeCenterModal(); closeMapPinCard(); renderAll(); notify(`⭐ Confirmación P2P (+${w} PA) ✓`);
    }

    function openInAppPinAlertModal(pinId) {
      const item = state.streetItems.find(x => x.id === pinId); if (!item) return;
      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs">🔔 Aviso In-App: ${item.title}</h3>
          <button type="button" onclick="closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <form onsubmit="submitInAppPinAlert(event,'${item.id}')" class="space-y-2 text-[11px]">
          <input id="inapp-msg" type="text" required value="¡Estoy cerca con transportadora para apoyar!" class="w-full px-2.5 py-1.5 rounded-xl border-2 border-[#2B1B10] bg-[#FFFDF7] text-[#2B1B10]" />
          <button type="submit" class="w-full neko-btn py-2 bg-emerald-400 text-[#2B1B10] font-bold text-xs">🔔 Enviar Notificación en Tiempo Real (+25🐟)</button>
        </form>`);
    }

    function submitInAppPinAlert(ev, pinId) {
      ev.preventDefault();
      const item = state.streetItems.find(x => x.id === pinId), txt = document.getElementById('inapp-msg').value.trim();
      if (item && txt) { item.inAppMessages.unshift(txt); state.inAppAlerts.unshift({ id: 'al-' + Date.now(), pinId, text: `${item.title}: ${txt}`, time: 'Ahora' }); state.karma += 25; closeCenterModal(); showPinCardOverlay('street', pinId); renderAll(); notify('🔔 Aviso enviado ✓'); }
    }

    function openUniversalReportHub() {
      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs">📍📷 Centro Universal de Reportes</h3>
          <button type="button" onclick="closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <div class="space-y-2 text-[11px]">
          <button type="button" onclick="openCameraReportModal('sighting')" class="w-full neko-btn p-2.5 bg-sky-100 text-[#2B1B10] justify-between text-left"><span>🐾 Gato Avistado / Perdido (Cámara Live)</span><span>➔</span></button>
          <button type="button" onclick="openCameraReportModal('emergency')" class="w-full neko-btn p-2.5 bg-rose-100 text-[#2B1B10] justify-between text-left"><span>🚑 Emergencia SOS en Calle</span><span>➔</span></button>
          <button type="button" onclick="openAuthAndOnboardingModal('clinic')" class="w-full neko-btn p-2.5 bg-emerald-100 text-[#2B1B10] justify-between text-left"><span>🏥 Registrar Clínica o Refugio (Cuestionario)</span><span>➔</span></button>
        </div>`);
    }

    function openMapNotificationsCenter() {
      const emerg = state.streetItems.filter(i => i.type === 'emergency');
      const alertsHtml = (state.inAppAlerts || []).slice(0, 4).map(a => `<div class="p-2 rounded-xl bg-amber-100 border border-[#2B1B10] text-[#2B1B10] text-[10px] flex justify-between"><span>💬 ${a.text}</span><span class="font-bold text-[8.5px] ml-1">${a.time}</span></div>`).join('');
      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs">🔔 Notificaciones y Bitácora</h3>
          <button type="button" onclick="closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <div class="space-y-1.5">${alertsHtml}${emerg.map(i => `<button type="button" onclick="closeCenterModal(); switchMainTab('map'); showPinCardOverlay('street','${i.id}')" class="w-full neko-btn p-2 bg-rose-100 text-[#2B1B10] justify-between text-left"><span class="font-bold text-[10.5px]">🚑 SOS: ${i.title}</span><span class="px-1.5 py-0.5 rounded bg-rose-500 text-white text-[8.5px] font-bold">Ir ➔</span></button>`).join('')}</div>`);
    }

    function openAppFreeDonationModal() {
      toggleRightDrawer(false);
      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs">☕ Donación de Monto Libre (MXN)</h3>
          <button type="button" onclick="closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <div class="space-y-2 text-[11px]">
          <input id="free-don-mxn" type="number" min="10" value="100" class="w-full px-3 py-2 rounded-xl border-2 border-[#2B1B10] bg-[#FFFDF7] text-[#2B1B10] font-mono font-bold text-sm" />
          <button type="button" onclick="state.karma+=80; closeCenterModal(); renderAll(); launchConfetti(); notify('💙 ¡Gracias por tu donación vía Mercado Pago (+80🐟)!')" class="w-full neko-btn py-2 bg-sky-400 text-[#2B1B10] font-bold text-xs">💙 Mercado Pago México (1-Tap)</button>
          <button type="button" onclick="navigator.clipboard?.writeText('012910009988776655'); state.karma+=80; closeCenterModal(); renderAll(); notify('🏦 CLABE SPEI copiada (+80🐟)!')" class="w-full neko-btn py-2 bg-emerald-400 text-[#2B1B10] font-bold text-xs">🏦 Copiar CLABE SPEI Directo</button>
        </div>`);
    }

    function openKarmaExpInfoModal() {
      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs">🐟 Nivel EXP y Autoridad P2P (PA)</h3>
          <button type="button" onclick="closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <p class="text-[11px]">Rango actual: <strong>${state.session.label}</strong>. Usa <strong>🔑 Cuenta</strong> arriba para hacer el cuestionario de rol.</p>`);
    }

    function claimGreyClinicOfficial(id) { const cl = state.clinics.find(c => c.id === id); if (cl) { cl.confirmed = true; cl.paScore = 6; renderAll(); notify('🟢 ¡Clínica verificada!'); } }
    function setRolePin(code) { if (ROLE_PINS[code]) state.session = { ...ROLE_PINS[code], email: state.session.email || '' }; toggleRightDrawer(false); renderAll(); notify(`Rol: ${state.session.label}`); }
    function applyTheme(t) { state.theme = t; document.getElementById('apk-shell').setAttribute('data-theme', t); toggleRightDrawer(false); renderAll(); }
    function toggleRightDrawer(open) { document.getElementById('right-drawer-backdrop').classList.toggle('hidden', !open); AdMobGuard.sync(); }
    function openCenterModal(html) { document.getElementById('center-modal-content').innerHTML = html; document.getElementById('center-modal-backdrop').classList.remove('hidden'); AdMobGuard.sync(); }
    function closeCenterModal() { stopLiveCameraStream(); document.getElementById('center-modal-backdrop').classList.add('hidden'); AdMobGuard.sync(); }

    function switchMainTab(tab) {
      state.mainTab = tab;
      ['shelters', 'map', 'clinics'].forEach(t => document.getElementById(`main-tab-${t}`).classList.toggle('hidden', t !== tab));
      if (tab !== 'map') { closeMapPinCard(); showSwipeGuideHint(); }
      if (tab === 'map' && mapInstance) setTimeout(() => mapInstance.invalidateSize(), 120);
      AdMobGuard.sync(); saveState();
    }

    function setSubTab(mainTab, sub) {
      state.subTabs[mainTab] = sub;
      const list = mainTab === 'shelters' ? ['list', 'adopt', 'campaigns', 'supplies'] : ['triage', 'adopt', 'campaigns', 'supplies'];
      list.forEach(k => {
        const v = document.getElementById(`subview-${mainTab}-${k}`), b = document.getElementById(`subbtn-${mainTab}-${k}`);
        if (v) v.classList.toggle('hidden', k !== sub);
        if (b) {
          const badge = b.querySelector('.badge-num');
          b.className = `neko-btn py-1.5 text-[10px] font-bold gap-1 relative ${k === sub ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}`;
          if (badge) b.appendChild(badge);
        }
      });
      saveState();
    }

    function bindHorizontalSwipe(areaId, mainTab, tabsOrder) {
      const el = document.getElementById(areaId); if (!el) return;
      let startX = 0, startY = 0;
      el.addEventListener('touchstart', e => { startX = e.changedTouches[0].screenX; startY = e.changedTouches[0].screenY; }, { passive: true });
      el.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].screenX - startX, dy = Math.abs(e.changedTouches[0].screenY - startY);
        if (Math.abs(dx) > 60 && dy < 45) {
          const curIdx = tabsOrder.indexOf(state.subTabs[mainTab]);
          const nextIdx = dx < 0 ? Math.min(tabsOrder.length - 1, curIdx + 1) : Math.max(0, curIdx - 1);
          if (nextIdx !== curIdx) setSubTab(mainTab, tabsOrder[nextIdx]);
        }
      }, { passive: true });
    }

    setInterval(() => AdMobGuard.tick(), 1000);

    function renderAll() {
      document.getElementById('apk-shell').setAttribute('data-theme', state.theme);
      document.getElementById('top-cat-icon').innerHTML = catAvatarSvg(state.theme);
      document.getElementById('top-karma-val').textContent = state.karma.toLocaleString('en-US');
      document.getElementById('top-exp-rank').textContent = state.session.label;
      updateAllLogicalBadges();
      renderCompactCarousels();
      renderHomeMapTab();
      renderSheltersTab();
      renderClinicsTab();
      AdMobGuard.sync();
      saveState();
    }

    window.addEventListener('DOMContentLoaded', () => {
      injectStaticNekoIcons();
      renderAll();
      startCarouselTimer();
      bindHorizontalSwipe('swipe-area-shelters', 'shelters', ['list', 'adopt', 'campaigns', 'supplies']);
      bindHorizontalSwipe('swipe-area-clinics', 'clinics', ['triage', 'adopt', 'campaigns', 'supplies']);
      centerOnUserGPS(false);
      if (!state.tutorialSeen) setTimeout(() => openInteractiveTutorialModal(0), 400);
    });
  </script>
</body>
</html>
