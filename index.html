<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8C4A23" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>MishiMaya Mérida — v9.2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --font-display:'Fredoka',sans-serif; --font-body:'Quicksand',sans-serif; }
    [data-theme="calico"] { --bg-yard:#FDF6E2; --bg-card:#FFFDF7; --bg-subcard:#F5EBD1; --wood-main:#C87D4B; --wood-dark:#8C4A23; --outline:#4A3222; --text-main:#3D2618; --car-camp:#FFFBEB; --car-sup:#ECFDF5; --car-amt:#065F46; --pill-idle:#FFFDF7; }
    [data-theme="tortie"] { --bg-yard:#1E140F; --bg-card:#32221A; --bg-subcard:#432E23; --wood-main:#9A4E24; --wood-dark:#5C280B; --outline:#F59E0B; --text-main:#FFF8F0; --car-camp:#3D271D; --car-sup:#1F352B; --car-amt:#FDE68A; --pill-idle:#432E23; }
    [data-theme="tabby"]  { --bg-yard:#FFF3C4; --bg-card:#FFFDF5; --bg-subcard:#FDE68A; --wood-main:#D97706; --wood-dark:#92400E; --outline:#5B3412; --text-main:#452309; --car-camp:#FFFBEB; --car-sup:#ECFDF5; --car-amt:#065F46; --pill-idle:#FFFDF5; }
    [data-theme="void"]   { --bg-yard:#0B0E17; --bg-card:#171E31; --bg-subcard:#222C47; --wood-main:#059669; --wood-dark:#064E3B; --outline:#34D399; --text-main:#F8FAFC; --car-camp:#1E2942; --car-sup:#132F2C; --car-amt:#6EE7B7; --pill-idle:#222C47; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; padding:0; width:100%; height:100dvh; overflow:hidden; font-family:var(--font-body); background:#140F0C; font-size:12.5px; }
    .font-neko { font-family:var(--font-display); }
    #apk-shell { width:100%; max-width:480px; height:100dvh; margin:0 auto; display:flex; flex-direction:column; background:var(--bg-yard); color:var(--text-main); position:relative; overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,0.8); }
    .neko-wood-top { background:linear-gradient(180deg,var(--wood-main) 0%,var(--wood-dark) 100%); border-bottom:3.5px solid var(--outline); min-height:68px; padding-top:max(10px,env(safe-area-inset-top)); padding-bottom:10px; display:flex; align-items:center; }
    .neko-wood-bottom { background:linear-gradient(0deg,var(--wood-dark) 0%,var(--wood-main) 100%); border-top:3.5px solid var(--outline); min-height:112px; padding-top:12px; padding-bottom:calc(30px + env(safe-area-inset-bottom)); display:flex; align-items:center; }
    .neko-card { background:var(--bg-card); border:2.5px solid var(--outline); border-radius:16px; box-shadow:0 3.5px 0 var(--outline); color:var(--text-main); }
    .neko-subcard { background:var(--bg-subcard); border:1.8px dashed var(--outline); border-radius:11px; color:var(--text-main); }
    .neko-btn { font-family:var(--font-display); border:2px solid #2B1B10; border-radius:12px; box-shadow:0 2.5px 0 #2B1B10; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; text-align:center; line-height:1.1; transition:transform 0.14s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.14s ease; }
    .neko-btn:active { transform:translateY(2px) scale(0.97); box-shadow:0 1px 0 #2B1B10; }
    .cards-scroll-window { flex:1; overflow-y:auto; padding:6px 4px 18px 4px; mask-image:linear-gradient(to bottom, transparent 0px, black 6px, black calc(100% - 8px), transparent 100%); -webkit-mask-image:linear-gradient(to bottom, transparent 0px, black 6px, black calc(100% - 8px), transparent 100%); }
    #map-tab-container { position:absolute; inset:0; width:100%; height:100%; padding:6px 8px 8px 8px; display:flex; flex-direction:column; }
    #map-frame-inner { position:relative; flex:1; width:100%; height:100%; min-height:200px; border-radius:18px; border:3.5px solid var(--outline); box-shadow:0 3.5px 0 var(--outline); overflow:hidden; background:#E6CCB2; }
    #merida-map { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
    .leaflet-container img, .leaflet-tile { max-width:none !important; max-height:none !important; }
    .leaflet-control-attribution { display:none !important; }
    .neko-warm-tiles .leaflet-tile-pane { filter:sepia(0.18) saturate(1.15) contrast(0.97); }
    .leaflet-div-icon-neko { background:transparent !important; border:none !important; }
    /* Pin Neko Atsume + Animazioni Dedicate per Categoria */
    .neko-pin-wrap { position:relative; width:44px; height:52px; display:flex; flex-direction:column; align-items:center; cursor:pointer; filter:drop-shadow(0 3px 0 #2B1B10); transition:transform 0.15s ease; }
    .neko-pin-wrap:active { transform:scale(0.9); }
    .neko-pin-head { width:38px; height:38px; border-radius:999px; border:2.5px solid #2B1B10; box-shadow:inset 0 2.5px 0 rgba(255,255,255,0.45); display:flex; align-items:center; justify-content:center; position:relative; z-index:2; }
    .neko-pin-tip { width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-top:10px solid #2B1B10; margin-top:-2px; z-index:1; }
    .neko-pin-dot { width:5px; height:5px; border-radius:999px; background:#FFFDF7; border:1.5px solid #2B1B10; margin-top:-2px; }
    @keyframes pulse-ring { 0% { transform:scale(0.95); opacity:0.95; } 100% { transform:scale(1.65); opacity:0; } }
    @keyframes sosBeat { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
    @keyframes nekoTilt { 0%,100% { transform:rotate(0deg); } 25% { transform:rotate(-7deg); } 75% { transform:rotate(7deg); } }
    @keyframes nekoBounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
    @keyframes nekoFloat { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-2.5px) scale(1.04); } }
    .sos-ring::before { content:''; position:absolute; inset:-5px; border-radius:999px; border:3px solid #EF4444; animation:pulse-ring 1.5s infinite ease-out; pointer-events:none; }
    .pin-anim-emergency { animation:sosBeat 1.3s infinite ease-in-out; }
    .pin-anim-sighting { animation:nekoTilt 2.8s infinite ease-in-out; transform-origin:bottom center; }
    .pin-anim-colony { animation:nekoBounce 2.2s infinite ease-in-out; }
    .pin-anim-shelter { animation:nekoFloat 3s infinite ease-in-out; }
    .pin-anim-clinic { animation:nekoFloat 2.6s infinite ease-in-out; }
    .interlocked-dock { display:flex; align-items:center; justify-content:center; position:relative; width:100%; }
    .wing-left { border-radius:16px 0 0 16px; padding-right:16px; margin-right:-11px; z-index:1; }
    .wing-right { border-radius:0 16px 16px 0; padding-left:16px; margin-left:-11px; z-index:1; }
    .center-orb { border-radius:9999px; z-index:2; position:relative; }
    .flip-card { perspective:1000px; height:128px; cursor:pointer; }
    .flip-inner { position:relative; width:100%; height:100%; transition:transform 0.5s; transform-style:preserve-3d; }
    .flip-card.flipped .flip-inner { transform:rotateY(180deg); }
    .flip-front, .flip-back { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:11px; padding:8px; display:flex; flex-direction:column; justify-content:space-between; }
    .flip-back { transform:rotateY(180deg); }
    .badge-num { position:absolute; top:-7px; right:-5px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:#EF4444; color:#FFF; font-family:var(--font-display); font-size:9.5px; font-weight:700; border:1.8px solid #2B1B10; box-shadow:0 1.5px 0 #2B1B10; display:inline-flex; align-items:center; justify-content:center; line-height:1; z-index:20; cursor:pointer; }
    .action-tag-notif { display:inline-flex; align-items:center; justify-content:center; padding:1px 4px; border-radius:99px; background:#EF4444; color:#FFF; font-size:8px; font-weight:700; border:1px solid #2B1B10; margin-left:3px; line-height:1; }
    .compact-carousel-strip { height:42px; overflow:hidden; position:relative; width:100%; border-radius:12px; border:2px solid var(--outline); background:var(--bg-card); box-shadow:0 2px 0 var(--outline); flex-shrink:0; }
    .compact-carousel-track { display:flex; height:100%; width:100%; transition:transform 0.65s cubic-bezier(0.22, 1, 0.36, 1); }
    .compact-carousel-slide { min-width:100%; height:100%; display:flex; align-items:center; justify-content:space-between; padding:0 8px; cursor:pointer; color:var(--text-main); }
    @keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
    .neko-prog-fill { transition:width 0.6s cubic-bezier(0.22, 1, 0.36, 1); position:relative; overflow:hidden; }
    .neko-prog-fill::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.45),transparent); background-size:200% 100%; animation:shimmer 2.4s infinite linear; }
    @keyframes nekoPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }
    .neko-soft-pulse { animation:nekoPulse 2.5s infinite ease-in-out; }
    /* Slot AdMob Certificato 320x50px */
    #admob-guard-host { height:58px; padding:4px 8px; background:rgba(20,15,12,0.9); border-bottom:2.5px solid var(--outline); z-index:20; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    ::-webkit-scrollbar { width:3px; height:3px; }
    ::-webkit-scrollbar-thumb { background:rgba(140,74,35,0.4); border-radius:99px; }
  </style>
</head>
<body>
  <div id="apk-shell" data-theme="calico">
    <!-- TOP BAR (+20% PIÙ ALTA) CON BARRA EXP KARMA ANIMATA A SINISTRA E DRAWER A DESTRA -->
    <header class="neko-wood-top px-3 gap-2.5 z-30 shrink-0">
      <div onclick="openKarmaExpInfoModal()" class="flex-1 bg-[var(--bg-card)] border-2 border-[#2B1B10] rounded-xl px-3 py-1.5 shadow-[0_2.5px_0_#2B1B10] cursor-pointer">
        <div class="flex items-center justify-between text-[10.5px] font-neko font-bold text-[var(--text-main)]">
          <span id="top-exp-rank" class="truncate flex items-center gap-1">Lv.3 • Veterano TNR (3 PA)</span>
          <span class="text-amber-500 shrink-0 ml-1 flex items-center gap-1">🐟 <span id="top-karma-val">1,450</span>/2,000 EXP <span class="px-1.5 py-0.2 rounded-md bg-amber-300 text-[#2B1B10] border border-[#2B1B10] text-[8.5px]">?</span></span>
        </div>
        <div class="w-full h-2.5 rounded-full bg-stone-300 border border-[#2B1B10] overflow-hidden mt-1">
          <div id="top-exp-bar" class="bg-gradient-to-r from-amber-400 via-orange-500 to-emerald-400 h-full neko-prog-fill" style="width:72%"></div>
        </div>
      </div>
      <button type="button" onclick="toggleRightDrawer(true)" class="neko-btn bg-[var(--bg-card)] text-[var(--text-main)] px-3 py-2 gap-2 shrink-0">
        <div id="top-cat-icon" class="w-7 h-7 rounded-lg bg-amber-100 border border-[#2B1B10] flex items-center justify-center"></div>
        <span class="font-neko font-bold text-sm">☰</span>
      </button>
    </header>

    <!-- BANNER ADMOB STANDARD 320x50px GESTITO DA ADMOBGUARD (MONTATO SOLO SE 100% VISIBILE) -->
    <div id="admob-guard-host"></div>

    <!-- VIEWPORT PRINCIPALE -->
    <main class="flex-1 relative overflow-hidden">
      <!-- 1. SEZIONE RIFUGI -->
      <section id="main-tab-shelters" class="hidden h-full flex flex-col p-2.5 gap-1.5 overflow-hidden">
        <div class="grid grid-cols-4 gap-1.5 bg-black/15 pt-2.5 pb-1.5 px-1.5 rounded-xl border-2 border-[var(--outline)] shrink-0">
          <button type="button" onclick="setSubTab('shelters','list')" id="subbtn-shelters-list" class="neko-btn py-1.5 text-[10px] font-bold bg-[#F97316] text-white gap-1 relative"><span id="ico-sh-1"></span><span id="i18n-sh-tab1">Refugios</span><span id="badge-sh-list" class="badge-num">1</span></button>
          <button type="button" onclick="setSubTab('shelters','adopt')" id="subbtn-shelters-adopt" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-sh-2"></span><span id="i18n-sh-tab2">Adopción</span><span id="badge-sh-adopt" class="badge-num">1</span></button>
          <button type="button" onclick="setSubTab('shelters','campaigns')" id="subbtn-shelters-campaigns" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-sh-3"></span><span id="i18n-sh-tab3">Campañas</span><span id="badge-sh-camp" class="badge-num">2</span></button>
          <button type="button" onclick="setSubTab('shelters','supplies')" id="subbtn-shelters-supplies" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-sh-4"></span><span id="i18n-sh-tab4">Insumos</span><span id="badge-sh-sup" class="badge-num">2</span></button>
        </div>
        <div class="compact-carousel-strip" id="compact-carousel-top-shelters"></div>
        <div id="swipe-area-shelters" class="cards-scroll-window space-y-2.5">
          <div id="subview-shelters-list" class="space-y-2.5"></div>
          <div id="subview-shelters-adopt" class="hidden space-y-2.5"></div>
          <div id="subview-shelters-campaigns" class="hidden space-y-2.5"></div>
          <div id="subview-shelters-supplies" class="hidden space-y-2.5"></div>
        </div>
        <div class="compact-carousel-strip" id="compact-carousel-bottom-shelters"></div>
      </section>

      <!-- 2. HOME MAPPA CENTRALE -->
      <section id="main-tab-map" class="h-full w-full relative">
        <div id="map-tab-container">
          <div id="map-frame-inner" class="neko-warm-tiles">
            <div id="merida-map"></div>
            <!-- Filtri Mappa con icone Neko Atsume e pt-2.5 anti-taglio -->
            <div class="absolute top-1.5 left-2 right-2 z-[420] flex items-center gap-1.5 overflow-x-auto pt-2.5 pb-1.5 px-1">
              <button type="button" onclick="setMapPinFilter('all')" id="mfilter-all" class="neko-btn px-2.5 py-1 bg-[#F97316] text-white text-[10px] font-bold whitespace-nowrap gap-1"><span id="ico-mf-all"></span><span>Todos</span></button>
              <button type="button" onclick="jumpToMapFilterPin('emergency')" id="mfilter-emergency" class="neko-btn px-2.5 py-1 bg-[var(--pill-idle)] text-[var(--text-main)] text-[10px] font-bold whitespace-nowrap gap-1 relative"><span id="ico-mf-sos"></span><span>SOS</span><span id="badge-map-sos" class="badge-num">1</span></button>
              <button type="button" onclick="jumpToMapFilterPin('sighting')" id="mfilter-sighting" class="neko-btn px-2.5 py-1 bg-[var(--pill-idle)] text-[var(--text-main)] text-[10px] font-bold whitespace-nowrap gap-1 relative"><span id="ico-mf-sig"></span><span>Avistados</span><span id="badge-map-sig" class="badge-num">1</span></button>
              <button type="button" onclick="setMapPinFilter('colony')" id="mfilter-colony" class="neko-btn px-2.5 py-1 bg-[var(--pill-idle)] text-[var(--text-main)] text-[10px] font-bold whitespace-nowrap gap-1"><span id="ico-mf-col"></span><span>Colonias</span></button>
              <button type="button" onclick="setMapPinFilter('shelters')" id="mfilter-shelters" class="neko-btn px-2.5 py-1 bg-[var(--pill-idle)] text-[var(--text-main)] text-[10px] font-bold whitespace-nowrap gap-1"><span id="ico-mf-sh"></span><span>Refugios</span></button>
              <button type="button" onclick="jumpToMapFilterPin('clinics')" id="mfilter-clinics" class="neko-btn px-2.5 py-1 bg-[var(--pill-idle)] text-[var(--text-main)] text-[10px] font-bold whitespace-nowrap gap-1 relative"><span id="ico-mf-cl"></span><span>Clínicas</span><span id="badge-map-cl" class="badge-num">1</span></button>
            </div>

            <!-- Controlli Laterali Mappa Centrati con Icone Neko -->
            <div class="absolute right-2.5 top-16 z-[480] flex flex-col gap-1.5">
              <button type="button" onclick="openMapNotificationsCenter()" class="neko-btn w-9 h-9 bg-rose-500 text-white flex-col gap-0.5 relative" title="Centro Notifiche Mappa">
                <span id="ico-ctrl-bell"></span>
                <span id="gps-notif-count" class="text-[8px] font-bold leading-none">3</span>
              </button>
              <button type="button" onclick="centerOnUserGPS(true)" class="neko-btn w-9 h-9 bg-emerald-400 text-[#2B1B10] flex-col gap-0.5" title="Centra GPS">
                <span id="ico-ctrl-gps"></span>
                <span class="text-[6.5px] font-bold leading-none">GPS</span>
              </button>
              <button type="button" onclick="zoomMap(1)" class="neko-btn w-9 h-8 bg-[var(--bg-card)] text-[var(--text-main)] font-bold text-base">+</button>
              <button type="button" onclick="zoomMap(-1)" class="neko-btn w-9 h-8 bg-[var(--bg-card)] text-[var(--text-main)] font-bold text-base">−</button>
              <button type="button" onclick="ClusterEngine.zoomOutOverview()" class="neko-btn w-9 h-9 bg-amber-300 text-[#2B1B10] flex-col gap-0.5">
                <span id="ico-ctrl-zones"></span>
                <span class="text-[7px] font-bold leading-none">Zonas</span>
              </button>
            </div>

            <!-- Card Rapida Pin Completa (Non copre il banner AdMob in alto) -->
            <div id="map-pin-card" class="hidden absolute bottom-24 left-2.5 right-2.5 z-[490] neko-card p-3 shadow-2xl"></div>

            <!-- 3 Tasti Fotocamera/Segnalazione (+15%, Alzati a bottom-4, Centrati e con Icone SVG Neko Atsume) -->
            <div class="absolute bottom-4 left-2 right-2 z-[450] pointer-events-none">
              <div class="interlocked-dock max-w-[305px] mx-auto pointer-events-auto">
                <button type="button" onclick="openCameraReportModal('emergency')" class="neko-btn wing-left flex-1 h-[48px] px-2.5 bg-rose-500 text-white flex-col gap-0.5">
                  <span id="ico-cam-sos"></span>
                  <span class="text-[10px] font-bold leading-none">SOS</span>
                </button>
                <button type="button" onclick="openUniversalReportHub()" class="neko-btn center-orb w-[64px] h-[64px] bg-sky-400 text-[#2B1B10] flex-col gap-0.5 shrink-0 ring-4 ring-[var(--bg-card)]">
                  <span id="ico-cam-orb"></span>
                  <span id="i18n-orb-report" class="text-[8.5px] font-extrabold uppercase leading-none">Reportar</span>
                </button>
                <button type="button" onclick="openCameraReportModal('colony')" class="neko-btn wing-right flex-1 h-[48px] px-2.5 bg-amber-400 text-[#2B1B10] flex-col gap-0.5">
                  <span id="ico-cam-col"></span>
                  <span class="text-[10px] font-bold leading-none">Colonia</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 3. SEZIONE CLINICHE -->
      <section id="main-tab-clinics" class="hidden h-full flex flex-col p-2.5 gap-1.5 overflow-hidden">
        <div class="grid grid-cols-4 gap-1.5 bg-black/15 pt-2.5 pb-1.5 px-1.5 rounded-xl border-2 border-[var(--outline)] shrink-0">
          <button type="button" onclick="setSubTab('clinics','triage')" id="subbtn-clinics-triage" class="neko-btn py-1.5 text-[10px] font-bold bg-[#F97316] text-white gap-1 relative"><span id="ico-cl-1"></span><span id="i18n-cl-tab1">Clínicas</span><span id="badge-cl-triage" class="badge-num">1</span></button>
          <button type="button" onclick="setSubTab('clinics','adopt')" id="subbtn-clinics-adopt" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-cl-2"></span><span id="i18n-cl-tab2">Adopción</span><span id="badge-cl-adopt" class="badge-num">1</span></button>
          <button type="button" onclick="setSubTab('clinics','campaigns')" id="subbtn-clinics-campaigns" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-cl-3"></span><span id="i18n-cl-tab3">Campañas</span><span id="badge-cl-camp" class="badge-num">2</span></button>
          <button type="button" onclick="setSubTab('clinics','supplies')" id="subbtn-clinics-supplies" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-cl-4"></span><span id="i18n-cl-tab4">Insumos</span><span id="badge-cl-sup" class="badge-num">2</span></button>
        </div>
        <div class="compact-carousel-strip" id="compact-carousel-top-clinics"></div>
        <div id="swipe-area-clinics" class="cards-scroll-window space-y-2.5">
          <div id="subview-clinics-triage" class="space-y-2.5"></div>
          <div id="subview-clinics-adopt" class="hidden space-y-2.5"></div>
          <div id="subview-clinics-campaigns" class="hidden space-y-2.5"></div>
          <div id="subview-clinics-supplies" class="hidden space-y-2.5"></div>
        </div>
        <div class="compact-carousel-strip" id="compact-carousel-bottom-clinics"></div>
      </section>
    </main>

    <!-- NAV-BAR INFERIORE CON MARGINE EXTRA DAL FONDO E TASTO HOME/MAPPA CORRETTO -->

      isCovered() {
        const modalOpen = !document.getElementById('center-modal-backdrop').classList.contains('hidden');

        if (modalOpen || drawerOpen) return true;
        const host = document.getElementById('admob-guard-host');
        const pinCard = document.getElementById('map-pin-card');
        if (host && pinCard && !pinCard.classList.contains('hidden')) {
          const r1 = host.getBoundingClientRect();
          const r2 = pinCard.getBoundingClientRect();
          const overlaps = !(r2.right < r1.left || r2.left > r1.right || r2.bottom < r1.top || r2.top > r1.bottom);
          if (overlaps) return true;
        }
        return false;
      },
      sync() {
        const host = document.getElementById('admob-guard-host');
        if (!host) return;
        if (this.isCovered()) {
          if (this.mounted) {
            host.innerHTML = `<div class="text-[9px] font-neko opacity-40">AdMob Paused (Overlay Active)</div>`;
            this.mounted = false;
          }
        } else {
          if (!this.mounted) {

              </div>`;
            this.mounted = true;
          }
        }
      },
      tick() {
        this.sync();
        if (!this.mounted) return;
        this.sec--;
        if (this.sec <= 0) {
          this.sec = 31;
          this.adIdx = (this.adIdx + 1) % this.ads.length;
          const txt = document.getElementById('admob-ad-text');
          if (txt) txt.textContent = this.ads[this.adIdx];
        }
        const t = document.getElementById('admob-timer');
        if (t) t.textContent = this.sec + 's';
      }
    };

    /* =========================================================================
       MOTORE MODULARE DI CLUSTERING E DE-CLUSTERING (CLUSTERENGINE)
       ========================================================================= */
    const ClusterEngine = {
      getRadiusForZoom(zoom) {
        if (zoom <= 11.5) return 0.042; // Macro-Zonas Mérida
        if (zoom <= 13) return 0.020;   // Barrios
        return 0;                       // Pin singoli
      },
      collectVisiblePins() {
        const flt = state.mapPinFilter;
        const pins = [];
        state.streetItems.forEach(item => {
          if (flt !== 'all' && flt !== item.type) return;
          const badge = item.type === 'emergency' ? 'SOS' : `${item.paScore || 1}/${item.paRequired || 3}PA`;
          pins.push({ lat: item.lat, lng: item.lng, kind: item.type, overlayKind: 'street', id: item.id, badge, isGrey: false });
        });
        if (flt === 'all' || flt === 'shelters') {
          state.shelters.forEach(s => pins.push({ lat: s.lat, lng: s.lng, kind: 'shelter', overlayKind: 'shelter', id: s.id, badge: '', isGrey: false }));
        }
        if (flt === 'all' || flt === 'clinics') {
          state.clinics.forEach(c => pins.push({ lat: c.lat, lng: c.lng, kind: 'clinic', overlayKind: 'clinic', id: c.id, badge: !c.confirmed ? `${c.paScore || 1}/6PA` : '', isGrey: !c.confirmed }));
        }
        return pins;
      },
      buildClusters(pins, radius) {
        if (radius <= 0) return pins.map(p => ({ items: [p], lat: p.lat, lng: p.lng }));
        const groups = [];
        pins.forEach(p => {
          const g = groups.find(x => Math.hypot(x.lat - p.lat, x.lng - p.lng) < radius);
          if (g) {
            g.items.push(p);
            g.lat = g.items.reduce((s, i) => s + i.lat, 0) / g.items.length;
            g.lng = g.items.reduce((s, i) => s + i.lng, 0) / g.items.length;
          } else {
            groups.push({ lat: p.lat, lng: p.lng, items: [p] });
          }
        });
        return groups;
      },
      declusterGroup(group) {
        if (!mapInstance || !group || !group.items.length) return;
        if (group.items.length === 1) {
          showPinCardOverlay(group.items[0].overlayKind, group.items[0].id);
          return;
        }
        const bounds = L.latLngBounds(group.items.map(i => [i.lat, i.lng]));
        mapInstance.flyToBounds(bounds, { padding: [52, 52], maxZoom: 14.8, duration: 0.5 });
      },
      zoomOutOverview() {
        if (!mapInstance) return;
        closeMapPinCard();
        mapInstance.flyTo([20.9865, -89.6250], 11.2, { duration: 0.5 });
        notify('🐾 Vista modular por Zonas activada ✓');
      }
    };

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapInstance);
      markersLayer = L.layerGroup().addTo(mapInstance);
      mapInstance.on('zoomend', () => renderHomeMapTab());

    function centerOnUserGPS(userClicked) {
      if (mapInstance) {
        mapInstance.invalidateSize();
        if (userClicked) mapInstance.flyTo([state.userCoords.lat, state.userCoords.lng], 15, { duration: 0.5 });
      }
      if (!navigator.geolocation) {
        if (userClicked) notify('📍 Centrado en tu ubicación de Mérida ✓');
        return;
      }
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = Number(pos.coords.latitude.toFixed(5));
        const lng = Number(pos.coords.longitude.toFixed(5));
        const inMerida = lat > 20.7 && lat < 21.3 && lng > -89.9 && lng < -89.3;
        if (inMerida) state.userCoords = { lat, lng, accuracy: Math.round(pos.coords.accuracy || 5) };
        renderAll();
        if (userClicked && mapInstance) {
          mapInstance.flyTo([state.userCoords.lat, state.userCoords.lng], 15, { duration: 0.5 });
          notify('📍 GPS centrado en tu posición ✓');
        }
      }, () => {
        if (userClicked) notify('📍 Centrado en tus coordenadas de Mérida (±5m) ✓');
      }, { enableHighAccuracy: true, timeout: 4000 });
    }

    function renderHomeMapTab() {
      initMap();
      if (!markersLayer) return;
      markersLayer.clearLayers();
      const zoom = mapInstance ? mapInstance.getZoom() : 13;

      L.marker([state.userCoords.lat, state.userCoords.lng], {
        icon: L.divIcon({ className: 'leaflet-div-icon-neko', html: `<div class="w-4 h-4 rounded-full bg-emerald-500 border-2 border-white shadow-md"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] })
      }).addTo(markersLayer);

      const pins = ClusterEngine.collectVisiblePins();
      const radius = ClusterEngine.getRadiusForZoom(zoom);
      const groups = ClusterEngine.buildClusters(pins, radius);

      groups.forEach(g => {
        if (g.items.length > 1) {
          const hasSos = g.items.some(i => i.kind === 'emergency');
          const clusterIcon = L.divIcon({
            className: 'leaflet-div-icon-neko',
            html: `<div class="neko-pin-wrap pin-anim-colony"><div class="neko-pin-head ${hasSos ? 'sos-ring' : ''}" style="background:#F97316;color:#FFF;font-family:Fredoka;font-weight:700;font-size:11px">🐾 ${g.items.length}</div><div class="neko-pin-tip"></div><div class="neko-pin-dot"></div></div>`,
            iconSize: [44, 52], iconAnchor: [22, 50]
          });
          L.marker([g.lat, g.lng], { icon: clusterIcon })
            .on('click', () => ClusterEngine.declusterGroup(g)).addTo(markersLayer);
        } else {
          const p = g.items[0];
          L.marker([p.lat, p.lng], { icon: createPointedPinIcon(p.kind, 'open', p.badge, p.isGrey) })
            .on('click', () => showPinCardOverlay(p.overlayKind, p.id)).addTo(markersLayer);
        }
      });
    }

    function submitP2PVerification(ev, targetKind, id) {
      ev.preventDefault();
      let weight = state.session.paWeight || 3;
      if (targetKind === 'clinic') {
        const cl = state.clinics.find(c => c.id === id);
        const directExp = ev.target.querySelector('input[name="cl_exp"]:checked')?.value === 'direct';
        if (directExp) weight += 2;
        if (cl) {
          cl.paScore = (cl.paScore || 1) + weight;
          cl.expCount = (cl.expCount || 1) + 1;
          if (cl.paScore >= 6) cl.confirmed = true;
        }
      } else {
        const st = state.streetItems.find(i => i.id === id);
        if (st) st.paScore = (st.paScore || 1) + weight;
      }
      state.karma += 35;
      closeCenterModal();
      closeMapPinCard();
      renderAll();
      notify(`⭐ ¡Feedback P2P registrado (+${weight} PA y +35 Peces)!`);
    }

    function submitCameraReport(ev, type, lat, lng) {
      ev.preventDefault();
      const title = document.getElementById('rep-title').value.trim();
      const lm = document.getElementById('rep-landmark').value.trim();
      const allowPublicWa = document.getElementById('rep-optin-wa').checked;
      const wa = (document.getElementById('rep-wa-num').value || '').replace(/\D/g, '') || '529994455667';
      const id = 'pin-' + Date.now();
      state.streetItems.unshift({
        id, type, title, details: lm, lat, lng, distanceKm: 0.2, status: 'active',
        createdAt: Date.now(), paScore: state.session.paWeight || 1, paRequired: type === 'colony' ? 6 : 3,
        relatedType: 'clinic', relatedId: 'amicagatos', allowPublicWa, reporterWa: wa,
        inAppMessages: ['Pin creado con carpeta fotográfica y landmark.'],
        folderPhotos: [
          { kind: 'cat', label: '🐱 Foto Principal Reporte', note: title },
          { kind: 'landmark', label: '📍 Foto Landmark Referencia', note: lm }
        ]
      });
      state.karma += 50;
      closeCenterModal();
      switchMainTab('map');
      renderAll();
      showPinCardOverlay('street', id);
      notify('📍 Pin publicado con Carpeta Landmark y privacidad activa ✓');
    }

            <button type="button" onclick="markSupplyFulfilled('${s.id}')" class="neko-btn py-1.5 bg-emerald-300 text-[#2B1B10] font-bold text-[9.5px]">✓ Marcar Enviado</button>
          </div>
        </div>`).join('');
    }

    function markSupplyFulfilled(id) {
      const s = state.supplies.find(x => x.id === id);
      if (s) { s.fulfilled = !s.fulfilled; s.raisedMxn = s.fulfilled ? s.targetMxn : 300; state.karma += 60; renderAll(); notify('¡Insumo actualizado y notificación descontada (+60 Peces)!'); }
    }

    function toggleAdoptionEval(id) {
      const a = state.adoptions.find(x => x.id === id);
      if (a) { a.status = a.status === 'available' ? 'evaluating' : 'available'; state.karma += 40; renderAll(); notify('¡Estado de adopción actualizado y badge recalculado!'); }
    }

    function openEntityDetailModal(kind, id, tab) {
      const activeTab = tab || 'campaigns';
      const list = kind === 'clinic' ? state.clinics : state.shelters;
      const ent = list.find(x => x.id === id);
      if (!ent) return;
      const camps = state.campaigns.filter(c => c.entityId === ent.id || c.targetType === kind);
      const sups = state.supplies.filter(s => s.entityId === ent.id || s.targetType === kind);
      const stories = state.outcomes.filter(o => o.entityId === ent.id || o.entityType === kind);

      let bodyHtml = '';
      if (activeTab === 'outcomes') {
        bodyHtml = stories.map(o => `
          <div class="p-2 rounded-xl ${o.kind === 'memorial' ? 'bg-[#231F2E] text-amber-100' : 'bg-[var(--bg-subcard)] text-[var(--text-main)]'} border border-[#2B1B10] space-y-1">
            <span class="px-1.5 py-0.2 rounded bg-amber-300 text-[#2B1B10] font-neko font-bold text-[8px]">${o.kind === 'memorial' ? '✨ JARDÍN DE LAS ESTRELLAS' : '🌟 HISTORIA DE ÉXITO'} • ${o.date}</span>
            <p class="font-neko font-bold text-[10.5px]">${o.name}</p>
            <p class="text-[9.5px] opacity-90">${o.afterDesc}</p>
          </div>`).join('');
      } else if (activeTab === 'supplies') {
        bodyHtml = sups.map(s => `<div class="p-2 rounded-xl bg-[var(--bg-subcard)] border border-[#2B1B10] flex justify-between items-center"><div><p class="font-neko font-bold text-[10px]">[${s.badge}] ${s.title}</p><p class="text-[9px] opacity-75">${s.sub}</p></div><a href="${s.url}" target="_blank" class="neko-btn px-2 py-1 bg-amber-400 text-[#2B1B10] font-bold text-[9px]">Enviar 🛒</a></div>`).join('');
      } else {
        bodyHtml = camps.map(c => `<div class="p-2 rounded-xl bg-[var(--bg-subcard)] border border-[#2B1B10] flex justify-between items-center"><div><p class="font-neko font-bold text-[10px]">${c.catName}</p><p class="text-[9px] opacity-75">$${c.raisedMxn} / $${c.targetMxn} MXN</p></div><button type="button" onclick="openDonationHubModal('${c.id}')" class="neko-btn px-2 py-1 bg-emerald-400 text-[#2B1B10] font-bold text-[9px]">Donar 🏦</button></div>`).join('');
      }

      openCenterModal(`
        <div class="flex justify-between items-start border-b pb-1.5">
          <div>
            <h3 class="font-neko font-bold text-xs">${ent.name}</h3>
            <p class="text-[9.5px] opacity-80">📍 ${ent.zone} • 🏦 CLABE: <code class="font-mono font-bold">${ent.clabe}</code></p>
          </div>
          <button type="button" onclick="closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <div class="p-2 neko-subcard text-[9.5px] space-y-1">
          <p>🕒 <strong>Horario:</strong> ${ent.hours} ${ent.coordinator ? `• 👤 <strong>Coord:</strong> ${ent.coordinator}` : ''}</p>
          <p>🛠️ <strong>Servicios:</strong> ${(ent.services || []).join(' • ')}</p>
        </div>
        <div class="grid grid-cols-3 gap-1">
          <button type="button" onclick="openEntityDetailModal('${kind}','${ent.id}','campaigns')" class="neko-btn py-1 text-[9.5px] font-bold ${activeTab === 'campaigns' ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}">💝 Campañas (${camps.length})</button>
          <button type="button" onclick="openEntityDetailModal('${kind}','${ent.id}','supplies')" class="neko-btn py-1 text-[9.5px] font-bold ${activeTab === 'supplies' ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}">📦 Insumos (${sups.length})</button>
          <button type="button" onclick="openEntityDetailModal('${kind}','${ent.id}','outcomes')" class="neko-btn py-1 text-[9.5px] font-bold ${activeTab === 'outcomes' ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}">✨ Historias (${stories.length})</button>
        </div>
        <div class="space-y-1.5 max-h-52 overflow-y-auto">${bodyHtml}</div>`);
    }

    function openDonationHubModal(campId) {
      const c = state.campaigns.find(x => x.id === campId) || state.campaigns[0];
      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <div>
            <span class="px-2 py-0.5 rounded-full bg-emerald-300 text-[#2B1B10] font-neko font-bold text-[8.5px]">🏦 DONACIÓN SPEI / MERCADO PAGO</span>
            <h3 class="font-neko font-bold text-xs mt-0.5">${c.catName}</h3>
          </div>
          <button type="button" onclick="closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <form onsubmit="submitSpeiDonation(event,'${c.id}')" class="space-y-2 text-[11px]">
          <div class="p-2 neko-subcard text-[10px] flex justify-between items-center">
            <span>CLABE: <strong class="font-mono">${c.clabe}</strong></span>
            <button type="button" onclick="navigator.clipboard?.writeText('${c.clabe}'); notify('CLABE copiada ✓')" class="neko-btn px-2 py-0.5 bg-amber-300 text-[#2B1B10] font-bold text-[9px]">Copiar</button>
          </div>
          <input id="spei-amt" type="number" required min="10" value="${Math.max(100, c.targetMxn - c.raisedMxn)}" class="w-full px-2.5 py-1.5 rounded-xl border-2 border-[#3D2618] bg-[#FFFDF7] text-[#2B1B10] font-mono font-bold" />
          <button type="submit" class="w-full neko-btn py-2 bg-emerald-400 text-[#2B1B10] font-bold text-xs">Confirmar Donación (+100🐟)</button>
        </form>`);
    }

    function submitSpeiDonation(ev, campId) {
      ev.preventDefault();
      const c = state.campaigns.find(x => x.id === campId);
      const amt = parseInt(document.getElementById('spei-amt').value, 10) || 200;
      if (c) c.raisedMxn += amt;
      state.karma += 100;
      closeCenterModal();
      renderAll();
      notify(`¡+$${amt} MXN acreditados a ${c.catName} (+100 Peces)!`);
    }

    function setRolePin(code) {
      if (ROLE_PINS[code]) state.session = { ...ROLE_PINS[code] };
      toggleRightDrawer(false);
      renderAll();
      notify(`Rol activo: ${state.session.label}`);
    }

    function applyTheme(t) { state.theme = t; document.getElementById('apk-shell').setAttribute('data-theme', t); toggleRightDrawer(false); renderAll(); }

    function copyCleanHtmlForGithub() {
      const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      navigator.clipboard?.writeText(fullHtml);
      toggleRightDrawer(false);
      notify('📋 ¡Código HTML completo copiado al portapapeles para GitHub!');
    }

    function openCenterModal(html) {
      document.getElementById('center-modal-content').innerHTML = html;
      document.getElementById('center-modal-backdrop').classList.remove('hidden');
      AdMobGuard.sync();
    }
    function closeCenterModal() {
      document.getElementById('center-modal-backdrop').classList.add('hidden');
      AdMobGuard.sync();
    }

    function switchMainTab(tab) {
      state.mainTab = tab;
      ['shelters', 'map', 'clinics'].forEach(t => document.getElementById(`main-tab-${t}`).classList.toggle('hidden', t !== tab));
      if (tab !== 'map') closeMapPinCard();
      if (tab === 'map' && mapInstance) setTimeout(() => mapInstance.invalidateSize(), 120);
      AdMobGuard.sync();
      saveState();
    }

    function setSubTab(mainTab, sub) {
      state.subTabs[mainTab] = sub;
      const list = mainTab === 'shelters' ? ['list', 'adopt', 'campaigns', 'supplies'] : ['triage', 'adopt', 'campaigns', 'supplies'];
      list.forEach(k => {
        const v = document.getElementById(`subview-${mainTab}-${k}`);
        const b = document.getElementById(`subbtn-${mainTab}-${k}`);
        if (v) v.classList.toggle('hidden', k !== sub);
        if (b) {
          const badge = b.querySelector('.badge-num');
          b.className = `neko-btn py-1.5 text-[10px] font-bold gap-1 relative ${k === sub ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}`;
          if (badge) b.appendChild(badge);
        }
      });
      saveState();
    }

    function bindHorizontalSwipe(areaId, mainTab, tabsOrder) {
      const el = document.getElementById(areaId);
      if (!el) return;
      let startX = 0, startY = 0;
      el.addEventListener('touchstart', e => { startX = e.changedTouches[0].screenX; startY = e.changedTouches[0].screenY; }, { passive: true });
      el.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].screenX - startX;
        const dy = Math.abs(e.changedTouches[0].screenY - startY);
        if (Math.abs(dx) > 60 && dy < 45) {
          const curIdx = tabsOrder.indexOf(state.subTabs[mainTab]);
          const nextIdx = dx < 0 ? Math.min(tabsOrder.length - 1, curIdx + 1) : Math.max(0, curIdx - 1);
          if (nextIdx !== curIdx) setSubTab(mainTab, tabsOrder[nextIdx]);
        }
      }, { passive: true });
    }

    setInterval(() => AdMobGuard.tick(), 1000);

    function renderAll() {
      document.getElementById('apk-shell').setAttribute('data-theme', state.theme);
      document.getElementById('top-cat-icon').innerHTML = catAvatarSvg(state.theme);
      document.getElementById('top-karma-val').textContent = state.karma.toLocaleString('en-US');
      document.getElementById('top-exp-rank').textContent = state.session.label;
      updateAllLogicalBadges();
      renderCompactCarousels();
      renderHomeMapTab();
      renderSheltersTab();
      renderClinicsTab();
      AdMobGuard.sync();
      saveState();
    }

    window.addEventListener('DOMContentLoaded', () => {
      injectStaticNekoIcons();
      renderAll();
      startCarouselTimer();
      bindHorizontalSwipe('swipe-area-shelters', 'shelters', ['list', 'adopt', 'campaigns', 'supplies']);
      bindHorizontalSwipe('swipe-area-clinics', 'clinics', ['triage', 'adopt', 'campaigns', 'supplies']);
      centerOnUserGPS(false);
    });
  </script>
</body>
</html>
