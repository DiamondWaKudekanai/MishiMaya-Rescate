              <button type="button" onclick="openSocialPosterGenerator('ADOPCIÓN RESPONSABLE','${cat.name.replace(/'/g, '')}','${cat.afterDesc.replace(/'/g, '')}','Gestionado por: ${cat.entityName}','${cat.health}','${cat.photoUrl || ''}')" class="neko-btn py-1.5 bg-sky-300 text-[#2B1B10] font-bold text-[9px] gap-1">${nekoSvg('share','w-3 h-3')}<span>Compartir</span></button>
              <a href="https://wa.me/${cat.whatsapp}" target="_blank" rel="noopener noreferrer" class="neko-btn py-1.5 bg-emerald-400 text-[#2B1B10] font-bold text-[9px] gap-1">${nekoSvg('chat','w-3 h-3')}<span>WhatsApp</span></a>
            </div>
          </div>`;
      }).join('');
    }

    function toggleAdoptionEval(id) { const a = state.adoptions.find(x => x.id === id); if (a) { a.status = a.status === 'available' ? 'evaluating' : 'available'; state.karma += 40; renderAll(); notify('Estado de adopción actualizado.'); } }

    function openEntityDetailModal(kind, id, tab = 'campaigns', fromMapPin = false) {
      const ent = (kind === 'clinic' ? state.clinics : state.shelters).find(x => x.id === id); if (!ent) return;
      const camps = state.campaigns.filter(c => c.entityId === ent.id), sups = state.supplies.filter(s => s.entityId === ent.id && !s.fulfilled), adopts = state.adoptions.filter(a => a.entityId === ent.id), stories = state.outcomes.filter(o => o.entityId === ent.id || o.entityType === kind);
      let bodyHtml = '';
      if (tab === 'outcomes') bodyHtml = stories.map(o => `<div class="p-2 rounded-xl bg-[var(--bg-subcard)] border border-[#2B1B10] flex justify-between items-center"><div><p class="font-neko font-bold text-[10.5px]">${o.name}</p><p class="text-[9.5px] opacity-90">${o.afterDesc}</p></div><button type="button" onclick="openSocialPosterGenerator('HISTORIA MISHIMAYA','${o.name.replace(/'/g, '')}','${o.afterDesc.replace(/'/g, '')}','${ent.name}','Transparencia MishiMaya')" class="neko-btn px-2 py-1 bg-sky-300 text-[#2B1B10] font-bold text-[8.5px]">Compartir</button></div>`).join('');
      else if (tab === 'supplies') bodyHtml = sups.length ? sups.map(s => `<div class="p-2 rounded-xl bg-[var(--bg-subcard)] border border-[#2B1B10] flex justify-between items-center"><div><p class="font-neko font-bold text-[10px]">[${s.storeName}] ${s.title}</p><p class="text-[9px] opacity-75">${s.sub}</p></div><button type="button" onclick="notifySupplyPurchaseToEntity('${s.id}'); openEntityDetailModal('${kind}','${ent.id}','supplies',${fromMapPin})" class="neko-btn px-2 py-1 bg-amber-400 text-[#2B1B10] font-bold text-[9px]">${s.pendingConfirm ? 'Notificado' : 'Comprar'}</button></div>`).join('') : `<p class="text-xs font-bold text-emerald-700 text-center py-2">¡Todos los insumos confirmados!</p>`;
      else if (tab === 'adopt') bodyHtml = adopts.length ? adopts.map(a => `<div class="p-2 rounded-xl bg-[var(--bg-subcard)] border border-[#2B1B10] flex justify-between items-center"><div><p class="font-neko font-bold text-[10px]">${a.name}</p><p class="text-[9px] opacity-75">${a.health}</p></div><button type="button" onclick="closeCenterModal(); switchMainTab('${kind === 'clinic' ? 'clinics' : 'shelters'}'); setSubTab('${kind === 'clinic' ? 'clinics' : 'shelters'}','adopt')" class="neko-btn px-2 py-1 bg-emerald-400 text-[#2B1B10] font-bold text-[9px]">Ver Ficha</button></div>`).join('') : `<p class="text-xs opacity-75 text-center py-2">Sin gatos en adopción directa hoy.</p>`;
      else bodyHtml = camps.length ? camps.map(c => `<div class="p-2 rounded-xl bg-[var(--bg-subcard)] border border-[#2B1B10] flex justify-between items-center"><div><p class="font-neko font-bold text-[10px]">${c.catName}</p><p class="text-[9px] opacity-75">$${c.raisedMxn} / $${c.targetMxn} MXN</p></div>${c.raisedMxn >= c.targetMxn ? `<span class="px-2 py-0.5 rounded bg-amber-300 text-[#2B1B10] font-bold text-[8.5px]">100%</span>` : `<button type="button" onclick="openDonationHubModal('${c.id}')" class="neko-btn px-2 py-1 bg-emerald-400 text-[#2B1B10] font-bold text-[9px]">Donar</button>`}</div>`).join('') : `<p class="text-xs opacity-75 text-center py-2">Sin campañas activas hoy en esta entidad.</p>`;

      openCenterModal(`
        <div class="flex justify-between items-start border-b pb-1.5">
          <div>
            <div class="flex items-center gap-1.5 flex-wrap">
              <h3 class="font-neko font-bold text-xs">${ent.name}</h3>
              ${ent.appMember ? `<span class="partner-app-badge">${nekoSvg('medal','w-3 h-3')}<span>App Oficial</span></span>` : ''}
            </div>
            <p class="text-[9.5px] opacity-80">${ent.zone} • CLABE: <code class="font-mono font-bold">${ent.clabe}</code></p>
          </div>
          <button type="button" onclick="NekoSFX.tap(); closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <div class="grid grid-cols-4 gap-1">
          <button type="button" onclick="openEntityDetailModal('${kind}','${ent.id}','campaigns',${fromMapPin})" class="neko-btn py-1 text-[9px] font-bold ${tab === 'campaigns' ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}">Camp. (${camps.length})</button>
          <button type="button" onclick="openEntityDetailModal('${kind}','${ent.id}','supplies',${fromMapPin})" class="neko-btn py-1 text-[9px] font-bold ${tab === 'supplies' ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}">Insumos (${sups.length})</button>
          <button type="button" onclick="openEntityDetailModal('${kind}','${ent.id}','adopt',${fromMapPin})" class="neko-btn py-1 text-[9px] font-bold ${tab === 'adopt' ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}">Adop. (${adopts.length})</button>
          <button type="button" onclick="openEntityDetailModal('${kind}','${ent.id}','outcomes',${fromMapPin})" class="neko-btn py-1 text-[9px] font-bold ${tab === 'outcomes' ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}">Historias</button>
        </div>
        <div class="space-y-1.5 max-h-56 overflow-y-auto">${bodyHtml}</div>
        ${fromMapPin ? `<button type="button" onclick="NekoSFX.tap(); closeCenterModal(); jumpToEntityCard('${kind}','${ent.id}')" class="w-full neko-btn py-1.5 bg-[#F97316] text-white font-bold text-[10px]">Ir a la Ficha en la Sección Dedicada ➔</button>` : ''}`);
    }

    function openDonationHubModal(campId) {
      const c = state.campaigns.find(x => x.id === campId) || state.campaigns[0];
      if (c.raisedMxn >= c.targetMxn) { notify('Meta 100% alcanzada (Donaciones en pausa).'); return; }
      const rem = Math.max(50, c.targetMxn - c.raisedMxn);
      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs">Notificar Donación SPEI a ${c.catName}</h3>
          <button type="button" onclick="NekoSFX.tap(); closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <form onsubmit="submitSpeiDonation(event,'${c.id}')" class="space-y-2 text-[11px]">
          <div class="p-2 neko-subcard text-[10px] flex justify-between items-center"><span>CLABE: <strong class="font-mono">${c.clabe}</strong></span><button type="button" onclick="NekoSFX.tap(); navigator.clipboard?.writeText('${c.clabe}'); notify('CLABE copiada.')" class="neko-btn px-2 py-0.5 bg-amber-300 text-[#2B1B10] font-bold text-[9px]">Copiar</button></div>
          <p class="text-[9.5px] opacity-80">El monto quedará pendiente hasta que <strong>${c.entityName}</strong> confirme la recepción bancaria.</p>
          <input id="spei-amt" type="number" required min="10" max="${rem}" value="${Math.min(250, rem)}" class="w-full px-2.5 py-1.5 rounded-xl border-2 border-[#3D2618] bg-[#FFFDF7] text-[#2B1B10] font-mono font-bold" />
          <button type="submit" class="w-full neko-btn py-2 bg-emerald-400 text-[#2B1B10] font-bold text-xs">Notificar Transferencia</button>
        </form>`);
    }

    function submitSpeiDonation(ev, campId) {
      ev.preventDefault();
      const c = state.campaigns.find(x => x.id === campId), amt = parseInt(document.getElementById('spei-amt').value, 10) || 200;
      if (c) c.pendingMxn = (c.pendingMxn || 0) + amt;
      closeCenterModal(); renderAll();
      notify(`Aviso de +$${amt} MXN enviado a ${c.entityName} para su confirmación.`);
    }

    function openP2PVerifyModal(targetKind, id) {
      const isCl = targetKind === 'clinic', item = isCl ? state.clinics.find(c => c.id === id) : state.streetItems.find(i => i.id === id);
      if (!item) return;
      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs">${isCl ? 'Opinión y Validación de Clínica' : 'Confirmación en Tiempo Real'}: ${item.name || item.title}</h3>
          <button type="button" onclick="NekoSFX.tap(); closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <form onsubmit="submitP2PVerification(event,'${targetKind}','${id}')" class="space-y-2 text-[11px]">
          <div class="p-2.5 neko-subcard space-y-1.5">
            <label class="flex items-center gap-1.5"><input type="checkbox" required /> <span>1. ¿Confirmas que la ubicación en Mérida es exacta?</span></label>
            ${isCl ? `<p class="font-neko font-bold text-[10px] pt-1">2. ¿Has llevado a tu gato o rescatado a esta clínica?</p><label class="flex items-center gap-1.5"><input type="radio" name="cl_exp" value="direct" checked /> <span>Sí, atendieron a mi michi aquí</span></label><label class="flex items-center gap-1.5"><input type="radio" name="cl_exp" value="street" /> <span>Solo confirmo que está abierta en Google Maps</span></label>` : `<label class="flex items-center gap-1.5"><input type="checkbox" required /> <span>2. ¿Confirmas que el michi sigue en este punto ahora mismo?</span></label>`}
          </div>
          ${!isCl ? `<button type="button" onclick="claimOwnedCatInStreet('${id}')" class="w-full neko-btn py-1.5 bg-amber-300 text-[#2B1B10] font-bold text-[10px]">¡Es mi gato / Conozco al dueño en esta cuadra! (Bloquear Retiro)</button>` : ''}
          <div class="grid grid-cols-2 gap-1.5">
            <button type="submit" class="neko-btn py-2 bg-emerald-400 text-[#2B1B10] font-bold text-[10px]">Confirmar Ahora</button>
            ${!isCl ? `<button type="button" onclick="flagPinForSafeRemoval('${id}')" class="neko-btn py-2 bg-rose-200 text-rose-900 font-bold text-[10px]">Ya no está (${item.closeFlags || 0}/2)</button>` : `<button type="button" onclick="NekoSFX.tap(); closeCenterModal()" class="neko-btn py-2 bg-stone-200 text-[#2B1B10] font-bold text-[10px]">Cerrar</button>`}
          </div>
        </form>`);
    }

    function claimOwnedCatInStreet(pinId) {
      const item = state.streetItems.find(x => x.id === pinId); if (!item) return;
      item.ownerClaimed = true; item.catSafetyType = 'owned_collar';
      broadcastPinUpdate(item, 'Vecino identificó que este michi tiene casa y dueño en esta cuadra. ¡No retirar!');
      closeCenterModal(); showPinCardOverlay('street', pinId, true); renderAll();
      notify('Pin marcado como Gato con Dueño en la Cuadra (Retiro bloqueado).');
    }

    function submitP2PVerification(ev, targetKind, id) {
      ev.preventDefault();
      let w = state.session.paWeight || 3;
      const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (targetKind === 'clinic') {
        const cl = state.clinics.find(c => c.id === id);
        const gotExp = awardKarmaWithCooldown('verify_cl_' + id, 35, true);
        if (cl) {
          if (gotExp) { cl.paScore = (cl.paScore || 1) + w; cl.expCount = (cl.expCount || 1) + 1; }
          if (cl.paScore >= 6) cl.confirmed = true;
        }
        closeCenterModal(); closeMapPinCard(); renderAll();
        if (gotExp) launchNekoCelebration();
        notify(gotExp ? 'Opinión de clínica registrada (+35 EXP).' : 'Tu opinión sobre esta clínica fue actualizada.');
      } else {
        const st = state.streetItems.find(i => i.id === id);
        const gotExp = awardKarmaWithCooldown('verify_pin_' + id, 35, false);
        if (st) {
          st.paScore = (st.paScore || 1) + w;
          st.quarantineNotice = false; st.closeFlags = 0;
          st.lastConfirmedText = nowTime;
          broadcastPinUpdate(st, `Confirmó que el michi sigue en el punto (${nowTime}).`);
        }
        closeCenterModal(); showPinCardOverlay('street', id, true); renderAll();
        if (gotExp) launchNekoCelebration();
        notify(gotExp ? `Presencia actualizada (${nowTime}) y notificada a la red (+35 EXP).` : `Presencia en tiempo real actualizada (${nowTime}) para la red.`);
      }
    }

    function openInAppPinAlertModal(pinId) {

      const role = state.session.role, entName = state.session.entityName || 'Entidad';
      const following = isPinFollowed(item.id);
      let defaultMsg = '¡Estoy en camino con transportadora para apoyar!';
      let actionButtons = `
        <button type="button" onclick="document.getElementById('inapp-msg').value='Voy en camino con transportadora (llego en 15 min).'" class="neko-btn py-1 bg-amber-200 text-[#2B1B10] font-bold">Llevo transportadora</button>
        <button type="button" onclick="document.getElementById('inapp-msg').value='Dejé agua limpia y alimento húmedo hoy.'" class="neko-btn py-1 bg-emerald-200 text-[#2B1B10] font-bold">Dejé agua y alimento</button>`;

        defaultMsg = `${entName}: Tenemos disponibilidad inmediata para recibir, estabilizar y curar a este michi SOS en nuestra clínica.`;
        actionButtons = `
          <button type="button" onclick="document.getElementById('inapp-msg').value='${entName}: Recibimos hoy mismo al michi SOS para triage y estabilización.'" class="neko-btn py-1 bg-emerald-300 text-[#2B1B10] font-bold">Recibir SOS hoy</button>
          <button type="button" onclick="document.getElementById('inapp-msg').value='${entName}: Reservamos espacio de hospitalización con tarifa solidaria.'" class="neko-btn py-1 bg-sky-200 text-[#2B1B10] font-bold">Reservar Hospitalización</button>`;
      } else if (role === 'shelter') {
        defaultMsg = `${entName}: Damos nuestra disponibilidad para recibir y hospedar en cuarentena al michi señalado.`;
        actionButtons = `
          <button type="button" onclick="document.getElementById('inapp-msg').value='${entName}: Reservamos espacio de cuarentena para recibirlo hoy.'" class="neko-btn py-1 bg-amber-300 text-[#2B1B10] font-bold">Reservar Cuarentena</button>
          <button type="button" onclick="document.getElementById('inapp-msg').value='${entName}: Apoyamos con jaula trampa para captura segura.'" class="neko-btn py-1 bg-emerald-200 text-[#2B1B10] font-bold">Prestar Jaula Trampa</button>`;

      const historyHtml = (item.inAppMessages || []).map(m => `<div class="p-1.5 rounded bg-[var(--bg-card)] border border-[#2B1B10] text-[9.5px]">• ${m}</div>`).join('');

      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs">Red de Contacto Automática del Pin: ${item.title}</h3>
          <button type="button" onclick="NekoSFX.tap(); closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <div class="space-y-2 text-[11px]">
          <div class="p-2 rounded-xl bg-amber-100 border border-[#2B1B10] flex items-center justify-between text-[9.5px]">
            <span>🔔 Recibir notificaciones automáticas de este pin:</span>
            <button type="button" onclick="toggleFollowPin('${item.id}'); openInAppPinAlertModal('${item.id}')" class="neko-btn px-2.5 py-1 ${following ? 'bg-emerald-400' : 'bg-stone-300'} text-[#2B1B10] font-bold">${following ? 'Conectado ✓' : 'Conectar'}</button>
          </div>
          ${historyHtml ? `<div class="space-y-1 max-h-28 overflow-y-auto p-1.5 neko-subcard">${historyHtml}</div>` : ''}
          <form onsubmit="submitInAppPinAlert(event,'${item.id}')" class="space-y-2">
            <div class="grid grid-cols-2 gap-1 text-[9.5px]">${actionButtons}</div>
            <textarea id="inapp-msg" rows="2" required class="w-full px-2.5 py-1.5 rounded-xl border-2 border-[#2B1B10] bg-[#FFFDF7] text-[#2B1B10] text-[10.5px]">${defaultMsg}</textarea>
            <button type="submit" class="w-full neko-btn py-2 bg-emerald-400 text-[#2B1B10] font-bold text-xs">Enviar Actualización a Todos los Voluntarios del Pin</button>
          </form>

    function submitInAppPinAlert(ev, pinId) {
      ev.preventDefault();
      const item = state.streetItems.find(x => x.id === pinId), txt = document.getElementById('inapp-msg').value.trim();
      if (item && txt) {
        broadcastPinUpdate(item, txt);
        if (item.type === 'emergency' && (state.session.role === 'clinic' || state.session.role === 'shelter' || txt.includes('transportadora'))) {
          item.status = 'in_transit';
          item.responderName = state.session.entityName || state.session.label;
          item.responderSince = Date.now();
          item.lastReminderAt = Date.now();
        }
        awardKarmaWithCooldown('alert_' + pinId, 25, false);
        closeCenterModal(); showPinCardOverlay('street', pinId, true); renderAll();
        notify('Actualización enviada a toda la red de contacto del pin.');
      }
    }

    function openAdminDeletePinModal(pinId) {
      if (state.session.role !== 'admin') return;
      const item = state.streetItems.find(x => x.id === pinId); if (!item) return;
      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs">Administrador: Retiro Seguro</h3>
          <button type="button" onclick="NekoSFX.tap(); closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <div class="space-y-2 text-[11px]">
          <select id="admin-del-reason" class="w-full px-2.5 py-1.5 rounded-xl border-2 border-[#2B1B10] bg-[#FFFDF7] text-[#2B1B10] font-bold">
            <option value="Michi rescatado / Caso resuelto">Michi rescatado / Caso resuelto</option>
            <option value="Gato con dueño en la cuadra (Casa Segura)">Gato con dueño en la cuadra</option>
            <option value="Pin duplicado o inexacto">Pin duplicado o inexacto</option>
          </select>
          <button type="button" onclick="confirmSafePinRemoval('${item.id}', document.getElementById('admin-del-reason').value)" class="w-full neko-btn py-2 bg-rose-500 text-white font-bold text-xs">Confirmar Eliminación y Notificar</button>
        </div>`);
    }

    function confirmSafePinRemoval(pinId, reason) {
      const item = state.streetItems.find(x => x.id === pinId); if (!item) return;
      state.inAppAlerts.unshift({ id: 'al-' + Date.now(), pinId, text: `Pin "${item.title}" retirado (${reason}).`, time: 'Ahora' });
      state.streetItems = state.streetItems.filter(x => x.id !== pinId);
      closeCenterModal(); closeMapPinCard(); renderAll();
      notify(`Pin retirado (${reason})`);
    }

    function flagPinForSafeRemoval(pinId) {
      const item = state.streetItems.find(x => x.id === pinId); if (!item) return;
      item.closeFlags = (item.closeFlags || 0) + 1;
      if (item.closeFlags === 1) {
        item.quarantineNotice = true;
        broadcastPinUpdate(item, 'Indicó que el michi ya no está en el sitio (1/2 confirmaciones para retiro).');
        closeCenterModal(); showPinCardOverlay('street', pinId, true); renderAll();
        notify('Reporte de retiro (1/2) enviado a la red del pin.');
      } else { confirmSafePinRemoval(pinId, 'Confirmado por 2 voluntarios'); }
    }

    function openAppFreeDonationModal() {
      toggleRightDrawer(false);
      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs">Donación de Monto Libre (MXN)</h3>
          <button type="button" onclick="NekoSFX.tap(); closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <div class="space-y-2 text-[11px]">
          <input id="free-don-mxn" type="number" min="10" value="100" class="w-full px-3 py-2 rounded-xl border-2 border-[#2B1B10] bg-[#FFFDF7] text-[#2B1B10] font-mono font-bold text-sm" />
          <button type="button" onclick="state.karma+=80; closeCenterModal(); renderAll(); animateKarmaExpBar(); launchNekoCelebration(); notify('¡Gracias por tu apoyo vía Mercado Pago (+80 EXP)!')" class="w-full neko-btn py-2 bg-sky-400 text-[#2B1B10] font-bold text-xs">Mercado Pago México</button>
          <button type="button" onclick="navigator.clipboard?.writeText('012910009988776655'); state.karma+=80; closeCenterModal(); renderAll(); animateKarmaExpBar(); notify('CLABE SPEI copiada (+80 EXP).')" class="w-full neko-btn py-2 bg-emerald-400 text-[#2B1B10] font-bold text-xs">Copiar CLABE SPEI Directo</button>
        </div>`);
    }

    function openKarmaExpInfoModal() {
      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs flex items-center gap-1.5">${nekoSvg('fishGold','w-4 h-4')}<span>Nivel de Experiencia y Red Cívica</span></h3>
          <button type="button" onclick="NekoSFX.tap(); closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <p class="text-[11px]">Tu perfil activo es <strong>${state.session.label}</strong> (${state.karma} EXP). Puedes actualizar avistamientos sin límite para ayudar a la comunidad; los puntos EXP se acreditan una vez al día por pin para garantizar equidad.</p>`);
    }

    function claimGreyClinicOfficial(id) { const cl = state.clinics.find(c => c.id === id); if (cl) { cl.confirmed = true; cl.appMember = true; cl.paScore = 6; renderAll(); launchNekoCelebration(); notify('¡Clínica vinculada con Insignia App Oficial!'); } }
    function setRolePin(code) { if (ROLE_PINS[code]) state.session = { ...ROLE_PINS[code], email: state.session.email || '' }; toggleRightDrawer(false); closeMapPinCard(); renderAll(); notify(`Vista adaptada a: ${state.session.label}`); }
    function applyTheme(t) { state.theme = t; document.getElementById('apk-shell').setAttribute('data-theme', t); toggleRightDrawer(false); renderAll(); }
    function toggleRightDrawer(open) { if (open) NekoSFX.modal(); document.getElementById('right-drawer-backdrop').classList.toggle('hidden', !open); AdMobGuard.sync(); }
    function openCenterModal(html) { NekoSFX.modal(); document.getElementById('center-modal-content').innerHTML = html; document.getElementById('center-modal-backdrop').classList.remove('hidden'); AdMobGuard.sync(); }
    function closeCenterModal() { document.getElementById('center-modal-backdrop').classList.add('hidden'); AdMobGuard.sync(); }

    function switchMainTab(tab, silent = false) {
      if (!silent && state.mainTab !== tab) NekoSFX.tap();
      state.mainTab = tab;
      toggleFanReportMenu(false, true);
      ['shelters', 'map', 'clinics'].forEach(t => document.getElementById(`main-tab-${t}`).classList.toggle('hidden', t !== tab));
      if (tab !== 'map') closeMapPinCard();
      if (tab === 'map' && mapInstance) setTimeout(() => mapInstance.invalidateSize(), 120);
      if (tab === 'shelters') setTimeout(() => updateVerticalArrows(document.getElementById('swipe-area-shelters'), 'y-arrow-up-shelters', 'y-arrow-down-shelters'), 100);
      if (tab === 'clinics') setTimeout(() => updateVerticalArrows(document.getElementById('swipe-area-clinics'), 'y-arrow-up-clinics', 'y-arrow-down-clinics'), 100);
      AdMobGuard.sync(); saveState();
    }

    function setSubTab(mainTab, sub) {
      NekoSFX.tap();
      state.subTabs[mainTab] = sub;
      const list = mainTab === 'shelters' ? ['list', 'adopt', 'campaigns', 'supplies'] : ['triage', 'adopt', 'campaigns', 'supplies'];
      list.forEach(k => {
        const v = document.getElementById(`subview-${mainTab}-${k}`), b = document.getElementById(`subbtn-${mainTab}-${k}`);
        if (v) v.classList.toggle('hidden', k !== sub);
        if (b) {
          const badge = b.querySelector('.badge-num');
          b.className = `neko-btn py-1.5 text-[10px] font-bold gap-1 relative ${k === sub ? 'bg-[#F97316] text-white' : 'bg-[var(--pill-idle)] text-[var(--text-main)]'}`;
          if (badge) b.appendChild(badge);
        }
      });
      const areaId = mainTab === 'shelters' ? 'swipe-area-shelters' : 'swipe-area-clinics';
      const upId = mainTab === 'shelters' ? 'y-arrow-up-shelters' : 'y-arrow-up-clinics';
      const downId = mainTab === 'shelters' ? 'y-arrow-down-shelters' : 'y-arrow-down-clinics';
      setTimeout(() => updateVerticalArrows(document.getElementById(areaId), upId, downId), 80);
      saveState();
    }

    setInterval(() => {
      AdMobGuard.tick();
      checkSosTransitReminders();
    }, 1000);

    function renderAll(skipCloudSync = false) {
      NekoSFX.enabled = state.sfxEnabled !== false;
      const sfxBtn = document.getElementById('sfx-toggle-btn');
      if (sfxBtn) {
        sfxBtn.textContent = NekoSFX.enabled ? 'Activos' : 'Silencio';
        sfxBtn.className = `neko-btn px-3 py-1 ${NekoSFX.enabled ? 'bg-emerald-300' : 'bg-stone-300'} text-[#2B1B10] font-bold text-[10px]`;
      }
      document.getElementById('apk-shell').setAttribute('data-theme', state.theme);
      document.getElementById('top-cat-icon').innerHTML = catAvatarSvg(state.theme);
      document.getElementById('top-karma-val').textContent = state.karma.toLocaleString('en-US');
      const rankEl = document.getElementById('top-exp-rank');
      if (rankEl) rankEl.innerHTML = `${nekoSvg('shield','w-3.5 h-3.5')}<span>${state.session.label}</span>`;
      updateAllLogicalBadges();
      renderCompactCarousels();
      renderHomeMapTab();
      renderSheltersTab();
      renderClinicsTab();
      AdMobGuard.sync();
      if (!skipCloudSync) saveState();
    }

    window.addEventListener('DOMContentLoaded', () => {
      injectStaticNekoIcons();
      initFirebaseCloud();
      renderAll(true);
      animateKarmaExpBar();
      startCarouselTimer();
      centerOnUserGPS(false);
      if (!state.registered) setTimeout(() => openAuthAndOnboardingModal('volunteer'), 350);
    });
  </script>
</body>
</html>
