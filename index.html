<style>
:root { --font-display:'Fredoka',sans-serif; --font-body:'Quicksand',sans-serif; }
[data-theme="calico"] { --bg-yard:#FDF6E2; --bg-card:#FFFDF7; --bg-subcard:#F5EBD1; --wood-main:#C87D4B; --wood-dark:#8C4A23; --outline:#4A3222; --text-main:#3D2618; --car-bg:#FFFBEB; --car-text:#2B1B10; }
[data-theme="tortie"] { --bg-yard:#1E140F; --bg-card:#32221A; --bg-subcard:#432E23; --wood-main:#A8582B; --wood-dark:#682F0F; --outline:#FBBF24; --text-main:#FFFDF9; --car-bg:#3A261D; --car-text:#FFFDF9; }
[data-theme="tabby"]  { --bg-yard:#FFF3C4; --bg-card:#FFFDF5; --bg-subcard:#FDE68A; --wood-main:#D97706; --wood-dark:#92400E; --outline:#5B3412; --text-main:#452309; --car-bg:#FFFBEB; --car-text:#2B1B10; }
[data-theme="void"]   { --bg-yard:#0B0F19; --bg-card:#182034; --bg-subcard:#232F4B; --wood-main:#059669; --wood-dark:#064E3B; --outline:#34D399; --text-main:#FFFFFF; --car-bg:#1E2942; --car-text:#34D399; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; width:100%; height:100dvh; overflow:hidden; font-family:var(--font-body); background:#140F0C; font-size:12.5px; }
.font-neko { font-family:var(--font-display); }
#apk-shell { width:100%; max-width:480px; height:100dvh; margin:0 auto; display:flex; flex-direction:column; background:var(--bg-yard); color:var(--text-main); position:relative; overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,0.8); }
​.neko-wood-top { background:linear-gradient(180deg,var(--wood-main) 0%,var(--wood-dark) 100%); border-bottom:3.5px solid var(--outline); min-height:82px; padding-top:max(10px,env(safe-area-inset-top)); padding-bottom:12px; display:flex; align-items:center; }
.neko-wood-bottom { background:linear-gradient(0deg,var(--wood-dark) 0%,var(--wood-main) 100%); border-top:3.5px solid var(--outline); min-height:116px; padding-top:10px; padding-bottom:calc(36px + env(safe-area-inset-bottom)); display:flex; align-items:center; }
​.neko-card { background:var(--bg-card); border:2.5px solid var(--outline); border-radius:16px; box-shadow:0 3.5px 0 var(--outline); color:var(--text-main); }
.neko-subcard { background:var(--bg-subcard); border:1.8px dashed var(--outline); border-radius:11px; color:var(--text-main); }
​.neko-btn { font-family:var(--font-display); border:2px solid var(--outline); border-radius:12px; box-shadow:0 2.5px 0 var(--outline); cursor:pointer; transition:transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease; }
.neko-btn:active { transform:translateY(2px); box-shadow:0 1px 0 var(--outline); }
​.cards-scroll-window { flex:1; overflow-y:auto; padding:6px 6px 24px 6px; }
#map-tab-container { position:absolute; inset:0; width:100%; height:100%; padding:6px 8px 8px 8px; display:flex; flex-direction:column; }
#map-frame-inner { position:relative; flex:1; width:100%; height:100%; min-height:200px; border-radius:18px; border:3.5px solid var(--outline); box-shadow:0 3.5px 0 var(--outline); overflow:hidden; background:#E6CCB2; }
#merida-map { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
.leaflet-container img, .leaflet-tile { max-width:none !important; max-height:none !important; }
.leaflet-control-attribution { display:none !important; }
.neko-warm-tiles .leaflet-tile-pane { filter:sepia(0.18) saturate(1.15) contrast(0.97); }
.leaflet-div-icon-neko { background:transparent !important; border:none !important; }
​.interlocked-dock { display:flex; align-items:center; justify-content:center; position:relative; width:100%; }
.wing-left { border-radius:12px 0 0 12px; padding-right:6px; margin-right:-4px; z-index:1; height:40px; }
.wing-right { border-radius:0 12px 12px 0; padding-left:6px; margin-left:-4px; z-index:1; height:40px; }
.center-orb { border-radius:9999px; z-index:2; position:relative; width:46px; height:46px; }
​.badge-num { position:absolute; top:-6px; right:-4px; min-width:16px; height:16px; padding:0 4px; border-radius:999px; background:#EF4444; color:#FFF; font-family:var(--font-display); font-size:9px; font-weight:700; border:1.5px solid var(--outline); display:inline-flex; align-items:center; justify-content:center; line-height:1; z-index:20; cursor:pointer; }
.compact-carousel-strip { height:40px; overflow:hidden; position:relative; width:100%; border-radius:11px; border:2px solid var(--outline); background:var(--car-bg); color:var(--car-text); box-shadow:0 2px 0 var(--outline); flex-shrink:0; }
.compact-carousel-track { display:flex; height:100%; width:100%; transition:transform 0.65s cubic-bezier(0.22, 1, 0.36, 1); }
.compact-carousel-slide { min-width:100%; height:100%; display:flex; align-items:center; justify-content:space-between; padding:0 8px; cursor:pointer; background:var(--car-bg); color:var(--car-text); }
</style>
</head>

​let state = loadState(), mapInstance = null, markersLayer = null;
function loadState() { try { const r = localStorage.getItem(STORAGE_KEY); if (r) return Object.assign(getDefaultState(), JSON.parse(r)); } catch (e) {} return getDefaultState(); }
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
function notify(msg) {
const box = document.getElementById('apk-toast');
document.getElementById('apk-toast-text').textContent = msg;
box.classList.remove('hidden');
clearTimeout(window.toastTimer);
window.toastTimer = setTimeout(() => box.classList.add('hidden'), 3000);
}
​function toggleRightDrawer(open) { document.getElementById('right-drawer-backdrop').classList.toggle('hidden', !open); }
function setAppLanguage(lang) { state.lang = lang; renderAll(); notify('Idioma configurado ✓'); }
function applyTheme(t) { state.theme = t; document.getElementById('apk-shell').setAttribute('data-theme', t); toggleRightDrawer(false); renderAll(); }
​function initMap() {
if (mapInstance) { setTimeout(() => mapInstance.invalidateSize(), 100); return; }
const el = document.getElementById('merida-map');
if (!el || typeof L === 'undefined') return;
mapInstance = L.map('merida-map', { center: [state.userCoords.lat, state.userCoords.lng], zoom: 13, zoomControl: false, attributionControl: false });
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapInstance);
markersLayer = L.layerGroup().addTo(mapInstance);
setTimeout(() => mapInstance.invalidateSize(), 200);
}
​function zoomMap(d) { if (mapInstance) mapInstance.setZoom(mapInstance.getZoom() + d); }
function showClusterOverviewZoomOut() { if (mapInstance) { mapInstance.flyTo([state.userCoords.lat, state.userCoords.lng], 11, { duration: 0.5 }); notify('🐾 Vista Zonas'); } }
​function centerOnUserGPS(userClicked) {
if (navigator.geolocation) {
navigator.geolocation.getCurrentPosition(pos => {
state.userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: Math.round(pos.coords.accuracy || 5) };
if (mapInstance) mapInstance.flyTo([state.userCoords.lat, state.userCoords.lng], 16, { duration: 0.5 });
if (userClicked) notify('GPS centrato sulla tua posizione ✓');
}, () => {
if (mapInstance) mapInstance.flyTo([state.userCoords.lat, state.userCoords.lng], 14, { duration: 0.5 });
if (userClicked) notify('Posizione GPS aggiornata ✓');
}, { enableHighAccuracy: true, timeout: 6000 });
} else if (mapInstance) {
mapInstance.flyTo([state.userCoords.lat, state.userCoords.lng], 14, { duration: 0.5 });
if (userClicked) notify('Posizione GPS sincronizzata ✓');
}
}
​function setMapPinFilter(flt) {
state.mapPinFilter = flt;
renderHomeMapTab();
}
​function renderHomeMapTab() {
initMap();
if (!markersLayer) return;
markersLayer.clearLayers();
L.marker([state.userCoords.lat, state.userCoords.lng], {
icon: L.divIcon({ className: 'leaflet-div-icon-neko', html: <div class="w-4 h-4 rounded-full bg-emerald-500 border-2 border-white shadow-md"></div>, iconSize: [16, 16], iconAnchor: [8, 8] })
}).addTo(markersLayer);
state.streetItems.forEach(item => {
L.marker([item.lat, item.lng], {
icon: L.divIcon({ className: 'leaflet-div-icon-neko', html: <div class="w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center font-bold text-xs border-2 border-[#2B1B10]">SOS</div>, iconSize: [32, 32], iconAnchor: [16, 16] })
}).addTo(markersLayer);
});
}
​function openUniversalReportHub() { notify('Hub Segnalazione Rapida'); }
function openCameraReportModal(type) { notify(Report: ${type}); }
function openAppSupportDonationModal() { toggleRightDrawer(false); notify('Modal Donazione Libera'); }
​function switchMainTab(tab) {
state.mainTab = tab;
['shelters', 'map', 'clinics'].forEach(t => document.getElementById(main-tab-${t}).classList.toggle('hidden', t !== tab));
if (tab === 'map') { initMap(); setTimeout(() => mapInstance?.invalidateSize(), 100); }
saveState();
}
​function setSubTab(mainTab, sub) { state.subTabs[mainTab] = sub; saveState(); }
function renderAll() { renderHomeMapTab(); if(typeof lucide !== 'undefined') lucide.createIcons(); }
​window.addEventListener('DOMContentLoaded', () => { renderAll(); });
</script>
