<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8C4A23" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>MishiMaya Mérida — v15.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="calico"] {
      --font-display:'Fredoka',sans-serif; --font-body:'Quicksand',sans-serif;
      --bg-yard:#FDF6E2; --yard-pat:radial-gradient(rgba(200,125,75,0.12) 1.5px, transparent 1.5px); --yard-size:18px 18px;
      --bg-card:#FFFDF7; --bg-subcard:#F5EBD1; --wood-main:#C87D4B; --wood-dark:#8C4A23;
      --outline:#4A3222; --card-shadow:#4A3222; --text-main:#3D2618; --car-camp:#FFFBEB; --car-sup:#ECFDF5; --car-amt:#065F46; --pill-idle:#FFFDF7;
      --tag-bg:#FBBF24; --tag-text:#2B1B10;
    }
    [data-theme="tabby"] {
      --bg-yard:#FDE68A; --yard-pat:repeating-linear-gradient(135deg,rgba(180,83,9,0.08) 0px,rgba(180,83,9,0.08) 10px,transparent 10px,transparent 22px); --yard-size:auto;
      --bg-card:#FFFBEB; --bg-subcard:#FEF3C7; --wood-main:#D97706; --wood-dark:#92400E;
      --outline:#5B3412; --card-shadow:#5B3412; --text-main:#452309; --car-camp:#FEF3C7; --car-sup:#ECFDF5; --car-amt:#065F46; --pill-idle:#FFFBEB;
      --tag-bg:#D97706; --tag-text:#FFFBEB;
    }
    [data-theme="tortie"] {
      --bg-yard:#231915; --yard-pat:radial-gradient(circle at 20% 25%,rgba(217,119,6,0.22) 0%,transparent 36%),radial-gradient(circle at 80% 70%,rgba(234,88,12,0.18) 0%,transparent 40%),radial-gradient(rgba(253,230,138,0.07) 1.5px,transparent 1.5px); --yard-size:100% 100%, 100% 100%, 20px 20px;
      --bg-card:#33241E; --bg-subcard:#422F27; --wood-main:#8C4A27; --wood-dark:#522711;
      --outline:#EAB308; --card-shadow:#140D0A; --text-main:#FFFBEB; --car-camp:#3F2D25; --car-sup:#2B382E; --car-amt:#FDE68A; --pill-idle:#422F27;
      --tag-bg:#F59E0B; --tag-text:#231915;
    }
    [data-theme="void"] {
      --bg-yard:#181924; --yard-pat:radial-gradient(circle at 78% 18%,rgba(251,191,36,0.11) 0%,transparent 38%),radial-gradient(rgba(253,230,138,0.08) 1.2px,transparent 1.2px); --yard-size:100% 100%, 22px 22px;
      --bg-card:#242636; --bg-subcard:#2F3246; --wood-main:#523D2E; --wood-dark:#33241B;
      --outline:#FDE68A; --card-shadow:#0D0E15; --text-main:#F8F6F0; --car-camp:#2F3246; --car-sup:#253538; --car-amt:#FDE68A; --pill-idle:#2F3246;
      --tag-bg:#FDE68A; --tag-text:#181924;
    }

    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; padding:0; width:100%; height:100dvh; overflow:hidden; font-family:var(--font-body); background:#140F0C; font-size:12.5px; }
    .font-neko { font-family:var(--font-display); }
    #apk-shell { width:100%; max-width:480px; height:100dvh; margin:0 auto; display:flex; flex-direction:column; background-color:var(--bg-yard); background-image:var(--yard-pat); background-size:var(--yard-size); color:var(--text-main); position:relative; overflow:hidden; box-shadow:0 0 40px rgba(0,0,0,0.85); }
    .neko-wood-top { background:linear-gradient(180deg,var(--wood-main) 0%,var(--wood-dark) 100%); border-bottom:3.5px solid var(--outline); min-height:68px; padding-top:max(10px,env(safe-area-inset-top)); padding-bottom:10px; display:flex; align-items:center; }
    .neko-wood-bottom { background:linear-gradient(0deg,var(--wood-dark) 0%,var(--wood-main) 100%); border-top:3.5px solid var(--outline); min-height:110px; padding-top:10px; padding-bottom:calc(28px + env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:center; }
    .neko-card { background:var(--bg-card); border:2.5px solid var(--outline); border-radius:18px; box-shadow:0 4px 0 var(--card-shadow), inset 0 2px 0 rgba(255,255,255,0.12); color:var(--text-main); }
    .neko-subcard { background:var(--bg-subcard); border:1.8px dashed var(--outline); border-radius:12px; color:var(--text-main); }

    @keyframes nekoModalPop { 0% { opacity:0; transform:scale(0.88) translateY(12px); } 70% { opacity:1; transform:scale(1.02) translateY(-2px); } 100% { opacity:1; transform:scale(1) translateY(0); } }
    @keyframes nekoSectionFade { 0% { opacity:0; transform:translateY(7px); } 100% { opacity:1; transform:translateY(0); } }
    .neko-btn { font-family:var(--font-display); border:2px solid #2B1B10; border-radius:12px; box-shadow:0 2.5px 0 #2B1B10; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; text-align:center; line-height:1.1; transition:transform 0.16s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.14s ease, filter 0.14s ease; }
    .neko-btn:active { transform:translateY(2px) scale(0.93); box-shadow:0 0.5px 0 #2B1B10; filter:brightness(1.05); }
    .neko-pop-anim { animation:nekoModalPop 0.26s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .neko-view-anim { animation:nekoSectionFade 0.22s cubic-bezier(0.22,1,0.36,1) forwards; }

    .cards-scroll-window { flex:1; overflow-y:auto; padding:12px 4px 26px 4px; position:relative; }
    #map-tab-container { position:absolute; inset:0; width:100%; height:100%; padding:6px 8px 8px 8px; display:flex; flex-direction:column; }
    #map-frame-inner { position:relative; flex:1; width:100%; height:100%; min-height:200px; border-radius:18px; border:3.5px solid var(--outline); box-shadow:0 3.5px 0 var(--card-shadow); overflow:hidden; background:#E6CCB2; }
    #merida-map { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
    .leaflet-container img, .leaflet-tile { max-width:none !important; max-height:none !important; }
    .leaflet-control-attribution { display:none !important; }
    .neko-warm-tiles .leaflet-tile-pane { filter:sepia(0.16) saturate(1.12); }
    .leaflet-div-icon-neko { background:transparent !important; border:none !important; }

    .neko-pin-wrap { position:relative; width:44px; height:52px; display:flex; flex-direction:column; align-items:center; cursor:pointer; filter:drop-shadow(0 3px 0 #2B1B10); perspective:400px; }
    .neko-pin-head { width:38px; height:38px; border-radius:999px; border:2.5px solid #2B1B10; box-shadow:inset 0 2.5px 0 rgba(255,255,255,0.45); display:flex; align-items:center; justify-content:center; position:relative; z-index:2; backface-visibility:visible; transform-origin:center center; }
    .neko-pin-tag { position:absolute; top:-10px; right:-13px; padding:1.5px 5.5px; border-radius:999px; background:var(--tag-bg); color:var(--tag-text); font-family:var(--font-display); font-weight:700; font-size:7.8px; border:1.5px solid #2B1B10; box-shadow:0 1.5px 0 #2B1B10; white-space:nowrap; z-index:25; pointer-events:none; line-height:1.05; }
    .neko-pin-tip { width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-top:10px solid #2B1B10; margin-top:-2px; z-index:1; }
    .neko-pin-dot { width:5px; height:5px; border-radius:999px; background:#FFFDF7; border:1.5px solid #2B1B10; margin-top:-2px; }

    @keyframes pulse-ring { 0% { transform:scale(0.95); opacity:0.95; } 100% { transform:scale(1.7); opacity:0; } }
    @keyframes sosBeat { 0%,100% { transform:scale(1); } 50% { transform:scale(1.09); } }
    @keyframes nekoTilt { 0%,100% { transform:rotate(0deg); } 25% { transform:rotate(-8deg); } 75% { transform:rotate(8deg); } }
    @keyframes colonyJumpOnly { 0%,100% { transform:translateY(0); } 22% { transform:translateY(-7px); } 44% { transform:translateY(0); } }
    @keyframes colonyHeadShakeOnly { 0%,20%,70%,100% { transform:rotate(0deg); } 30% { transform:rotate(-11deg); } 40% { transform:rotate(11deg); } 50% { transform:rotate(-8deg); } 60% { transform:rotate(8deg); } }
    @keyframes clinicFlipY { 0%,70%,100% { transform:rotateY(0deg); } 85% { transform:rotateY(180deg); } }
    @keyframes shelterWholeHop { 0%,100% { transform:translateY(0); } 30% { transform:translateY(-6px); } 55% { transform:translateY(0); } }
    @keyframes floatHeartUp { 0% { transform:translate(-50%, 2px) scale(0.5); opacity:0; } 35% { opacity:1; } 100% { transform:translate(-50%, -22px) scale(1.1); opacity:0; } }

    .sos-ring::before { content:''; position:absolute; inset:-5px; border-radius:999px; border:3px solid #EF4444; animation:pulse-ring 1.4s infinite ease-out; pointer-events:none; }
    .transit-ring::before { content:''; position:absolute; inset:-5px; border-radius:999px; border:3px solid #F97316; animation:pulse-ring 1.6s infinite ease-out; pointer-events:none; }
    .pin-floating-heart { position:absolute; top:-6px; left:50%; width:14px; height:14px; pointer-events:none; z-index:24; animation:floatHeartUp 2.4s infinite ease-out; }

    .pin-anim-emergency { animation:sosBeat 1.3s infinite ease-in-out; }
    .pin-anim-sighting { animation:nekoTilt 2.8s infinite ease-in-out; transform-origin:bottom center; }
    .pin-anim-colony { animation:colonyJumpOnly 2.5s infinite ease-in-out; }
    .pin-anim-colony .neko-pin-head { animation:colonyHeadShakeOnly 2.5s infinite ease-in-out; }
    .pin-anim-clinic .neko-pin-head { animation:clinicFlipY 4.5s infinite ease-in-out; }
    .pin-anim-shelter { animation:shelterWholeHop 2.6s infinite ease-in-out; }

    .interlocked-dock { display:flex; align-items:center; justify-content:center; position:relative; width:100%; margin-left:auto; margin-right:auto; }
    .nav-wing-left { height:50px; border-radius:25px 0 0 25px; padding-right:26px; padding-left:14px; margin-right:-22px; z-index:1; }
    .nav-wing-right { height:50px; border-radius:0 25px 25px 0; padding-left:26px; padding-right:14px; margin-left:-22px; z-index:1; }
    .nav-center-orb { width:68px; height:68px; border-radius:9999px; z-index:3; position:relative; box-shadow:0 4px 0 #2B1B10, 0 0 0 4px var(--wood-dark); }

    .fan-menu-wrap { position:relative; width:280px; height:70px; display:flex; align-items:flex-end; justify-content:center; pointer-events:none; }
    .fan-main-orb { width:68px; height:68px; border-radius:9999px; z-index:30; pointer-events:auto; position:relative; box-shadow:0 4px 0 #2B1B10, 0 0 0 4px var(--bg-card); transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1); }
    .fan-item { position:absolute; bottom:8px; width:58px; height:58px; border-radius:9999px; z-index:20; opacity:0; pointer-events:none; transform:translate(0,0) scale(0.3); transition:all 0.32s cubic-bezier(0.34,1.56,0.64,1); box-shadow:0 3.5px 0 #2B1B10, 0 0 0 3px var(--bg-card); flex-direction:column; gap:1px; }
    .fan-menu-wrap.open .fan-item { opacity:1; pointer-events:auto; }
    .fan-menu-wrap.open .fan-toe-1 { transform:translate(-96px, -32px) scale(1); }
    .fan-menu-wrap.open .fan-toe-2 { transform:translate(-34px, -80px) scale(1); }
    .fan-menu-wrap.open .fan-toe-3 { transform:translate(34px, -80px) scale(1); }
    .fan-menu-wrap.open .fan-toe-4 { transform:translate(96px, -32px) scale(1); }

    .flip-card { perspective:1000px; height:132px; cursor:pointer; }
    .flip-inner { position:relative; width:100%; height:100%; transition:transform 0.52s cubic-bezier(0.34,1.56,0.64,1); transform-style:preserve-3d; }
    .flip-card.flipped .flip-inner { transform:rotateY(180deg); }
    .flip-front, .flip-back { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:11px; padding:8px; display:flex; flex-direction:column; justify-content:space-between; }
    .flip-back { transform:rotateY(180deg); }
    .badge-num { position:absolute; top:-6px; right:-4px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:#EF4444; color:#FFF; font-family:var(--font-display); font-size:9.5px; font-weight:700; border:1.8px solid #2B1B10; box-shadow:0 1.5px 0 #2B1B10; display:inline-flex; align-items:center; justify-content:center; line-height:1; z-index:20; }
    .action-tag-notif { display:inline-flex; align-items:center; gap:2px; padding:1px 5px; border-radius:99px; background:#EF4444; color:#FFF; font-size:8px; font-weight:700; border:1px solid #2B1B10; margin-left:3px; line-height:1; }
    .partner-app-badge { display:inline-flex; align-items:center; gap:3px; padding:2px 6px; border-radius:99px; background:linear-gradient(90deg,#FDE68A,#F59E0B); color:#2B1B10; font-family:var(--font-display); font-size:8.5px; font-weight:700; border:1.5px solid #2B1B10; box-shadow:0 1.5px 0 #2B1B10; }

    .compact-carousel-strip { height:42px; overflow:hidden; position:relative; width:100%; border-radius:12px; border:2px solid var(--outline); background:var(--bg-card); box-shadow:0 2px 0 var(--card-shadow); flex-shrink:0; touch-action:pan-y; }
    .compact-carousel-track { display:flex; height:100%; width:100%; transition:transform 0.92s cubic-bezier(0.25, 1, 0.5, 1); }
    .compact-carousel-slide { min-width:100%; height:100%; display:flex; align-items:center; justify-content:space-between; padding:0 8px; cursor:pointer; color:var(--text-main); user-select:none; }

    @keyframes expBarGlowPulse { 0%,100% { filter:brightness(1) drop-shadow(0 0 0px rgba(251,191,36,0)); transform:scaleY(1); } 50% { filter:brightness(1.22) drop-shadow(0 0 6px rgba(251,191,36,0.85)); transform:scaleY(1.08); } }
    .neko-prog-fill { transition:width 1.1s cubic-bezier(0.22, 1, 0.36, 1); }
    .exp-bar-pulsing { animation:expBarGlowPulse 1.8s infinite ease-in-out; }

    #admob-guard-host { height:56px; padding:3px 8px; background:rgba(20,15,12,0.92); border-bottom:2.5px solid var(--outline); z-index:20; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

    @keyframes nudgeRight { 0%,100% { transform:translateX(0); } 50% { transform:translateX(4px); } }
    @keyframes nudgeLeft { 0%,100% { transform:translateX(0); } 50% { transform:translateX(-4px); } }
    @keyframes nudgeDown { 0%,100% { transform:translate(-50%, 0); } 50% { transform:translate(-50%, 4px); } }
    @keyframes nudgeUp { 0%,100% { transform:translate(-50%, 0); } 50% { transform:translate(-50%, -4px); } }
    .scroll-hint-right { animation:nudgeRight 1.2s infinite ease-in-out; }
    .scroll-hint-left { animation:nudgeLeft 1.2s infinite ease-in-out; }
    .scroll-arrow-down { animation:nudgeDown 1.2s infinite ease-in-out; }
    .scroll-arrow-up { animation:nudgeUp 1.2s infinite ease-in-out; }

    #tour-cutout-lens { position:fixed; z-index:910; border-radius:16px; border:3.5px solid #FBBF24; box-shadow:0 0 0 9999px rgba(14, 11, 9, 0.82), 0 0 24px #FBBF24; pointer-events:none; transition:all 0.3s cubic-bezier(0.25,1,0.5,1); }
    .tour-lock-shield { position:fixed; z-index:912; background:transparent; pointer-events:auto; }

    @keyframes nekoFloatParticle { 0% { transform:translateY(20px) scale(0.6) rotate(-10deg); opacity:1; } 70% { opacity:1; } 100% { transform:translateY(-210px) scale(1.15) rotate(18deg); opacity:0; } }
    .neko-svg-particle { position:fixed; z-index:950; pointer-events:none; width:34px; height:34px; animation:nekoFloatParticle 2.1s cubic-bezier(0.22,1,0.36,1) forwards; }
    ::-webkit-scrollbar { width:3px; height:3px; }
  </style>
</head>
<body>
  <div id="apk-shell" data-theme="calico">
    <header class="neko-wood-top px-3 gap-2 z-30 shrink-0">
      <div id="top-exp-box" onclick="NekoSFX.tap(); openKarmaExpInfoModal()" class="flex-1 h-[46px] bg-[var(--bg-card)] border-2 border-[#2B1B10] rounded-xl px-2.5 flex flex-col justify-center shadow-[0_2.5px_0_#2B1B10] cursor-pointer min-w-0">
        <div class="flex items-center justify-between text-[10px] font-neko font-bold text-[var(--text-main)] leading-none">
          <span id="top-exp-rank" class="truncate flex items-center gap-1"></span>
          <span class="text-amber-500 shrink-0 ml-1 flex items-center gap-1"><span id="ico-top-fish"></span><span id="top-karma-val">1,450</span> EXP</span>
        </div>
        <div class="w-full h-2.5 rounded-full bg-stone-300 border border-[#2B1B10] overflow-hidden mt-1.5">
          <div id="top-exp-bar" class="bg-gradient-to-r from-amber-400 via-orange-500 to-emerald-400 h-full neko-prog-fill exp-bar-pulsing" style="width:0%"></div>
        </div>
      </div>
      <button type="button" id="btn-top-account" onclick="openAuthAndOnboardingModal('volunteer')" class="neko-btn h-[46px] bg-amber-300 text-[#2B1B10] px-2.5 text-[10.5px] font-bold gap-1 shrink-0">
        <span id="ico-top-key"></span><span>Cuenta</span>
      </button>
      <button type="button" id="btn-top-drawer" onclick="toggleRightDrawer(true)" class="neko-btn h-[46px] bg-[var(--bg-card)] text-[var(--text-main)] px-2.5 gap-1.5 shrink-0">
        <div id="top-cat-icon" class="w-6 h-6 rounded-lg bg-amber-100 border border-[#2B1B10] flex items-center justify-center"></div>
        <span id="ico-top-menu"></span>
      </button>
    </header>

    <div id="admob-guard-host"></div>

    <main class="flex-1 relative overflow-hidden">
      <section id="main-tab-shelters" class="hidden h-full flex flex-col p-2.5 gap-1.5 overflow-hidden relative neko-view-anim">
        <div id="subtabs-bar-shelters" class="grid grid-cols-4 gap-1.5 bg-black/15 pt-2.5 pb-1.5 px-1.5 rounded-xl border-2 border-[var(--outline)] shrink-0">
          <button type="button" onclick="setSubTab('shelters','list')" id="subbtn-shelters-list" class="neko-btn py-1.5 text-[10px] font-bold bg-[#F97316] text-white gap-1 relative"><span id="ico-sh-1"></span><span>Refugios</span><span id="badge-sh-list" class="badge-num">1</span></button>
          <button type="button" onclick="setSubTab('shelters','adopt')" id="subbtn-shelters-adopt" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-sh-2"></span><span>Adopción</span><span id="badge-sh-adopt" class="badge-num">1</span></button>
          <button type="button" onclick="setSubTab('shelters','campaigns')" id="subbtn-shelters-campaigns" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-sh-3"></span><span>Campañas</span><span id="badge-sh-camp" class="badge-num">2</span></button>
          <button type="button" onclick="setSubTab('shelters','supplies')" id="subbtn-shelters-supplies" class="neko-btn py-1.5 text-[10px] font-bold bg-[var(--pill-idle)] text-[var(--text-main)] gap-1 relative"><span id="ico-sh-4"></span><span>Insumos</span><span id="badge-sh-sup" class="badge-num">3</span></button>
        </div>
        <div class="compact-carousel-strip" id="compact-carousel-top-shelters"></div>
        <div class="flex-1 relative overflow-hidden flex flex-col">
          <button type="button" id="y-arrow-up-shelters" onclick="NekoSFX.tap(); nudgeVerticalScroll('swipe-area-shelters', -200)" class="hidden absolute top-1.5 left-1/2 z-[410] w-7 h-7 rounded-full bg-[#2B1B10] text-amber-300 border-2 border-amber-300 flex items-center justify-center font-neko font-bold text-xs shadow-md scroll-arrow-up">⌃</button>
          <div id="swipe-area-shelters" onscroll="updateVerticalArrows(this,'y-arrow-up-shelters','y-arrow-down-shelters')" class="cards-scroll-window space-y-2.5">
            <div id="subview-shelters-list" class="space-y-2.5 neko-view-anim"></div>
            <div id="subview-shelters-adopt" class="hidden space-y-2.5 neko-view-anim"></div>
            <div id="subview-shelters-campaigns" class="hidden space-y-2.5 neko-view-anim"></div>
            <div id="subview-shelters-supplies" class="hidden space-y-2.5 neko-view-anim"></div>
          </div>
          <button type="button" id="y-arrow-down-shelters" onclick="NekoSFX.tap(); nudgeVerticalScroll('swipe-area-shelters', 200)" class="absolute bottom-1.5 left-1/2 z-[410] w-7 h-7 rounded-full bg-[#2B1B10] text-amber-300 border-2 border-amber-300 flex items-center justify-center font-neko font-bold text-xs shadow-md scroll-arrow-down">⌄</button>
        </div>
        <div class="compact-carousel-strip" id="compact-carousel-bottom-shelters"></div>
      </section>

      <section id="main-tab-map" class="h-full w-full relative neko-view-anim">
        <div id="map-tab-container">
          <div id="map-frame-inner" class="neko-warm-tiles">

      '1111': { role: 'clinic', entityId: 'amicagatos', entityName: 'Amica Gatos', paWeight: 6, label: 'Clínica Amica Gatos' },

    const NekoSFX = {
      ctx: null,
      enabled: true,
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      tone(freq, endFreq, dur, type = 'sine', vol = 0.08, delay = 0) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const t0 = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t0);
          if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
          gain.gain.setValueAtTime(vol, t0);
          gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(t0); osc.stop(t0 + dur);
        } catch (e) {}
      },
      tap() { this.tone(460, 690, 0.06, 'triangle', 0.075, 0); },
      flip() {
        this.tone(280, 620, 0.08, 'sine', 0.08, 0);
        this.tone(620, 420, 0.09, 'triangle', 0.07, 0.07);
      },
      pawFan(opening = true) {
        const notes = opening ? [440, 554, 659, 880] : [880, 659, 554, 440];
        notes.forEach((n, i) => this.tone(n, n * 1.04, 0.065, 'sine', 0.065, i * 0.038));
      },
      modal() { this.tone(523, 784, 0.10, 'sine', 0.075, 0); },
      sos() { this.tone(740, 520, 0.13, 'triangle', 0.10, 0); this.tone(740, 520, 0.15, 'triangle', 0.10, 0.15); },
      celebrate() {
        [523.25, 659.25, 783.99, 1046.5].forEach((n, i) => this.tone(n, n * 1.02, 0.15, 'triangle', 0.09, i * 0.065));
        this.tone(720, 1180, 0.16, 'sine', 0.08, 0.32);
      }

  <script>
    let state = loadState(), mapInstance = null, markersLayer = null, carouselTimer = null;
    let carouselIdx = { shTop: 0, shBot: 0, clTop: 0, clBot: 0 };
    let dragTempMarker = null, pendingReportType = 'emergency', currentSpotlightStep = -1, activeTourTarget = null;
    let fbApp = null, fbAuth = null, fbDb = null;

    function loadState() {
      try {
        const r = localStorage.getItem(STORAGE_KEY);
        if (r) {
          const parsed = JSON.parse(r);
          const def = getDefaultState();
          return Object.assign(def, parsed, {
            originFilter: parsed.originFilter || def.originFilter,
            karmaAwardedLogs: parsed.karmaAwardedLogs || {},
            followedPins: parsed.followedPins || []
          });
        }
      } catch (e) {}
      return getDefaultState();
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      syncStateToCloudFirestore();
    }

    function initFirebaseCloud() {
      const demoBox = document.getElementById('demo-role-switcher-box');
      if (!FIREBASE_CONFIG.apiKey || typeof firebase === 'undefined') {
        if (demoBox) demoBox.classList.remove('hidden');
        return;
      }
      if (demoBox) demoBox.classList.add('hidden');
      try {
        if (!firebase.apps.length) fbApp = firebase.initializeApp(FIREBASE_CONFIG);
        fbAuth = firebase.auth();
        fbDb = firebase.firestore();
        const pill = document.getElementById('firebase-status-pill');
        if (pill) {
          pill.className = 'p-2 rounded-xl bg-emerald-200 border border-[#2B1B10] text-[#2B1B10] text-[9.5px] font-bold flex items-center gap-1.5';
          pill.innerHTML = `${nekoSvg('check','w-4 h-4')}<span>Producción Activa: Conectado a Google Firebase y Firestore</span>`;
        }
        const docRef = fbDb.collection('mishimaya_state').doc('merida_live');
        docRef.get().then(doc => { if (!doc.exists) syncStateToCloudFirestore(); }).catch(() => {});
        docRef.onSnapshot(doc => {
          if (doc && doc.exists) {
            const cloudData = doc.data();
            if (cloudData && cloudData.updatedAt > (window.lastLocalSave || 0)) {
              state.streetItems = cloudData.streetItems || state.streetItems;
              state.clinics = cloudData.clinics || state.clinics;
              state.shelters = cloudData.shelters || state.shelters;
              state.campaigns = cloudData.campaigns || state.campaigns;
              state.supplies = cloudData.supplies || state.supplies;
              state.adoptions = cloudData.adoptions || state.adoptions;
              renderAll(true);
            }
          }
        });
      } catch (e) {}
    }

    function syncStateToCloudFirestore() {
      if (!fbDb) return;
      window.lastLocalSave = Date.now();
      fbDb.collection('mishimaya_state').doc('merida_live').set({
        updatedAt: window.lastLocalSave,
        streetItems: state.streetItems,
        clinics: state.clinics,
        shelters: state.shelters,
        campaigns: state.campaigns,
        supplies: state.supplies,
        adoptions: state.adoptions
      }, { merge: true }).catch(() => {});
    }

    function toggleSfxSetting() {
      state.sfxEnabled = !state.sfxEnabled;
      NekoSFX.enabled = state.sfxEnabled;
      const btn = document.getElementById('sfx-toggle-btn');
      if (btn) {
        btn.textContent = state.sfxEnabled ? 'Activos' : 'Silencio';
        btn.className = `neko-btn px-3 py-1 ${state.sfxEnabled ? 'bg-emerald-300' : 'bg-stone-300'} text-[#2B1B10] font-bold text-[10px]`;
      }
      if (state.sfxEnabled) NekoSFX.celebrate();
      saveState();
    }

    function notify(msg) {
      const box = document.getElementById('apk-toast');
      document.getElementById('apk-toast-text').textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => box.classList.add('hidden'), 3000);
    }

    function launchNekoCelebration() {
      NekoSFX.celebrate();
      const svgs = [nekoSvg('fishGold', 'w-8 h-8'), nekoSvg('paw', 'w-8 h-8'), nekoSvg('cat', 'w-8 h-8'), nekoSvg('heart', 'w-7 h-7'), nekoSvg('medal', 'w-7 h-7')];
      for (let i = 0; i < 18; i++) {
        const el = document.createElement('div');
        el.className = 'neko-svg-particle';
        el.innerHTML = svgs[i % svgs.length];
        el.style.left = Math.round(8 + Math.random() * 82) + 'vw';
        el.style.top = Math.round(35 + Math.random() * 45) + 'vh';
        el.style.animationDelay = (i * 0.05) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2200);
      }
    }

    function animateKarmaExpBar() {
      const bar = document.getElementById('top-exp-bar');
      if (!bar) return;
      const pct = Math.min(100, Math.max(14, Math.round(((state.karma % 2000) / 2000) * 100)));
      bar.style.width = '0%';
      setTimeout(() => { bar.style.width = pct + '%'; }, 60);

    function catAvatarSvg(coat) {
      const colors = { calico: '#FFFDF7', tortie: '#3B2316', tabby: '#F59E0B', void: '#181A24' };

      return `<svg class="w-5 h-5 inline-block shrink-0" viewBox="0 0 64 64"><path d="M12 26 L16 10 L28 18 Q32 16 36 18 L48 10 L52 26 Q56 36 52 46 Q44 54 32 54 Q20 54 12 46 Q8 36 12 26 Z" fill="${colors[coat] || '#FFFDF7'}" stroke="#2B1B10" stroke-width="4"/><circle cx="23" cy="34" r="3.5" fill="${eyes}"/><circle cx="41" cy="34" r="3.5" fill="${eyes}"/><path d="M28 41 Q32 44 36 41" fill="none" stroke="${eyes}" stroke-width="3" stroke-linecap="round"/></svg>`;

      const wrap = document.getElementById('fan-report-menu');

      const next = forceState !== undefined ? forceState : !wrap.classList.contains('open');
      if (!silent && next !== wrap.classList.contains('open')) NekoSFX.pawFan(next);
      wrap.classList.toggle('open', next);
      if (lbl) lbl.textContent = next ? 'Cerrar' : 'Reportar';
    }

    /* =========================================================================
       COMPRESSORE IMMAGINI IDENTICO A WHATSAPP SD (1280px + High Smoothing + JPEG 0.75)
       ========================================================================= */
    function compressImageWhatsAppSD(file, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const im = new Image();
        im.onload = () => {
          const maxSide = 1280;
          const scale = Math.min(1, maxSide / Math.max(im.width, im.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(im.width * scale);
          cv.height = Math.round(im.height * scale);
          const ctx = cv.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(im, 0, 0, cv.width, cv.height);
          const dataUrl = cv.toDataURL('image/jpeg', 0.75);
          callback(dataUrl);
        };
        im.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    /* =========================================================================

       ========================================================================= */
    function openSocialPosterGenerator(category, title, subtitle, footerInfo, badgeText, imgData = '') {
      const shareTxt = `MishiMaya Mérida — ${category}: ${title}\n${subtitle}\n${footerInfo}\nApp: ${window.location.href.split('#')[0]}`;

        </div>
        <div class="space-y-2 text-[11px]">
          <canvas id="social-poster-canvas" width="900" height="1125" class="w-full rounded-xl border-2 border-[#2B1B10] shadow-md bg-[#FDF6E2]"></canvas>
          <div class="grid grid-cols-2 gap-1.5">
            <button type="button" onclick="NekoSFX.tap(); shareCanvasPosterWhatsApp('${title.replace(/'/g, '')}', \`${shareTxt.replace(/`/g, '')}\`)" class="neko-btn py-2 bg-emerald-400 text-[#2B1B10] font-bold text-[10px] gap-1">${nekoSvg('chat','w-3.5 h-3.5')}<span>Enviar por WhatsApp (+20 EXP)</span></button>
            <button type="button" onclick="NekoSFX.tap(); shareCanvasPosterNative('${title.replace(/'/g, '')}', \`${shareTxt.replace(/`/g, '')}\`)" class="neko-btn py-2 bg-[#F97316] text-white font-bold text-[10px] gap-1">${nekoSvg('share','w-3.5 h-3.5')}<span>Instagram / Facebook</span></button>
          </div>
          <button type="button" onclick="NekoSFX.tap(); downloadCanvasPosterPng('${title.replace(/'/g, '')}')" class="w-full neko-btn py-1.5 bg-amber-300 text-[#2B1B10] font-bold text-[10px]">Guardar Imagen PNG en el Teléfono</button>
        </div>`);
      setTimeout(() => drawNekoPosterCanvas(category, title, subtitle, footerInfo, badgeText, imgData), 60);
    }

    function drawNekoPosterCanvas(category, title, subtitle, footerInfo, badgeText, imgData) {
      const cv = document.getElementById('social-poster-canvas'); if (!cv) return;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#FDF6E2'; ctx.fillRect(0, 0, 900, 1125);

      const woodTop = ctx.createLinearGradient(0, 0, 0, 145);
      woodTop.addColorStop(0, '#C87D4B'); woodTop.addColorStop(1, '#8C4A23');
      ctx.fillStyle = woodTop; ctx.fillRect(0, 0, 900, 145);

      const woodBot = ctx.createLinearGradient(0, 975, 0, 1125);
      woodBot.addColorStop(0, '#C87D4B'); woodBot.addColorStop(1, '#6E3615');
      ctx.fillStyle = woodBot; ctx.fillRect(0, 975, 900, 150);

      ctx.strokeStyle = '#3D2618'; ctx.lineWidth = 14;
      ctx.strokeRect(18, 18, 864, 1089);

      ctx.fillStyle = '#FFFDF7'; ctx.font = 'bold 40px Fredoka, sans-serif';
      ctx.fillText('MishiMaya Mérida • Red Cívica Felina', 58, 86);
      ctx.fillStyle = '#FDE68A'; ctx.font = 'bold 21px Quicksand, sans-serif';
      ctx.fillText('Protección Felina, Cuidado de Fauna Local y Apoyo Mutuo', 60, 120);

      ctx.fillStyle = '#4A3222';
      ctx.beginPath(); ctx.roundRect(48, 188, 804, 756, 36); ctx.fill();
      ctx.fillStyle = '#FFFDF7'; ctx.strokeStyle = '#3D2618'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.roundRect(48, 178, 804, 756, 36); ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#F97316';
      ctx.beginPath(); ctx.roundRect(82, 210, 736, 62, 20); ctx.fill();
      ctx.strokeStyle = '#2B1B10'; ctx.lineWidth = 5; ctx.stroke();
      ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 28px Fredoka, sans-serif';
      ctx.fillText((category || 'FICHA OFICIAL').toUpperCase(), 110, 251);

      const drawBody = (loadedImg) => {
        ctx.fillStyle = '#F5EBD1'; ctx.strokeStyle = '#2B1B10'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.roundRect(96, 292, 708, 330, 22); ctx.fill(); ctx.stroke();

        if (loadedImg) {
          const ratio = Math.min(684 / loadedImg.width, 306 / loadedImg.height);
          const w = loadedImg.width * ratio, h = loadedImg.height * ratio;
          ctx.drawImage(loadedImg, 450 - w / 2, 457 - h / 2, w, h);
        } else {
          ctx.fillStyle = '#FBBF24'; ctx.strokeStyle = '#2B1B10'; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.arc(450, 435, 64, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#2B1B10'; ctx.font = 'bold 26px Fredoka, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('FICHA VERIFICADA EN MÉRIDA', 450, 555);
          ctx.textAlign = 'left';
        }

        ctx.fillStyle = '#3D2618'; ctx.font = 'bold 34px Fredoka, sans-serif';
        wrapPosterText(ctx, title || '', 88, 672, 724, 40);

        ctx.fillStyle = '#5B3412'; ctx.font = '600 25px Quicksand, sans-serif';
        wrapPosterText(ctx, subtitle || '', 88, 756, 724, 33);

        if (badgeText) {
          ctx.fillStyle = '#FEF3C7'; ctx.strokeStyle = '#2B1B10'; ctx.lineWidth = 5;
          ctx.beginPath(); ctx.roundRect(88, 835, 724, 72, 18); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#065F46'; ctx.font = 'bold 24px monospace';
          ctx.fillText(badgeText.slice(0, 46), 112, 880);
        }

        ctx.fillStyle = '#FFFBEB'; ctx.font = 'bold 25px Fredoka, sans-serif';
        ctx.fillText((footerInfo || 'Mérida, Yucatán').slice(0, 52), 54, 1030);
        ctx.fillStyle = '#FDE68A'; ctx.font = 'bold 21px Quicksand, sans-serif';
        ctx.fillText('Entra a MishiMaya Mérida • Red Ciudadana sin Comisiones', 54, 1072);
      };

      if (imgData) {
        const im = new Image();
        im.crossOrigin = 'anonymous';
        im.onload = () => drawBody(im);
        im.onerror = () => drawBody(null);
        im.src = imgData;
      } else {
        drawBody(null);
      }
    }

    function wrapPosterText(ctx, text, x, y, maxW, lh) {
      const words = (text || '').split(' '); let line = '', lines = 0;
      for (let n = 0; n < words.length; n++) {
        const test = line + words[n] + ' ';
        if (ctx.measureText(test).width > maxW && n > 0) {
          ctx.fillText(line, x, y); line = words[n] + ' '; y += lh;
          if (++lines >= 2) break;
        } else line = test;
      }
      ctx.fillText(line, x, y);
    }

    function downloadCanvasPosterPng(name) {
      const cv = document.getElementById('social-poster-canvas'); if (!cv) return;
      const a = document.createElement('a'); a.download = `MishiMaya_${(name || 'Ficha').replace(/\s+/g, '_')}.png`; a.href = cv.toDataURL('image/png'); a.click();
      state.karma += 20; renderAll(); launchNekoCelebration(); notify('Imagen PNG guardada (+20 EXP).');
    }

    function shareCanvasPosterNative(title, shareTxt) {
      const cv = document.getElementById('social-poster-canvas'); if (!cv) return;
      cv.toBlob(async blob => {
        if (!blob) return;
        const file = new File([blob], 'mishimaya_ficha.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ title, text: shareTxt, files: [file] }); state.karma += 20; renderAll(); return; } catch (e) {}
        }
        downloadCanvasPosterPng(title);
      }, 'image/png');
    }

    function shareCanvasPosterWhatsApp(title, shareTxt) {
      const cv = document.getElementById('social-poster-canvas'); if (!cv) return;
      cv.toBlob(async blob => {
        if (blob) {
          const file = new File([blob], 'mishimaya_whatsapp.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try { await navigator.share({ title, text: shareTxt, files: [file] }); state.karma += 20; renderAll(); return; } catch (e) {}
          }
        }
        window.open(`https://wa.me/?text=${encodeURIComponent(shareTxt)}`, '_blank', 'noopener');
        downloadCanvasPosterPng(title);
      }, 'image/png');
    }

    /* =========================================================================
       AUTENTICAZIONE GOOGLE / EMAIL E SUGGERIMENTO CLINICA (GOOGLE MAPS + P2P)
       ========================================================================= */
    async function triggerGoogleFirebaseLogin() {
      NekoSFX.tap();
      if (fbAuth) {
        try {
          const provider = new firebase.auth.GoogleAuthProvider();

    function positionCutoutLensAndShields(el, shape = 'rect') {
      const lens = document.getElementById('tour-cutout-lens');
      const sTop = document.getElementById('tour-lock-top'), sBot = document.getElementById('tour-lock-bottom');
      const sLeft = document.getElementById('tour-lock-left'), sRight = document.getElementById('tour-lock-right');
      if (!lens || !el) return;
      const r = el.getBoundingClientRect();
      const pad = shape === 'circle' ? 8 : 6;
      let top, left, width, height;

      if (shape === 'circle') {
        const side = Math.max(r.width, r.height) + pad * 2;
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        width = side; height = side;
        left = Math.max(2, cx - side / 2);
        top = Math.max(2, cy - side / 2);
        lens.style.borderRadius = '9999px';
      } else {
        top = Math.max(4, r.top - pad);
        left = Math.max(4, r.left - pad);
        width = Math.min(window.innerWidth - 8, r.width + pad * 2);
        height = r.height + pad * 2;
        lens.style.borderRadius = '16px';
      }

      lens.style.top = top + 'px';
      lens.style.left = left + 'px';
      lens.style.width = width + 'px';
      lens.style.height = height + 'px';
      lens.classList.remove('hidden');

      const vw = window.innerWidth, vh = window.innerHeight;
      const rightEdge = Math.min(vw, left + width), bottomEdge = Math.min(vh, top + height);

      sTop.style.cssText = `top:0;left:0;width:${vw}px;height:${top}px;`;
      sBot.style.cssText = `top:${bottomEdge}px;left:0;width:${vw}px;height:${Math.max(0, vh - bottomEdge)}px;`;
      sLeft.style.cssText = `top:${top}px;left:0;width:${left}px;height:${height}px;`;
      sRight.style.cssText = `top:${top}px;left:${rightEdge}px;width:${Math.max(0, vw - rightEdge)}px;height:${height}px;`;

      [sTop, sBot, sLeft, sRight].forEach(sh => {
        sh.classList.remove('hidden');
        sh.onclick = e => {
          e.stopPropagation();
          e.preventDefault();
          NekoSFX.tap();
          notify('Toca únicamente el elemento iluminado o usa los botones del tour.');
        };
      });
    }

    function advanceSpotlightOnInteract() {

          ${step > 0 ? `<button type="button" onclick="startSpotlightTour(${step - 1})" class="neko-btn px-2.5 py-1 bg-[var(--pill-idle)] text-[var(--text-main)] font-bold text-[10px]">‹ Anterior</button>` : `<span></span>`}

  </script>
  <script>
    function haversineMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function isPinFollowed(pinId) {
      return (state.followedPins || []).includes(pinId);
    }

    function toggleFollowPin(pinId, forceFollow = false) {
      state.followedPins = state.followedPins || [];
      const idx = state.followedPins.indexOf(pinId);
      if (idx === -1) {
        state.followedPins.push(pinId);
        if (!forceFollow) { NekoSFX.tap(); notify('🔔 Conectado a la red de este pin: recibirás avisos automáticos.'); }
      } else if (!forceFollow) {
        state.followedPins.splice(idx, 1);
        NekoSFX.tap(); notify('Notificaciones automáticas desactivadas para este pin.');
      }
      saveState();
      if (!document.getElementById('map-pin-card').classList.contains('hidden')) showPinCardOverlay('street', pinId, true);
    }

    function broadcastPinUpdate(item, actionText) {
      toggleFollowPin(item.id, true);
      const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const line = `[${stamp}] ${state.session.label}: ${actionText}`;
      item.inAppMessages = item.inAppMessages || [];
      item.inAppMessages.unshift(line);
      state.inAppAlerts.unshift({ id: 'al-' + Date.now(), pinId: item.id, text: `Red Pin "${item.title}": ${actionText}`, time: stamp });
    }

    function awardKarmaWithCooldown(actionKey, points, isOnceEver = false) {
      state.karmaAwardedLogs = state.karmaAwardedLogs || {};
      const todayStr = new Date().toISOString().slice(0, 10);
      const prev = state.karmaAwardedLogs[actionKey];
      if (isOnceEver && prev) return false;
      if (!isOnceEver && prev === todayStr) return false;
      state.karmaAwardedLogs[actionKey] = isOnceEver ? 'EVER' : todayStr;
      state.karma += points;
      animateKarmaExpBar();
      return true;
    }

    function checkSosTransitReminders() {
      const now = Date.now();
      state.streetItems.forEach(item => {
        if (item.type === 'emergency' && item.status === 'in_transit') {
          const lastRem = item.lastReminderAt || item.responderSince || now;
          if (now - lastRem >= 1800000) {
            item.lastReminderAt = now;
            openSosTransitFollowUpModal(item.id);
          }

    function getUnseenMapNovelties() {
      const list = [];
      state.streetItems.forEach(i => { if (!i.seenNovelty) list.push({ kind: 'street', id: i.id, lat: i.lat, lng: i.lng, ref: i }); });
      state.clinics.forEach(c => { if (!c.confirmed && !c.seenNovelty) list.push({ kind: 'clinic', id: c.id, lat: c.lat, lng: c.lng, ref: c }); });

      setB('badge-cl-triage', clGr); setB('badge-cl-adopt', clAd); setB('badge-cl-camp', clCp); setB('badge-cl-sup', clSp); setB('badge-nav-clinics', clGr + clAd + clCp + clSp);
      setB('badge-map-sos', sos); setB('badge-map-sig', sig); setB('badge-map-cl', clGr); setB('badge-nav-map', unseenCount);

      const g = document.getElementById('gps-notif-count'), btnNov = document.getElementById('btn-map-novelty');

          : 'neko-btn w-9 h-9 rounded-full bg-stone-300 text-stone-600 opacity-55 grayscale flex-col gap-0.5 relative';
      }
    }

    function renderCompactCarousels() {
      ['shelters', 'clinics'].forEach(prefix => {
        const tType = prefix === 'shelters' ? 'shelter' : 'clinic';
        const campList = state.campaigns.filter(c => c.targetType === tType);

        }
      });
      bindAllCarouselSwipes();
    }

    function bindAllCarouselSwipes() {
      [['compact-carousel-top-shelters', 'track-top-shelters', 'shTop'], ['compact-carousel-bottom-shelters', 'track-bot-shelters', 'shBot'], ['compact-carousel-top-clinics', 'track-top-clinics', 'clTop'], ['compact-carousel-bottom-clinics', 'track-bot-clinics', 'clBot']].forEach(([hostId, trackId, key]) => {
        const host = document.getElementById(hostId);
        if (!host || host.dataset.swipeBound) return;
        host.dataset.swipeBound = '1';
        let sx = 0;
        host.addEventListener('touchstart', e => { sx = e.changedTouches[0].screenX; }, { passive: true });
        host.addEventListener('touchend', e => {
          const dx = e.changedTouches[0].screenX - sx;
          const tr = document.getElementById(trackId);
          if (!tr || tr.children.length <= 1 || Math.abs(dx) < 30) return;
          NekoSFX.tap();
          carouselIdx[key] = dx < 0 ? (carouselIdx[key] + 1) % tr.children.length : (carouselIdx[key] - 1 + tr.children.length) % tr.children.length;
          tr.style.transform = `translateX(-${carouselIdx[key] * 100}%)`;
        }, { passive: true });
      });
    }

    function startCarouselTimer() {
      if (carouselTimer) clearInterval(carouselTimer);
      carouselTimer = setInterval(() => {
        ['shTop:track-top-shelters', 'shBot:track-bot-shelters', 'clTop:track-top-clinics', 'clBot:track-bot-clinics'].forEach(pair => {
          const [key, id] = pair.split(':'), tr = document.getElementById(id);
          if (!tr || tr.children.length <= 1) return;
          carouselIdx[key] = (carouselIdx[key] + 1) % tr.children.length;
          tr.style.transform = `translateX(-${carouselIdx[key] * 100}%)`;
        });
      }, 4200);
    }

    const ClusterEngine = {
      getRadiusForZoom(z) { return z <= 11.5 ? 0.042 : (z <= 13 ? 0.020 : 0); },
      collectVisiblePins() {
        const flt = state.mapPinFilter, pins = [];
        state.streetItems.forEach(item => {
          if (flt !== 'all' && flt !== item.type) return;
          let badge = 'En Calle';
          if (item.type === 'emergency') badge = item.status === 'in_transit' ? 'Traslado' : 'SOS';
          else if (item.type === 'colony') badge = 'Colonia';
          else if (item.ownerClaimed || item.catSafetyType === 'owned_collar') badge = 'Casa';
          else if (item.catSafetyType === 'tnr_ear') badge = 'TNR';
          pins.push({ lat: item.lat, lng: item.lng, kind: item.type, subStatus: item.status, overlayKind: 'street', id: item.id, badge, isGrey: false });
        });
        if (flt === 'all' || flt === 'shelters') state.shelters.forEach(s => pins.push({ lat: s.lat, lng: s.lng, kind: 'shelter', subStatus: 'open', overlayKind: 'shelter', id: s.id, badge: 'Refugio', isGrey: false }));
        if (flt === 'all' || flt === 'clinics') state.clinics.forEach(c => pins.push({ lat: c.lat, lng: c.lng, kind: 'clinic', subStatus: c.status, overlayKind: 'clinic', id: c.id, badge: !c.confirmed ? 'Por confirmar' : 'Clínica', isGrey: !c.confirmed }));
        return pins;
      },
      buildClusters(pins, radius) {
        if (radius <= 0) return pins.map(p => ({ items: [p], lat: p.lat, lng: p.lng }));
        const groups = [];
        pins.forEach(p => {
          const g = groups.find(x => Math.hypot(x.lat - p.lat, x.lng - p.lng) < radius);
          if (g) { g.items.push(p); g.lat = g.items.reduce((s, i) => s + i.lat, 0) / g.items.length; g.lng = g.items.reduce((s, i) => s + i.lng, 0) / g.items.length; }
          else groups.push({ lat: p.lat, lng: p.lng, items: [p] });
        });
        return groups;
      },
      declusterGroup(group) {
        if (!mapInstance || !group || !group.items.length) return;
        NekoSFX.tap();
        if (group.items.length === 1) { showPinCardOverlay(group.items[0].overlayKind, group.items[0].id); return; }
        mapInstance.flyToBounds(L.latLngBounds(group.items.map(i => [i.lat, i.lng])), { padding: [54, 54], maxZoom: 15, duration: 0.5 });
      },
      zoomOutOverview() { if (mapInstance) { closeMapPinCard(); mapInstance.flyTo([20.9865, -89.6250], 11.4, { duration: 0.5 }); notify('Vista por Zonas de Mérida activada.'); } }
    };

    function createPointedPinIcon(kind, extraBadge, isGreyClinic, subStatus = 'active') {
      const isTransitSos = kind === 'emergency' && subStatus === 'in_transit';
      const cfg = {
        emergency: { bg: isTransitSos ? '#F97316' : '#EF4444', ring: isTransitSos ? ' transit-ring' : ' sos-ring', anim: 'pin-anim-emergency', ico: nekoSvg('sos', 'w-5 h-5'), defaultTag: isTransitSos ? 'Traslado' : 'SOS' },
        sighting:  { bg: '#38BDF8', ring: '', anim: 'pin-anim-sighting', ico: nekoSvg('cat', 'w-5 h-5'), defaultTag: 'En Calle' },
        colony:    { bg: '#FBBF24', ring: '', anim: 'pin-anim-colony', ico: nekoSvg('colonyCats', 'w-6 h-6'), defaultTag: 'Colonia' },
        shelter:   { bg: '#C87D4B', ring: '', anim: 'pin-anim-shelter', ico: nekoSvg('house', 'w-5 h-5'), defaultTag: 'Refugio' },
        clinic:    { bg: isGreyClinic ? '#9CA3AF' : '#10B981', ring: '', anim: 'pin-anim-clinic', ico: nekoSvg('clinic', 'w-5 h-5'), defaultTag: isGreyClinic ? 'Por confirmar' : 'Clínica' }
      }[kind] || { bg: '#F97316', ring: '', anim: '', ico: nekoSvg('paw', 'w-5 h-5'), defaultTag: 'Pin' };
      const label = extraBadge || cfg.defaultTag;

    function centerOnUserGPS(userClicked) {
      if (!navigator.geolocation) {
        if (userClicked && mapInstance) { mapInstance.flyTo([state.userCoords.lat, state.userCoords.lng], 15, { duration: 0.5 }); notify('GPS no soportado en este navegador'); }
        return;

      navigator.geolocation.getCurrentPosition(pos => {
        state.userCoords = { lat: Number(pos.coords.latitude.toFixed(5)), lng: Number(pos.coords.longitude.toFixed(5)), accuracy: Math.round(pos.coords.accuracy || 6) };
        saveState(); renderHomeMapTab();
        if (userClicked && mapInstance) {
          mapInstance.invalidateSize();
          mapInstance.flyTo([state.userCoords.lat, state.userCoords.lng], 16, { duration: 0.5 });
          notify(`Ubicación GPS centrada (${state.userCoords.lat}, ${state.userCoords.lng})`);

      }, () => {
        if (userClicked && mapInstance) {
          mapInstance.flyTo([state.userCoords.lat, state.userCoords.lng], 14, { duration: 0.5 });
          notify('Activa el permiso de Ubicación GPS en tu dispositivo');

      }, { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 });

    function renderHomeMapTab() {
      initMap(); if (!markersLayer) return; markersLayer.clearLayers();
      const zoom = mapInstance ? mapInstance.getZoom() : 12.5;

      L.marker([state.userCoords.lat, state.userCoords.lng], { icon: L.divIcon({ className: 'leaflet-div-icon-neko', html: `<div class="w-4 h-4 rounded-full bg-emerald-500 border-2 border-white shadow-md"></div>`, iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(markersLayer);

      const groups = ClusterEngine.buildClusters(ClusterEngine.collectVisiblePins(), ClusterEngine.getRadiusForZoom(zoom));

          const hasSos = g.items.some(i => i.kind === 'emergency');
          const cIcon = L.divIcon({
            className: 'leaflet-div-icon-neko',
            html: `<div class="neko-pin-wrap ${hasSos ? 'pin-anim-emergency' : 'pin-anim-colony'}"><div class="neko-pin-head ${hasSos ? 'sos-ring' : ''}" style="background:${hasSos ? '#EF4444' : '#F97316'};color:#FFF;font-family:Fredoka;font-weight:700;font-size:11px"><span class="neko-pin-tag">${hasSos ? 'Zona SOS' : 'Zona'}</span>${g.items.length}</div><div class="neko-pin-tip"></div><div class="neko-pin-dot"></div></div>`,
            iconSize: [44, 52], iconAnchor: [22, 50]
          });
          L.marker([g.lat, g.lng], { icon: cIcon }).on('click', () => ClusterEngine.declusterGroup(g)).addTo(markersLayer);
        } else {
          const p = g.items[0];
          L.marker([p.lat, p.lng], { icon: createPointedPinIcon(p.kind, p.badge, p.isGrey, p.subStatus) }).on('click', () => showPinCardOverlay(p.overlayKind, p.id)).addTo(markersLayer);
        }
      });
    }

    function closeMapPinCard() { document.getElementById('map-pin-card').classList.add('hidden'); AdMobGuard.sync(); }

          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.classList.add('ring-4', 'ring-amber-400');
          setTimeout(() => el.classList.remove('ring-4', 'ring-amber-400'), 1800);

              </div>
              <button type="button" onclick="NekoSFX.tap(); closeMapPinCard()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-[10px] font-bold">✕</button>
            </div>
            <div class="grid ${isClinic ? 'grid-cols-4' : 'grid-cols-3'} gap-1">
              <button type="button" onclick="openEntityDetailModal('${kind}','${ent.id}','campaigns',true)" class="neko-btn py-1.5 bg-[var(--pill-idle)] text-[var(--text-main)] font-bold text-[8.5px]">Vista Rápida</button>
              <button type="button" onclick="NekoSFX.tap(); jumpToEntityCard('${kind}','${ent.id}')" class="neko-btn py-1.5 bg-[#F97316] text-white font-bold text-[8.5px]">Ir a Ficha ➔</button>
              ${isClinic ? `<button type="button" onclick="openP2PVerifyModal('clinic','${ent.id}')" class="neko-btn py-1.5 bg-amber-400 text-[#2B1B10] font-bold text-[8.5px]">Opinar</button>` : ''}
              <button type="button" onclick="openSocialPosterGenerator('${isClinic ? 'CLÍNICA FELINA' : 'REFUGIO'}','${ent.name.replace(/'/g, '')}','${ent.zone} • ${ent.hours}','Servicios: ${(ent.services || []).join(', ')}','CLABE: ${ent.clabe}')" class="neko-btn py-1.5 bg-sky-300 text-[#2B1B10] font-bold text-[8.5px]">Compartir</button>

      box.classList.remove('hidden'); AdMobGuard.sync();

    function openCameraReportModal(type, customLat, customLng) {
      pendingReportType = type;
      const lat = customLat !== undefined ? customLat : state.userCoords.lat;
      const lng = customLng !== undefined ? customLng : state.userCoords.lng;
      const nearbyPins = state.streetItems.filter(p => p.type === type && haversineMeters(lat, lng, p.lat, p.lng) <= 130);
      const nearbyAlertHtml = nearbyPins.length ? `
        <div class="p-2 rounded-xl bg-amber-100 border-2 border-[#2B1B10] space-y-1 text-[10px]">
          <p class="font-neko font-bold text-amber-950">¡Ya existe un reporte en esta misma cuadra (${haversineMeters(lat, lng, nearbyPins[0].lat, nearbyPins[0].lng)}m)!</p>
          <button type="button" onclick="openStreetFolderModal('${nearbyPins[0].id}')" class="w-full neko-btn py-1.5 bg-emerald-400 text-[#2B1B10] font-bold text-[10px]">Añadir Foto al Pin Existente de esta Cuadra</button>
        </div>` : '';

      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs flex items-center gap-1.5">${nekoSvg('camOrb','w-4 h-4')}<span>Nuevo Reporte (${type === 'emergency' ? 'SOS' : (type === 'colony' ? 'COLONIA' : 'EN CALLE')})</span></h3>
          <button type="button" onclick="NekoSFX.tap(); closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        ${nearbyAlertHtml}
        <form onsubmit="submitCameraReport(event,'${type}',${lat},${lng})" class="space-y-2 text-[11px]">
          <div class="p-2 neko-subcard flex items-center justify-between gap-2">
            <div class="text-[10px]">
              <p class="font-neko font-bold">Coordenadas Exactas:</p>
              <p class="font-mono font-bold text-emerald-800">${lat.toFixed(5)}, ${lng.toFixed(5)}</p>
            </div>
            <button type="button" onclick="NekoSFX.tap(); startDragPinPlacement('${type}',${lat},${lng})" class="neko-btn px-2.5 py-1.5 bg-amber-300 text-[#2B1B10] font-bold text-[9.5px] shrink-0">Mover Pin en Primer Plano</button>
          </div>
          <div class="p-2.5 neko-subcard space-y-1.5 text-center">
            <img id="captured-photo-preview" class="${window.lastCapturedDataUrl ? '' : 'hidden'} w-full max-h-56 object-contain rounded-xl border-2 border-emerald-600 bg-black/5 mx-auto" src="${window.lastCapturedDataUrl || ''}" />
            <label class="w-full neko-btn py-2 bg-sky-400 text-[#2B1B10] font-bold text-xs cursor-pointer gap-1.5">
              ${nekoSvg('camOrb','w-4 h-4')}<span>Tomar / Subir Foto Real (Compresión WhatsApp SD)</span>
              <input type="file" accept="image/*" capture="environment" onchange="handleFilePhotoUpload(event)" class="hidden" />
            </label>
          </div>
          ${type !== 'emergency' ? `
            <div class="p-2 neko-subcard space-y-1 text-[10px]">
              <p class="font-neko font-bold text-rose-700">Filtro Anti-Sustracción (Protocolo Casa Segura):</p>
              <select id="rep-safety-type" class="w-full px-2 py-1 rounded border border-[#2B1B10] bg-[#FFFDF7] text-[#2B1B10] font-bold">
                <option value="owned_collar">Bien alimentado / Con collar (Posible dueño en la cuadra - NO retirar)</option>
                <option value="tnr_ear">Muesca en oreja (Gato comunitario TNR - NO retirar)</option>
                <option value="stray_risk">Delgado / Desorientado / En peligro vial</option>
              </select>
            </div>` : ''}
          <input id="rep-title" type="text" required placeholder="Descripción breve del michi *" class="w-full px-2.5 py-1.5 rounded-xl border-2 border-[#3D2618] bg-[#FFFDF7] text-[#2B1B10]" />
          <input id="rep-landmark" type="text" required placeholder="Punto de referencia visual (ej. Portón azul) *" class="w-full px-2.5 py-1.5 rounded-xl border-2 border-[#3D2618] bg-[#FFFDF7] text-[#2B1B10]" />
          <label class="flex items-center gap-1.5 text-[10px]"><input id="rep-follow-pin" type="checkbox" checked class="rounded" /> <span>🔔 Conectarme a la red de notificaciones automáticas de este pin</span></label>
          <button type="submit" class="w-full neko-btn py-2 bg-[#F97316] text-white font-bold text-xs">Publicar Pin en Coordenadas Exactas (+50 EXP)</button>
        </form>`);
    }

    function startDragPinPlacement(type, lat, lng) {
      pendingReportType = type;
      closeCenterModal(); closeMapPinCard(); switchMainTab('map'); initMap();
      if (dragTempMarker && mapInstance) mapInstance.removeLayer(dragTempMarker);
      dragTempMarker = L.marker([lat, lng], { draggable: true, zIndexOffset: 9999, icon: createPointedPinIcon(type, 'Arrastra aquí', false) }).addTo(mapInstance);
      mapInstance.flyTo([lat, lng], 16, { duration: 0.4 });
      const banner = document.getElementById('drag-pin-banner'), cEl = document.getElementById('drag-pin-coords');
      if (banner) banner.classList.remove('hidden');
      if (cEl) cEl.textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      dragTempMarker.on('drag', e => { const p = e.target.getLatLng(); if (cEl) cEl.textContent = `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`; });
    }

    function confirmDraggedPinPosition() {
      if (!dragTempMarker) return;
      const p = dragTempMarker.getLatLng();
      if (mapInstance) mapInstance.removeLayer(dragTempMarker);
      dragTempMarker = null;
      document.getElementById('drag-pin-banner').classList.add('hidden');
      openCameraReportModal(pendingReportType, Number(p.lat.toFixed(5)), Number(p.lng.toFixed(5)));
    }

    function handleFilePhotoUpload(ev, targetPreviewId = 'captured-photo-preview', storeKey = 'lastCapturedDataUrl') {
      const file = ev.target.files?.[0]; if (!file) return;
      compressImageWhatsAppSD(file, dataUrl => {
        window[storeKey] = dataUrl;
        const prev = document.getElementById(targetPreviewId);
        if (prev) { prev.src = dataUrl; prev.classList.remove('hidden'); }
        NekoSFX.celebrate();
        notify('Foto real optimizada con nitidez WhatsApp SD (1280px).');
      });
    }

    function submitCameraReport(ev, type, lat, lng) {
      ev.preventDefault();
      const title = document.getElementById('rep-title').value.trim(), lm = document.getElementById('rep-landmark').value.trim();
      const safetyType = document.getElementById('rep-safety-type')?.value || 'stray_risk';
      const autoFollow = !!document.getElementById('rep-follow-pin')?.checked;
      const id = 'pin-' + Date.now();
      state.streetItems.unshift({
        id, type, title, details: lm, lat, lng, status: 'active', responderName: '', responderSince: 0, lastReminderAt: 0, createdAt: Date.now(),
        paScore: state.session.paWeight || 1, paRequired: type === 'colony' ? 6 : 3, closeFlags: 0, quarantineNotice: false, seenNovelty: false,
        catSafetyType: safetyType, ownerClaimed: false, lastConfirmedText: 'Hace un momento',
        relatedType: 'clinic', relatedId: 'amicagatos', allowPublicWa: false, reporterWa: '',
        inAppMessages: [`Reporte inicial publicado por ${state.session.label}.`],
        folderPhotos: [{ kind: 'cat', label: 'Foto Principal del Michi', note: title, author: state.session.label, imgData: window.lastCapturedDataUrl || '' }, { kind: 'landmark', label: 'Punto de referencia', note: lm, author: state.session.label, imgData: '' }]
      });
      if (autoFollow) toggleFollowPin(id, true);
      window.lastCapturedDataUrl = ''; state.karma += 50; closeCenterModal(); switchMainTab('map'); renderAll(); showPinCardOverlay('street', id);
      animateKarmaExpBar(); launchNekoCelebration(); notify('Pin publicado y conectado a tu red de avisos (+50 EXP).');
    }

      const photosHtml = (item.folderPhotos || []).map(p => `
        <div class="p-2 neko-subcard space-y-1">
          <div class="flex items-center justify-between">
            <span class="px-1.5 py-0.5 rounded ${p.kind === 'landmark' ? 'bg-amber-300' : 'bg-sky-300'} text-[#2B1B10] font-neko font-bold text-[8.5px]">${p.label}</span>

          <p class="text-[10px] font-semibold">${p.note}</p>

      openCenterModal(`
        <div class="flex justify-between items-center border-b pb-1.5">
          <h3 class="font-neko font-bold text-xs">Álbum de la Cuadra (${(item.folderPhotos || []).length} Fotos): ${item.title}</h3>
          <button type="button" onclick="NekoSFX.tap(); closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <div class="space-y-2 text-[11px]">
          <div class="space-y-1.5 max-h-60 overflow-y-auto">${photosHtml}</div>
          <form onsubmit="addPhotoOrLandmarkToExistingPin(event,'${item.id}')" class="p-2.5 neko-subcard space-y-1.5">
            <p class="font-neko font-bold text-[10px]">Añadir Nueva Foto o Punto de Referencia a este Pin:</p>
            <img id="captured-photo-preview" class="hidden w-full max-h-44 object-contain rounded-lg border border-emerald-600 mx-auto" />
            <div class="grid grid-cols-2 gap-1">
              <select id="add-ph-kind" class="px-2 py-1 rounded border border-[#2B1B10] bg-[#FFFDF7] text-[#2B1B10] font-bold text-[9.5px]">
                <option value="cat">Nueva Foto del Michi</option>
                <option value="landmark">Punto de Referencia</option>
              </select>
              <label class="neko-btn py-1 bg-sky-300 text-[#2B1B10] font-bold text-[9.5px] cursor-pointer gap-1">
                ${nekoSvg('camOrb','w-3.5 h-3.5')}<span>Subir / Tomar Foto</span>
                <input type="file" accept="image/*" capture="environment" onchange="handleFilePhotoUpload(event)" class="hidden" />
              </label>
            </div>
            <input id="new-lm-note" type="text" required placeholder="Nota (ej. Sigue aquí hoy / Portón verde) *" class="w-full px-2 py-1 rounded border border-[#2B1B10] bg-[#FFFDF7] text-[#2B1B10] text-[10px]" />
            <button type="submit" class="w-full neko-btn py-1.5 bg-emerald-400 text-[#2B1B10] font-bold text-[10px]">Guardar en este Pin y Avisar a la Red</button>
          </form>
        </div>`);
    }

    function addPhotoOrLandmarkToExistingPin(ev, pinId) {
      ev.preventDefault();
      const item = state.streetItems.find(x => x.id === pinId), note = document.getElementById('new-lm-note').value.trim();
      const kind = document.getElementById('add-ph-kind').value;
      if (item && note) {
        item.folderPhotos.unshift({ kind, label: kind === 'cat' ? 'Avistamiento actualizado en la cuadra' : 'Punto de referencia', note, author: state.session.label, imgData: window.lastCapturedDataUrl || '' });
        broadcastPinUpdate(item, `Subió nueva foto: "${note}"`);
        window.lastCapturedDataUrl = '';
        const gotBonus = awardKarmaWithCooldown('photo_' + pinId, 25, false);
        renderAll(); openStreetFolderModal(pinId);
        notify(gotBonus ? 'Foto agregada y notificada a la red (+25 EXP).' : 'Foto agregada y notificada a la red (Bono diario ya otorgado hoy).');
      }
    }

      NekoSFX.tap();
      state.originFilter = state.originFilter || { adopt: 'all', campaigns: 'all' };
      state.originFilter[sectionKey] = val;
      renderAll();
    }

      window.lastVolCatImg = ''; window.lastVolRecetaImg = '';
      const isCamp = sectionKey === 'campaigns';
      openCenterModal(`

    function submitVolunteerPublish(ev, sectionKey, targetType) {
      ev.preventDefault();
      const name = document.getElementById('vol-pub-name').value.trim();
      const entName = document.getElementById('vol-pub-ent').value.trim();
      const desc = document.getElementById('vol-pub-desc').value.trim();
      const wa = document.getElementById('vol-pub-wa').value.replace(/\D/g, '') || '529991112233';
      if (sectionKey === 'campaigns') {
        const goal = parseInt(document.getElementById('vol-pub-goal').value, 10) || 1500;
        const clabe = document.getElementById('vol-pub-clabe').value.trim();
        state.campaigns.unshift({
          id: 'camp-vol-' + Date.now(), origin: 'volunteer', targetType, entityId: 'volunteer',
          entityName: `Voluntario: ${entName}`, whatsapp: wa, catName: name, desc, clabe,
          raisedMxn: 0, targetMxn: goal, pendingMxn: 0,
          catImg: window.lastVolCatImg || '', recetaImg: window.lastVolRecetaImg || ''
        });
      } else {
        const beforeDesc = document.getElementById('vol-pub-before').value.trim();
        state.adoptions.unshift({
          id: 'ad-vol-' + Date.now(), origin: 'volunteer', name, coat: state.theme,
          entityId: 'volunteer', entityType: targetType, entityName: `Hogar Temporal: ${entName}`,
          whatsapp: wa, health: 'En Hogar Temporal • Protocolo Responsable', status: 'available',
          beforeDesc, afterDesc: desc, photoUrl: window.lastVolCatImg || ''
        });
      }
      state.karma += 60; closeCenterModal(); renderAll(); animateKarmaExpBar(); launchNekoCelebration();
      notify('¡Publicación ciudadana activa con respaldo fotográfico (+60 EXP)!');
    }

    function viewMedicalReceiptModal(campId) {

      openCenterModal(`

          <h3 class="font-neko font-bold text-xs flex items-center gap-1.5">${nekoSvg('receipt','w-4 h-4')}<span>Receta / Presupuesto Médico: ${c.catName}</span></h3>
          <button type="button" onclick="NekoSFX.tap(); closeCenterModal()" class="neko-btn px-2 py-0.5 bg-stone-200 text-[#2B1B10] text-xs font-bold">✕</button>
        </div>
        <div class="space-y-2 text-[11px] text-center">
          <p class="text-[10px] opacity-85">Comprobante médico subido por <strong>${c.entityName}</strong> como garantía de buena fe:</p>
          ${c.recetaImg ? `<img src="${c.recetaImg}" class="w-full max-h-80 object-contain rounded-xl border-2 border-[#2B1B10] mx-auto" />` : `<div class="p-4 neko-subcard font-bold">Comprobante verificado directamente en recepción de ${c.entityName}.</div>`}

            <div class="grid grid-cols-3 gap-1.5">
              <button type="button" onclick="openEntityDetailModal('shelter','${s.id}','campaigns',false)" class="neko-btn py-1.5 bg-[var(--pill-idle)] text-[var(--text-main)] font-bold text-[9px] gap-1">${nekoSvg('heart','w-3 h-3')}<span>Campañas</span>${cN ? `<span class="action-tag-notif">${cN}</span>` : ''}</button>
              <button type="button" onclick="openEntityDetailModal('shelter','${s.id}','supplies',false)" class="neko-btn py-1.5 bg-amber-300 text-[#2B1B10] font-bold text-[9px] gap-1">${nekoSvg('box','w-3 h-3')}<span>Insumos</span>${sN ? `<span class="action-tag-notif">${sN}</span>` : ''}</button>
              <button type="button" onclick="openEntityDetailModal('shelter','${s.id}','adopt',false)" class="neko-btn py-1.5 bg-emerald-300 text-[#2B1B10] font-bold text-[9px] gap-1">${nekoSvg('cat','w-3 h-3')}<span>Adopción</span>${aN ? `<span class="action-tag-notif">${aN}</span>` : ''}</button>

      document.getElementById('subview-shelters-campaigns').innerHTML = renderCampaignsList('shelter');

    function adjustShelterCapacity(delta) {
      const sh = state.shelters[0]; if (!sh) return;
      sh.activeCats = sh.activeCats >= sh.maxCapacity ? sh.maxCapacity - 2 : sh.activeCats + delta;
      renderAll(); notify(`Ocupación de ${sh.name} actualizada: ${sh.activeCats}/${sh.maxCapacity}`);
    }

    function renderClinicsTab() {
      const role = state.session.role, isClinicOrAdmin = role === 'clinic' || role === 'admin';

        <div class="p-2.5 rounded-xl bg-emerald-200 border-2 border-[#2B1B10] flex items-center justify-between text-[10px]">

                  ${c.appMember ? `<span class="partner-app-badge">${nekoSvg('medal','w-3 h-3')}<span>App Oficial</span></span>` : ''}

              </div>
              <button type="button" onclick="openSocialPosterGenerator('CLÍNICA FELINA','${c.name.replace(/'/g, '')}','${c.zone} • ${c.hours}','Servicios: ${c.services.join(', ')}','Tel: ${c.phone}')" class="neko-btn px-2 py-0.5 bg-sky-300 text-[#2B1B10] font-bold text-[8.5px] gap-1 shrink-0">${nekoSvg('share','w-3 h-3')}<span>Compartir</span></button>

            </div>
            ${isGrey ? `

                <button type="button" onclick="openP2PVerifyModal('clinic','${c.id}')" class="neko-btn py-1.5 bg-amber-400 text-[#2B1B10] font-bold text-[9.5px]">Confirmar que esta clínica existe <span class="action-tag-notif">1</span></button>

    function renderGroupedSuppliesByEntity(targetType) {
      const canConfirm = state.session.role === targetType || state.session.role === 'admin';
      const entities = (targetType === 'shelter' ? state.shelters : state.clinics).filter(e => state.supplies.some(s => s.entityId === e.id));
      return entities.map(ent => {
        const activeItems = state.supplies.filter(s => s.targetType === targetType && s.entityId === ent.id && !s.fulfilled);
        const rowsHtml = activeItems.length ? activeItems.map(s => `
          <div class="p-2 neko-subcard space-y-1">
            <div class="flex items-center justify-between gap-2">
              <div class="min-w-0 flex-1">
                <p class="font-neko font-bold text-[10.5px] truncate"><span class="px-1.5 py-0.2 rounded ${s.pendingConfirm ? 'bg-amber-400 text-[#2B1B10]' : 'bg-rose-500 text-white'} text-[8px] mr-1">${s.pendingConfirm ? 'En revisión' : s.storeName}</span>${s.title}</p>
                <p class="text-[9px] opacity-80">${s.sub}</p>
              </div>
              <button type="button" onclick="notifySupplyPurchaseToEntity('${s.id}')" class="neko-btn px-2 py-1.5 bg-amber-300 text-[#2B1B10] font-bold text-[9px] shrink-0">${s.pendingConfirm ? 'Envío Notificado' : 'Comprar y Notificar Envío'}</button>
            </div>
            ${s.pendingConfirm && canConfirm ? `<button type="button" onclick="confirmSupplyReceivedByEntity('${s.id}')" class="w-full neko-btn py-1 bg-emerald-400 text-[#2B1B10] font-bold text-[9px]">Confirmar recepción en ${ent.name}</button>` : ''}
          </div>`).join('') : `<div class="p-2.5 neko-subcard text-center text-[10px] font-neko font-bold text-emerald-700">¡Todos los insumos mínimos de ${ent.name} fueron cubiertos!</div>`;
        return `
          <div class="neko-card p-3 space-y-2 text-[11px]">
            <div class="flex items-center justify-between border-b border-[var(--outline)]/20 pb-1.5">
              <div><h4 class="font-neko font-bold text-xs">Insumos de ${ent.name}</h4><p class="text-[9px] opacity-75">Se actualizan cuando la entidad confirma recepción</p></div>
              <button type="button" onclick="openSocialPosterGenerator('LISTA DE INSUMOS','${ent.name.replace(/'/g, '')}','Faltan: ${activeItems.map(i => i.title).join(', ') || 'Meta cubierta'}','${ent.zone}','Apoya enviando insumos')" class="neko-btn px-2 py-1 bg-sky-300 text-[#2B1B10] font-bold text-[8.5px] gap-1">${nekoSvg('share','w-3 h-3')}<span>Compartir</span></button>
            </div>
            <div class="space-y-1.5">${rowsHtml}</div>
          </div>`;
      }).join('');
    }

    function notifySupplyPurchaseToEntity(id) {
      const s = state.supplies.find(x => x.id === id); if (!s) return;
      window.open(s.url, '_blank', 'noopener');
      s.pendingConfirm = true; renderAll();
      notify(`Envío notificado a ${s.entityName}.`);
    }

    function confirmSupplyReceivedByEntity(id) {
      const s = state.supplies.find(x => x.id === id); if (!s) return;
      s.fulfilled = true; s.pendingConfirm = false; state.karma += 60;
      renderAll(); animateKarmaExpBar(); launchNekoCelebration();
      notify(`Recepción confirmada por ${s.entityName} (+60 EXP).`);
    }

      const canConfirm = state.session.role === targetType || state.session.role === 'admin';

        const pct = Math.min(100, Math.round((c.raisedMxn / c.targetMxn) * 100)), paused = c.raisedMxn >= c.targetMxn;

        return `

                <div class="flex items-center gap-1 flex-wrap">

                <p class="text-[9.5px] font-bold opacity-75">${c.entityName}</p>

              <div class="flex items-center gap-1">

              </div>

            ${c.catImg ? `<img src="${c.catImg}" class="w-full max-h-40 object-contain rounded-lg border border-[#2B1B10] bg-black/5" />` : ''}
            <p class="text-[10px] opacity-90">${c.desc}</p>

            ${paused ? `<div class="w-full py-1.5 rounded-xl bg-amber-300 border-2 border-[#2B1B10] text-[#2B1B10] font-neko font-bold text-[10px] text-center">¡Meta 100% Alcanzada! Donaciones en Pausa</div>` : `<div class="grid grid-cols-2 gap-1.5"><button type="button" onclick="openDonationHubModal('${c.id}')" class="neko-btn py-1.5 bg-emerald-400 text-[#2B1B10] font-bold text-[9.5px] gap-1">${nekoSvg('coin','w-3.5 h-3.5')}<span>Notificar Donación SPEI</span><span class="action-tag-notif">1</span></button><a href="https://wa.me/${c.whatsapp}" target="_blank" rel="noopener noreferrer" class="neko-btn py-1.5 bg-amber-300 text-[#2B1B10] font-bold text-[9.5px] gap-1">${nekoSvg('chat','w-3.5 h-3.5')}<span>WhatsApp</span></a></div>`}
          </div>`;
      }).join('');

    function confirmCampaignSpeiByEntity(campId) {
      const c = state.campaigns.find(x => x.id === campId); if (!c || !c.pendingMxn) return;
      c.raisedMxn = Math.min(c.targetMxn, c.raisedMxn + c.pendingMxn);
      c.pendingMxn = 0; state.karma += 100;
      renderAll(); animateKarmaExpBar(); launchNekoCelebration();
      notify(`Recepción SPEI confirmada por ${c.entityName} (+100 EXP).`);
    }

                    <div><h4 class="font-neko font-bold text-[11.5px]">${cat.name}</h4><p class="text-[9px] font-bold opacity-75">${cat.health}</p></div>
